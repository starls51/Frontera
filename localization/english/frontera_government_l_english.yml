 gov_frontier_territory_frontera:0 "Organized Territory"
 gov_frontier_territory_frontera_desc:2 "This is a [concept_government_type] ruled by an appointed colonial administration, on behalf of their colonial overlord.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 law_frontier_territorial_administration:0 "Territorial Council"
 law_frontier_territorial_administration_desc:0 "The state is legally a sub-division of a foreign power, possessing no sovereignty of its own. It has been granted limited authority to administer a patchwork of territorial holdings. By design, the territorial government is intended foster migration and population growth, leading to the eventual integration with their overlord."
