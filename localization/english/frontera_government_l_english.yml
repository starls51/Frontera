l_english:
 gov_frontier_territory_frontera:0 "#bold Organized Territory#!"
 gov_frontier_territory_frontera_desc:2 "This is a [concept_government_type] ruled by an appointed colonial administration, on behalf of their colonial overlord.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 law_frontier_territorial_administration:0 "Territorial Council"
 law_frontier_territorial_administration_desc:0 "The state is legally a sub-division of a foreign power, possessing no sovereignty of its own. It has been granted limited authority to administer a patchwork of territorial holdings. By design, the territorial government is intended foster migration and population growth, leading to the eventual integration with their overlord."
 frontera_organized_territory: "Organized Territory"
 frontera_organized_territory_action_name: "[concept_colony_subject]"
 frontera_organized_territory_action_propose_name: "Make into [concept_colony_subject]"
 frontera_organized_territory_action_break_name: "Grant Independence"
 frontera_organized_territory_action_ask_to_break_name: "Demand Independence"
 frontera_organized_territory_desc: "Establishes a [concept_colony_subject] [concept_subject_type] relationship between two [Concept('concept_country', '$concept_countries$')]."
 frontera_organized_territory_pact_desc: "[SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName] is a [concept_colony_subject] of [SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName]."
 frontera_organized_territory_action_notification_name: "Demand for [concept_colony_subject]"
 frontera_organized_territory_action_notification_desc: "[INITIATOR_COUNTRY.GetName] demands that we submit to them and become their [concept_colony_subject]."
 frontera_organized_territory_action_notification_break_name: "Independence Granted"
 frontera_organized_territory_action_notification_break_desc: "[INITIATOR_COUNTRY.GetName] have ended our [concept_colony_subject] status. We are independent once again."
 frontera_organized_territory_proposal_notification_break_name: "Demand for Independence"
 frontera_organized_territory_proposal_notification_break_desc: "[INITIATOR_COUNTRY.GetName] are demanding that we end their [concept_colony_subject] status."
 frontera_organized_territory_proposal_notification_break_effects_desc: "If we accept, they will become fully independent."
 frontera_organized_territory_proposal_break_accepted_name: "Independence Granted"
 frontera_organized_territory_proposal_break_accepted_desc: "[TARGET_COUNTRY.GetName] accepted the demand to end our [concept_colony_subject] status. We are independent once again."
 frontera_organized_territory_proposal_break_declined_name: "Independence Refused"
 frontera_organized_territory_proposal_break_declined_desc: "[TARGET_COUNTRY.GetName] refused the demand to end our [concept_colony_subject] status."
 frontera_organized_territory_action_third_party_notification_break_name: "Independence Granted"
 frontera_organized_territory_action_third_party_notification_break_desc: "[INITIATOR_COUNTRY.GetName] ended the [concept_colony_subject] status of [TARGET_COUNTRY.GetName], granting them full independence."
 frontera_organized_territory_proposal_third_party_break_accepted_name: "Independence Granted"
 frontera_organized_territory_proposal_third_party_break_accepted_desc: "[TARGET_COUNTRY.GetName] ended the [concept_colony_subject] status of [INITIATOR_COUNTRY.GetName], granting them full independence."
 frontera_organized_territory_proposal_third_party_break_declined_name: "Independence Refused"
 frontera_organized_territory_proposal_third_party_break_declined_desc: "[TARGET_COUNTRY.GetName] refused to end the [concept_colony_subject] status of [INITIATOR_COUNTRY.GetName]."
 frontera_organized_territory_proposal_notification_name: "Subjugation Demand"
 frontera_organized_territory_proposal_notification_desc: "[INITIATOR_COUNTRY.GetName] demands that we submit to them and become their [concept_colony_subject]."
 frontera_organized_territory_proposal_notification_effects_desc: "If we accept, we will become their subject."
 frontera_organized_territory_proposal_accepted_name: "Subjugation Accepted"
 frontera_organized_territory_proposal_accepted_desc: "[TARGET_COUNTRY.GetName] accepted the demand for them to become our [concept_colony_subject]."
 frontera_organized_territory_proposal_declined_name: "Subjugation Refused"
 frontera_organized_territory_proposal_declined_desc: "[TARGET_COUNTRY.GetName] declined the demand for them to become our [concept_colony_subject]."
 frontera_organized_territory_proposal_third_party_accepted_name: "Country Subjugated"
 frontera_organized_territory_proposal_third_party_accepted_desc: "[TARGET_COUNTRY.GetName] agreed to become the [concept_colony_subject] of [INITIATOR_COUNTRY.GetName]."
 frontera_organized_territory_proposal_third_party_declined_name: "Subjugation Refused"
 frontera_organized_territory_proposal_third_party_declined_desc: "[TARGET_COUNTRY.GetName] refused to become the [concept_colony_subject] of [INITIATOR_COUNTRY.GetName]."
 frontera_organized_territory_effect_desc_global: "Becomes a [concept_colony_subject]"
 frontera_organized_territory_effect_desc_first: "[TARGET_COUNTRY.GetName] becomes a [COUNTRY.GetAdjectiveNoFlag] [concept_colony_subject]"
 frontera_organized_territory_effect_desc_third: "[AddTextIf(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self),TARGET_COUNTRY.GetNameNoFlag)][AddTextIf(Not(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self)),TARGET_COUNTRY.GetName)] becomes a [concept_colony_subject] of [COUNTRY.GetName]"
 frontera_organized_territory_trigger_desc_global: "Is a [concept_colony_subject]"
 frontera_organized_territory_trigger_false_desc_global: "Is #b not#! a [concept_colony_subject]"
 frontera_organized_territory_trigger_desc_first: "[TARGET_COUNTRY.GetName] is a [COUNTRY.GetAdjectiveNoFlag] [concept_colony_subject]"
 frontera_organized_territory_trigger_false_desc_first: "[TARGET_COUNTRY.GetName] is #b not#! a [COUNTRY.GetAdjectiveNoFlag] [concept_colony_subject]"
 frontera_organized_territory_trigger_desc_third: "[COUNTRY.GetName] is a [concept_colony_subject] of [AddTextIf(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self),TARGET_COUNTRY.GetNameNoFlag)][AddTextIf(Not(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self)),TARGET_COUNTRY.GetName)]"
 frontera_organized_territory_trigger_false_desc_third: "[COUNTRY.GetNameNoFlag] is #b not#! a [concept_colony_subject] of [AddTextIf(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self),TARGET_COUNTRY.GetName)][AddTextIf(Not(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self)),TARGET_COUNTRY.GetName)]"