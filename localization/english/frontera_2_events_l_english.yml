l_english:
 frontera_ot.1:0 "Unorganized Territory"
 frontera_ot.1.t:0 "Unorganized Territory"
 frontera_ot.1.d:0 "[SCOPE.sCountry('overlord_scope').GetNameNoFlag] has little interest in preserving [SCOPE.sCountry('ot_scope').GetNameNoFlag] under a distinct governing body."
 frontera_ot.1.f:0 "This territory will become unorganized, unincorporated [SCOPE.sCountry('overlord_scope').GetAdjectiveNoFlag] land. However, it could one day be incorporated into a new territory."
 frontera_ot.1.a:0 "Perhaps the Governor will find another job..."
 frontera_ot.2:0 "Wagons West!"
 frontera_ot.2.t:0 "Wagons West!"
 frontera_ot.2.d:0 "[SCOPE.sCountry('overlord_scope').GetAdjectiveNoFlag] settlers are moving to [SCOPE.sState('ot_state_scope').GetName]"
 frontera_ot.2.f:0 "Frontier migrants will bring a unique blend of histories and beliefs. Their journey into new lands will not only test who they are, but shape who they become.\n\n#bold These new settlers are...#!"
 frontera_ot.2.a:0 "[SCOPE.sPop('pop_a_scope').GetCulture.GetName] [SCOPE.sPop('pop_a_scope').GetPopType.GetNameNoIcon], often overheard discussing the [SCOPE.sPoliticalMovement('movement_a_scope').GetNameNoIcon]."
 frontera_ot.2.b:0 "[SCOPE.sPop('pop_b_scope').GetCulture.GetName] [SCOPE.sPop('pop_b_scope').GetPopType.GetNameNoIcon], infighting over the [SCOPE.sPoliticalMovement('movement_b_scope').GetNameNoIcon]."
 frontera_ot.2.c:0 "[SCOPE.sPop('pop_c_scope').GetCulture.GetName] [SCOPE.sPop('pop_c_scope').GetPopType.GetNameNoIcon], with quiet convictions about the [SCOPE.sPoliticalMovement('movement_c_scope').GetNameNoIcon]."
 frontera_ot.3:0 "Territorial Ordinance"
 frontera_ot.3.t:0 "The [SCOPE.sState('newly_formed_colonial_nation_anchor_state').GetNameNoFormatting] Ordinance"
 frontera_ot.3.d:0 "After much deliberation, the outline for a new [concept_organized_territory] is nearing definition. Only some minor details remain to be clarified."
 frontera_ot.3.f:0 "The [Concept('concept_unincorporated_state','$concept_unincorporated_state$')] of [SCOPE.sState('newly_formed_colonial_nation_anchor_state').GetName] has been determined to be a suitable [Concept('concept_capital_state','$concept_capital_state_short$')]. Once the boundaries are finalized, a local government may be appointed to administer the territory. \n\n#bold Where will this territory be created?#!"
 frontera_ot.3.a:0 "Establish the territory around [SCOPE.sState('newly_formed_colonial_nation_anchor_state').GetName]."
 frontera_ot.3.b:0 "Establish the territory in the [SCOPE.sStrategicRegion('region_scope').GetName] region."
 frontera_ot.3.c:0 "On second thought, this can wait."
 frontera_acw_events.3.t:0 "The [SCOPE.sCharacter('wilmot_proviso_ig_leader').GetLastName] Proviso"
 frontera_acw_events.3.d:0 "[SCOPE.sCharacter('wilmot_proviso_ig_leader').GetFullName], leader of the [SCOPE.gsInterestGroup('wilmot_proviso_ig').GetName], has proposed outright prohibiting slavery in all our new territories. Some opponents demand simple moderation, but others are demanding legalization of slavery in all new territories."
 frontera_acw_events.3.f:0 ""This intolerable institution cannot spread its influence any further! A free nation needs free soil if it is to thrive!""
 frontera_acw_events.3.a:0 "Reject the proviso, this remains a state-by-state issue."
 frontera_acw_events.3.b:0 "Accept the proviso, and abolish slavery in the territories."
 frontera_acw_events.3.c:0 "Reject the proviso, and expand slavery in the territories."
 frontera_ot.4:0 "Border Dispute"
 frontera_ot.4.t:0 "Border Dispute"
 frontera_ot.4.d:0 "[SCOPE.sCountry('ot_1_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('ot_1_scope').GetRuler.GetLastName] has approached the government with concerns over an unclear boundary with [SCOPE.sCountry('ot_2_scope').GetNameNoFormatting]. Tax collectors claiming to represent [SCOPE.sCountry('ot_2_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('ot_2_scope').GetRuler.GetLastName] have attempted to collect from settlements in [SCOPE.sState('ot_1_state_scope').GetName]."
 frontera_ot.4.f:0 "Who could tell little borders from wrinkles on this grubby old map?"
 frontera_ot.4.a:0 "Order a resurvey in [SCOPE.sCountry('ot_1_scope').GetNameNoFlag]."
 frontera_ot.4.b:0 "The [SCOPE.sCountry('ot_2_scope').GetRuler.GetPrimaryRoleTitle] of [SCOPE.sCountry('ot_2_scope').GetNameNoFlag] is within his rights."
 frontera_ot.4.c:0 "Yes! Carnage! Blood for the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]!"
 frontera_ot.4.e:0 "Yes! Carnage! Blood for the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]!"