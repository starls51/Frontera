l_english:
 frontera_ot.1:0 "Unorganized Territory"
 frontera_ot.1.t:0 "Unorganized Territory"
 frontera_ot.1.d:0 "[SCOPE.sCountry('overlord_scope').GetNameNoFlag] has little interest in preserving [SCOPE.sCountry('ot_scope').GetNameNoFlag] under a distinct governing body."
 frontera_ot.1.f:0 "This territory will become unorganized, unincorporated [SCOPE.sCountry('overlord_scope').GetAdjectiveNoFlag] land. However, it could one day be incorporated into a new territory."
 frontera_ot.1.a:0 "Perhaps the Governor will find another job..."
 frontera_ot.2:0 "Wagons West!"
 frontera_ot.2.t:0 "Wagons West!"
 frontera_ot.2.d:0 "[SCOPE.sCountry('overlord_scope').GetAdjectiveNoFlag] settlers are planning to settle in [SCOPE.sCountry('ot_scope').GetNameNoFlag]."
 frontera_ot.2.f:0 "The settlers will bring a unique mix of backgrounds and ideologies, and their journey will not only test who they are, but shape who they are to become."
 frontera_ot.2.a:0 "One party of [SCOPE.sPop('pop_a_scope').GetCulture.GetName] settlers have been discussing the [SCOPE.sPoliticalMovement('movement_a_scope').GetName]"
 frontera_ot.2.b:0 "Another group of [SCOPE.sPop('pop_b_scope').GetCulture.GetName] settlers often argue over the [SCOPE.sPoliticalMovement('movement_b_scope').GetName]"
 frontera_ot.2.c:0 "An eccentric band of [SCOPE.sPop('pop_c_scope').GetCulture.GetName] settlers get into a scuffle over the [SCOPE.sPoliticalMovement('movement_c_scope').GetName]"