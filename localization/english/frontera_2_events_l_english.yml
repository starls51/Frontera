l_english:
 frontera_ot.1:0 "Unorganized Territory"
 frontera_ot.1.t:0 "Unorganized Territory"
 frontera_ot.1.d:0 "[SCOPE.sCountry('overlord_scope').GetNameNoFlag] has little interest in preserving [SCOPE.sCountry('ot_scope').GetNameNoFlag] under a distinct governing body."
 frontera_ot.1.f:0 "This territory will become unorganized, unincorporated [SCOPE.sCountry('overlord_scope').GetAdjectiveNoFlag] land. However, it could one day be incorporated into a new territory."
 frontera_ot.1.a:0 "Perhaps the Governor will find another job..."
 frontera_ot.2:0 "Wagons West!"
 frontera_ot.2.t:0 "Wagons West!"
 frontera_ot.2.d:0 "[SCOPE.sCountry('overlord_scope').GetAdjectiveNoFlag] settlers are moving to [SCOPE.sState('ot_state_scope').GetName]"
 frontera_ot.2.f:0 "Frontier migrants will bring a unique blend of histories and beliefs. Their journey into new lands will not only test who they are, but shape who they become.\n\n#bold These new settlers are...#!"
 frontera_ot.2.a:0 "[SCOPE.sPop('pop_a_scope').GetCulture.GetName] [SCOPE.sPop('pop_a_scope').GetPopType.GetNameNoIcon], often overheard discussing the [SCOPE.sPoliticalMovement('movement_a_scope').GetNameNoIcon]."
 frontera_ot.2.b:0 "[SCOPE.sPop('pop_b_scope').GetCulture.GetName] [SCOPE.sPop('pop_b_scope').GetPopType.GetNameNoIcon], infighting over the [SCOPE.sPoliticalMovement('movement_b_scope').GetNameNoIcon]."
 frontera_ot.2.c:0 "[SCOPE.sPop('pop_c_scope').GetCulture.GetName] [SCOPE.sPop('pop_c_scope').GetPopType.GetNameNoIcon], with quiet convictions about the [SCOPE.sPoliticalMovement('movement_c_scope').GetNameNoIcon]."
 frontera_ot.3:0 "Territorial Ordinance"
 frontera_ot.3.t:0 "The [SCOPE.sState('newly_formed_colonial_nation_anchor_state').GetNameNoFormatting] Ordinance"
 frontera_ot.3.d:0 "After much deliberation, the outline for a new Organized Territory is nearing definition. Only some minor details remain to be clarified."
 frontera_ot.3.f:0 "The [Concept('concept_unincorporated_state','$concept_unincorporated_states$')] of [SCOPE.sState('newly_formed_colonial_nation_anchor_state').GetName] has been determined to be a suitable [Concept('concept_capital_state','$concept_capital_state_short$')]. Once the boundaries are finalized, a local government may be appointed to administer the territory. \n\n#bold Where will this territory be created?#!"
 frontera_ot.3.a:0 "Establish an #bold Organized Territory#! around [SCOPE.sState('newly_formed_colonial_nation_anchor_state').GetName]."
 frontera_ot.3.b:0 "Establish an #bold Organized Territory#! in the [SCOPE.sStrategicRegion('region_scope').GetName] region."
 frontera_ot.3.c:0 "On second thought, this can wait."
 frontera_ot_creation_reset_tt:0 "Cooldown timer for creating a new #bold Organized Territory#! will reset\n\n#italic Placing a [GetDecreeType('decree_greener_grass_campaign').GetName] [concept_decree] in an [concept_unincorporated_state] adjacent to an [concept_incorporated_state] can determine which [concept_state] is selected to be the new territory's [Concept('concept_capital_state','$concept_capital_state_short$')] next time this event is triggered.#!"
 modifier_frontier_politics_neg_frontera:0 "Rush to the Hinterlands"
 modifier_frontier_politics_pos_frontera:0 "Arrivals from the Heartlands"
 frontera_establish_ot_in_region_tt:0 "A [concept_subject] [concept_country] will be created.\n$EFFECT_LIST_BULLET$The following [Concept('concept_unincorporated_state','$concept_unincorporated_states$')] will be ceded:#indent_newline:2 #indent_newline:2 "
 frontera_stateslist_tt:0 "[THIS.GetState.GetName]"