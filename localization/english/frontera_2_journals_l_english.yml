l_english:
 je_organized_territories_frontera:0 "Organize Territory"
 je_organized_territories_frontera_reason:0 "In pursuit of expanding our nation, an [concept_organized_territory] may be established from some of our [Concept('concept_unincorporated_state','$concept_unincorporated_states$')]. These will become [Concept('concept_incorporated_state','$concept_incorporated_states$')] owned by the [concept_organized_territory].\n\n$frontera_settler_lore$"
 je_organize_territory_button:0 "Establish New Territory"
 je_organize_territory_button_desc:0 "Organize some of our [Concept('concept_unincorporated_state','$concept_unincorporated_states$')] into an [concept_organized_territory]."
 je_sunset_route_frontera:0 "The Sunset Route"
 je_sunset_route_frontera_reason:0 "A warm-weather rail connection to California would allow for an unprecedented flow of commerce and people between the East and West. However, this project requires significant coordination. Apart from settling ongoing #italic frog wars#! between property owners, it is also imperative to standardize guages, signals, and scheduling. This may be more difficult if foreign countries control areas of track along the proposed route, but the task is by no means impossible."
 je_sunset_route_frontera_button:0 "Connect the Sunset Route"
 je_sunset_route_frontera_button_desc:0 "Mediate between various stakeholders to create a new rail route to California."
 je_gadsden_purchase_frontera_button:0 "Test the Borders"
 je_gadsden_purchase_frontera_button_desc:0 "Westward rail expansion will be more manageable should we physically control the required land corridor. While politically risky, inciting border disputes with our neighbors may allow for further diplomatic or military options to acquire land for our project."
 je_organized_territory_internal_frontera:0 "Populate the Frontier"
 je_organized_territory_internal_frontera_reason:0 "[ROOT.GetCountry.GetNameNoFlag] is an [concept_organized_territory] belonging to [ROOT.GetCountry.GetTopOverlord.GetNameNoFlag]. This [concept_subject] type allows for increased [concept_migration] and the eventual creation of new [Concept('concept_homeland','$concept_homelands$')] for the [concept_overlord] [concept_country]. Gaining [concept_autonomy] will make [ROOT.GetCountry.GetNameNoFlag] into a [concept_dominion], and will allow changes to its [GetLawGroup('lawgroup_governance_principles').GetName]. \n\n$frontera_settler_lore$"
 frontera_arrival_frontier_guides:0 ""
 je_seminole_wars_removal_frontera:0 ""