 CAL_FLAVOR_TEXT:0 "Alta California declared its allegiance to a newly independent Mexico in 1821. Mexican authorities have attempted to integrate the vast territory, but tensions with colonists and local Californio leaders are reaching their boiling point. Surrounded by ambitious colonial powers, what might the future hold for California?"
 frontera_settler_lore:0 "#lore Settlers, traders, missionaries, and soldiers push outward in search of land and opportunity, often beyond the easy reach of central government. If these distant territories are to integrate, administration must follow expansion. Where settlements grow, new states may one day be admitted to our domain.#!"