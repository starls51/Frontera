 creating_OT_frontera_tt:0 "#indent_newline:2 An #bold Organized Territory#! will be given a [concept_capital_state] following these rules:\n$EFFECT_LIST_BULLET$Is [Concept('concept_unincorporated_state','$concept_unincorporated_state$')]\n$EFFECT_LIST_BULLET$Is #bold not#! [ROOT.GetCountry.GetAdjectiveNoFormatting] [Concept('concept_homeland','$concept_homeland$')]\n$EFFECT_LIST_BULLET$Is #bold adjacent#! to [ROOT.GetCountry.GetAdjectiveNoFormatting] [Concept('concept_homeland', '$concept_homeland$')].\n$EFFECT_LIST_BULLET$Has [GetDecreeType('decree_greener_grass_campaign').GetName], or [concept_state] with highest [Concept('concept_gdp','$concept_gdp_short$')]"
