 je_organized_territories_frontera:0 "Organize Territorial Administration"
 je_organized_territories_frontera_reason:0 "In pursuit of expanding our nation, an #bold Organized Territory#! may be established from some of our holdings. #bold Organized Territories#! will encourage migration, and expand into [Concept('concept_decentralized_nation', '$concept_decentralized_nations$')] on their own.\n\n#lore Across the vast frontiers of the continent, authority wanes. Settlers, traders, missionaries, and soldiers push outward in search of land and opportunity, often beyond the easy reach of central government. If these distant territories are to integrate, administration must follow expansion. Where settlements take root, new states may one day be admitted to our domain.#!"
 je_organize_territory_button_pacific:0 "Organize Western Territories"
 je_organize_territory_button_pacific_desc:0 "This will organize some of our disparate settlements into an organized territory."
