 creating_OT_frontera_tt:0 "#indent_newline:2 An #bold Organized Territory#! will be given a [concept_capital_state] following these rules:\n$EFFECT_LIST_BULLET$Is an [Concept('concept_unincorporated_state','$concept_unincorporated_state$')]\n$EFFECT_LIST_BULLET$Is #bold not#! an [ROOT.GetCountry.GetAdjectiveNoFormatting] [Concept('concept_homeland','$concept_homeland$')]\n$EFFECT_LIST_BULLET$Is #bold adjacent#! to an [ROOT.GetCountry.GetAdjectiveNoFormatting] [Concept('concept_homeland', '$concept_homeland$')].\n$EFFECT_LIST_BULLET$Has [GetDecreeType('decree_greener_grass_campaign').GetName], or [concept_state] with highest [Concept('concept_gdp','$concept_gdp_short$')]"
 creating_OT_frontera_2_tt:0 "#italic Any states following the first two rules and sharing a [concept_strategic_region] with the new [concept_capital_state] will be ceded to the #bold Organized Territory#!#!."
 je_tooltip_no_homelands_frontera:0 "Is #bold not#! an [ROOT.GetCountry.GetAdjectiveNoFormatting] [Concept('concept_homeland', '$concept_homeland$')]."
 je_tooltip_homeland_adjacency_frontera:0 "Is #bold adjacent#! to an [ROOT.GetCountry.GetAdjectiveNoFormatting] [Concept('concept_homeland', '$concept_homeland$')]."
 je_organized_territories_frontera:0 "Establish Organized Territory"
 je_organized_territories_frontera_reason:0 "In pursuit of expanding our nation, an #bold Organized Territory#! may be established from some of our [Concept('concept_unincorporated_state','$concept_unincorporated_states$')]. These will become [Concept('concept_incorporated_state','$concept_incorporated_states$')] owned by the #bold Organized Territory#!. Through [Concept('concept_migration','$concept_migration$')] and [Concept('concept_assimilation','$concept_assimilation$')], any [Concept('concept_incorporated_state','$concept_incorporated_state$')] belonging to an #bold Organized Territory#! can become a [Concept('concept_homeland','$concept_homeland$')] of an [Concept('concept_overlord','$concept_overlord_possessive$')] [Concept('concept_primary_cultures','$concept_primary_culture$')] once that [Concept('concept_cultural_community','$concept_cultural_community$')] comprises at least 60% of an overall [Concept('concept_pop', '$concept_population$')] surpassing 85,000. \n\n#lore Settlers, traders, missionaries, and soldiers push outward in search of land and opportunity, often beyond the easy reach of central government. If these distant territories are to integrate, administration must follow expansion. Where settlements grow, new states may one day be admitted to our domain.#!"
 je_organize_territory_button:0 "Establish Territory"
 je_organize_territory_button_desc:0 "Organize some of our [Concept('concept_unincorporated_state','$concept_unincorporated_states$')] into an #bold Organized Territory#!."
 je_reorganize_territory_button:0 "Reorganize Colony"
 je_reorganize_territory_button_desc:0 "We control a #bold Colonial Administration#! which may be reformed into an #bold Organized Territory#!."
