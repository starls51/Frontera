 je_organized_territories_frontera:0 "Establish Organized Territory"
 je_organized_territories_frontera_reason:0 "In pursuit of expanding our nation, an #bold Organized Territory#! may be established from some of our [Concept('concept_unincorporated_state','$concept_unincorporated_states$')]. These will become [Concept('concept_incorporated_state','$concept_incorporated_states$')] owned by the #bold Organized Territory#!. Through [Concept('concept_migration','$concept_migration$')] and [Concept('concept_assimilation','$concept_assimilation$')], any [Concept('concept_incorporated_state','$concept_incorporated_state$')] belonging to an #bold Organized Territory#! can become a [Concept('concept_homeland','$concept_homeland$')] of an [Concept('concept_overlord','$concept_overlord_possessive$')] [Concept('concept_primary_cultures','$concept_primary_culture$')] once that [Concept('concept_cultural_community','$concept_cultural_community$')] comprises at least 60% of an overall [concept_state] [Concept('concept_pop', '$concept_population$')] above 85,000. \n\n#lore Settlers, traders, missionaries, and soldiers push outward in search of land and opportunity, often beyond the easy reach of central government. If these distant territories are to integrate, administration must follow expansion. Where settlements grow, new states may one day be admitted to our domain.#!"
 je_organize_territory_button:0 "Establish Territory"
 je_organize_territory_button_desc:0 "Organize some of our [Concept('concept_unincorporated_state','$concept_unincorporated_states$')] into an #bold Organized Territory#!."
 da_organize_territory_from_subject:0 "Establish Frontier Government"
 da_organize_territory_from_subject_desc:0 "The [Concept('concept_law', '$concept_laws$')] and [Concept('concept_institution', '$concept_institutions$')] of this [concept_subject] will be changed to become an #bold Organized Territory#!. Settlers will be more likely to [Concept('concept_migration','$concept_migrate$')] here, but the local [Concept('concept_pop', '$Population$')] will become more [Concept('concept_radical','$concept_radicalized$')]."
 da_organize_territory_from_subject_effect:0 "The [concept_subject] will become an #bold Organized Territory#!."
 da_organize_territory_from_subject_action_notification_third_party_name:0 "[INITIATOR_COUNTRY.GetAdjectiveNoFormatting]-[TARGET_COUNTRY.GetAdjectiveNoFormatting] Formed #bold Organized Territory#!"
