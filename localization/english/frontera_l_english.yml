 creating_OT_frontera_tt:0 "#indent_newline:2 An #bold Organized Territory#! will be given a [concept_capital_state] following these rules:\n$EFFECT_LIST_BULLET$Is [Concept('concept_unincorporated_state','$concept_unincorporated_state$')]\n$EFFECT_LIST_BULLET$Is #bold not#! [ROOT.GetCountry.GetAdjectiveNoFormatting] [Concept('concept_homeland','$concept_homeland$')]\n$EFFECT_LIST_BULLET$Is #bold adjacent#! to [ROOT.GetCountry.GetAdjectiveNoFormatting] [Concept('concept_incorporated_state','$concept_incorporated_state$')].\n$EFFECT_LIST_BULLET$Has [GetDecreeType('decree_greener_grass_campaign').GetName], or [concept_state] with highest [Concept('concept_gdp','$concept_gdp_short$')]"
 creating_OT_frontera_2_tt:0 "#italic Any states following the first two rules and sharing a [concept_strategic_region] with the new [concept_capital_state] will be ceded to the #bold Organized Territory#!#!."
 je_tooltip_no_homelands_frontera:0 "Is #bold not#! [ROOT.GetCountry.GetAdjectiveNoFormatting] [Concept('concept_homeland', '$concept_homeland$')]."
 je_tooltip_homeland_required_frontera:0 "Is [ROOT.GetCountry.GetAdjectiveNoFormatting] [Concept('concept_homeland', '$concept_homeland$')]."
 je_tooltip_incorporated_adjacency_frontera:0 "Is #bold adjacent#! to [ROOT.GetCountry.GetAdjectiveNoFormatting] [Concept('concept_incorporated_state','$concept_incorporated_state$')]."
 je_organized_territories_frontera:0 "Establish Organized Territory"
 je_organized_territories_frontera_reason:0 "In pursuit of expanding our nation, an #bold Organized Territory#! may be established from some of our [Concept('concept_unincorporated_state','$concept_unincorporated_states$')]. These will become [Concept('concept_incorporated_state','$concept_incorporated_states$')] owned by the #bold Organized Territory#!.\n\nWhile an #bold Organized Territory#! has [GetLawType('law_homesteading').GetName] enacted, its two [Concept('concept_incorporated_state','$concept_states$')] with the highest [Concept('concept_gdp','$concept_gdp_short$')] will receive a yearly bonus to [Concept('concept_migration','$concept_migration$')]. Any [Concept('concept_incorporated_state','$concept_incorporated_state$')] belonging to an #bold Organized Territory#! can eventually become a [Concept('concept_homeland','$concept_homeland$')] to an [Concept('concept_overlord','$concept_overlord_possessive$')] [Concept('concept_primary_cultures','$concept_primary_culture$')].\n#indent_newline:2 \nA [concept_state] will become a [Concept('concept_homeland','$concept_homeland$')] if:\n$EFFECT_LIST_BULLET$Has a [Concept('concept_cultural_community','$concept_cultural_community$')] of [Concept('concept_overlord','$concept_overlord_possessive$')] [Concept('concept_primary_cultures','$concept_primary_culture$')]\n$EFFECT_LIST_BULLET$60% of the [Concept('concept_pop', '$concept_population$')] has [concept_acceptance] of 65 or more\n$EFFECT_LIST_BULLET$The [concept_state] [Concept('concept_pop', '$concept_population$')] is over 85,000\n\n#lore Settlers, traders, missionaries, and soldiers push outward in search of land and opportunity, often beyond the easy reach of central government. If these distant territories are to integrate, administration must follow expansion. Where settlements grow, new states may one day be admitted to our domain.#!"
 je_organize_territory_button:0 "Establish Territory"
 je_organize_territory_button_desc:0 "Organize some of our [Concept('concept_unincorporated_state','$concept_unincorporated_states$')] into an #bold Organized Territory#!."
 da_organize_territory_from_subject:0 "Establish Frontier Government"
 da_organize_territory_from_subject_desc:0 "The [Concept('concept_law', '$concept_laws$')] and [Concept('concept_institution', '$concept_institutions$')] of this [concept_subject] will be changed to become an #bold Organized Territory#!. Settlers will be more likely to [Concept('concept_migration','$concept_migrate$')] here, but the local [Concept('concept_pop', '$Population$')] will become more [Concept('concept_radical','$concept_radicalized$')]."
 da_organize_territory_from_subject_effect:0 "The [concept_subject] will become an #bold Organized Territory#!."
 da_organize_territory_from_subject_action_notification_third_party_name:0 "[INITIATOR_COUNTRY.GetAdjectiveNoFormatting]-[TARGET_COUNTRY.GetAdjectiveNoFormatting] Formed #bold Organized Territory#!"
 da_organize_territory_from_subject_action_notification_third_party_desc:0 "[INITIATOR_COUNTRY.GetName] has established [TARGET_COUNTRY.GetName] as an #bold Organized Territory#!"
 da_organize_territory_from_subject_action_notification_name:0 "[INITIATOR_COUNTRY.GetName] reorganized us into an #bold Organized Territory#!"
 da_organize_territory_from_subject_action_notification_desc:0 "[INITIATOR_COUNTRY.GetName] has established [TARGET_COUNTRY.GetName] as an #bold Organized Territory#!"
 je_sunset_route_frontera:0 "The Sunset Route"
 je_sunset_route_frontera_reason:0 "A warm-weather rail connection to California would allow for an unprecedented flow of commerce and people between the East and West. However, this project requires significant coordination. Apart from settling ongoing #italic frog wars#! between property owners, it is also imperative to standardize guages, signals, and scheduling. This may be more difficult if foreign countries control areas of track along the proposed route, but the task is by no means impossible."
 je_sunset_route_frontera_button:0 "Connect the Sunset Route"
 je_sunset_route_frontera_button_desc:0 "Mediate between various stakeholders to create a new rail route to California."
 je_gadsden_purchase_frontera_button:0 "Test the Borders"
 je_gadsden_purchase_frontera_button_desc:0 "Westward rail expansion will be more manageable should we physically control the required land corridor. While politically risky, inciting border disputes with our neighbors may allow for further diplomatic or military options to acquire land for our project."
 sunset_route_built_yes_tt:0 "The #bold Sunset Route#! exists"
