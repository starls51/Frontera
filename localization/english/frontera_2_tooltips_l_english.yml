l_english:
 concept_organized_territory:0 "Organized Territory"
 concept_organized_territories:1 "Organized Territories"
 concept_organize_territory:0 "Organize Territory"
 concept_organize_territory_possessive:0 "Organized Territory’s"
 concept_organized_territory_desc:2 "A [concept_subject] [concept_country] that has enacted [GetLawType('law_frontier_territorial_administration').GetName]. Any of its [Concept('concept_incorporated_state','$concept_incorporated_states$')] may eventually become a [Concept('concept_homeland','$concept_homeland$')] for an [Concept('concept_overlord','$concept_overlord_possessive$')] [Concept('concept_primary_cultures','$concept_primary_culture$')]. Each of its [Concept('concept_state','$concept_states$')] must meet certain conditions for the [concept_homeland] to appear.\n\nA new [concept_homeland] will appear in a [concept_state] if:\n$EFFECT_LIST_BULLET$Has a [Concept('concept_cultural_community','$concept_cultural_community$')] of #italic any#! [Concept('concept_overlord','$concept_overlord_possessive$')] [Concept('concept_primary_cultures','$concept_primary_culture$')]\n$EFFECT_LIST_BULLET$#bold 60%#! of the [Concept('concept_pop', '$concept_population$')] has an average [concept_acceptance] of at least #bold 65#!#indent_newline:3 \n#italic Required percent of accepted pops #tooltippable;tooltip:[GetPlayer.GetTooltipTag],frontera_ot_pop_scaling_rule_tt scales down#! as the state population increases#!#!\n$EFFECT_LIST_BULLET$The [Concept('concept_state', '$concept_state_possessive$')] [Concept('concept_pop', '$concept_population$')] is more than #bold 85,000#!\n\n#bold Organized Territories#! gain special advantages from [GetLawType('law_homesteading').GetName]."
 concept_organized_territory_desc_added:0 "[GetInstitutionType('institution_colonial_affairs').GetName]"
 frontera_ot_homeland_gained_homeland:0 "As [SCOPE.sState('ascendent_state').GetName] is a [Concept('concept_homeland','$concept_homeland$')] to its majority [SCOPE.sCountry('overlord_scope').GetAdjectiveNoFormatting] [Concept('concept_primary_cultures','$concept_primary_culture$')]#!, it may now be annexed by [SCOPE.sCountry('overlord_scope').GetName].\n\n#italic The [concept_state] must still go through [Concept('concept_unincorporated_state','$concept_incorporation$')] process to be an [concept_incorporated_state].#!"
 frontera_establish_ot_in_region_tt:0 "An [concept_organized_territory] will be created.\n$EFFECT_LIST_BULLET$The following [Concept('concept_unincorporated_state','$concept_unincorporated_states$')] will be ceded:#indent_newline:2 #indent_newline:2 "
 frontera_stateslist_tt:0 "[THIS.GetState.GetName]"
 frontera_ot_homeland_not_ready_for_statehood_tt:0 "This [concept_state] will not try to join the [concept_overlord] [concept_country] for at least another #bold 3 years#!."
 frontera_ot_pop_scaling_rule_tt:0 "$EFFECT_LIST_BULLET$[concept_state] [Concept('concept_pop', '$concept_population$')] size #bold 85k#!—#bold 200k#!: at least #bold 60%#! must be [Concept('concept_acceptance', '$concept_accepted$')]\n$EFFECT_LIST_BULLET$[concept_state] [Concept('concept_pop', '$concept_population$')] size #bold 200k#!—#bold 500k#!: at least #bold 45%#! must be [Concept('concept_acceptance', '$concept_accepted$')]\n$EFFECT_LIST_BULLET$[concept_state] [Concept('concept_pop', '$concept_population$')] size #bold 500k#!—#bold 1m#!: at least #bold 30%#! must be [Concept('concept_acceptance', '$concept_accepted$')]\n$EFFECT_LIST_BULLET$[concept_state] [Concept('concept_pop', '$concept_population$')] size #bold 1m#! and above: at least #bold 20%#! must be [Concept('concept_acceptance', '$concept_accepted$')]"
 frontera_ot_creation_reset_tt:0 "Cooldown timer for creating a new [concept_organized_territory] will reset\n\n#italic Placing a [GetDecreeType('decree_greener_grass_campaign').GetName] [concept_decree] in an [concept_unincorporated_state] adjacent to an [concept_incorporated_state] can determine which [concept_state] is selected to be the new [Concept('concept_organized_territory','$concept_organize_territory_possessive$')] [Concept('concept_capital_state','$concept_capital_state_short$')], for when this event is next triggered.#!"
 creating_OT_frontera_tt:0 "#indent_newline:2 An [concept_organized_territory] will be given a [concept_capital_state] following these rules:\n$EFFECT_LIST_BULLET$Is [Concept('concept_unincorporated_state','$concept_unincorporated_state$')]\n$EFFECT_LIST_BULLET$Is #bold not#! [ROOT.GetCountry.GetAdjectiveNoFormatting] [Concept('concept_homeland','$concept_homeland$')]\n$EFFECT_LIST_BULLET$Is #bold adjacent#! to [ROOT.GetCountry.GetAdjectiveNoFormatting] [Concept('concept_incorporated_state','$concept_incorporated_state$')].\n$EFFECT_LIST_BULLET$Has [GetDecreeType('decree_greener_grass_campaign').GetName], or [concept_state] with most unclaimed [concept_arable_land]"
 creating_OT_frontera_2_tt:0 "#italic Any states following the first two rules and sharing a [concept_strategic_region] with the new [concept_capital_state] will be ceded to the [concept_organized_territory]#!."
 je_tooltip_no_homelands_frontera:0 "Is #bold not#! [ROOT.GetCountry.GetAdjectiveNoFormatting] [Concept('concept_homeland', '$concept_homeland$')]."
 je_tooltip_homeland_required_frontera:0 "Is [ROOT.GetCountry.GetAdjectiveNoFormatting] [Concept('concept_homeland', '$concept_homeland$')]."
 je_tooltip_incorporated_adjacency_frontera:0 "Is #bold adjacent#! to [ROOT.GetCountry.GetAdjectiveNoFormatting] [Concept('concept_incorporated_state','$concept_incorporated_state$')]."
 sunset_route_built_yes_tt:0 "The #bold Sunset Route#! exists"
 sunset_route_built_no_tt:0 "The #bold Sunset Route#! does not exist"
 colonial_affairs_owner_is_discriminated_country_tt:0 "Any [concept_state] adjacent to [GetPlayer.GetAdjective] [concept_homeland] belongs to a [concept_country] whose [concept_primary_cultures] are all below [Concept('concept_discrimination','@acceptance_status_4! $second_rate_citizen$')] in [GetPlayer.GetName]."
 mesilla_treaty_creation_tt:0 "Add a [concept_treaty] offer to sell any owned land in Arizona or New Mexico to the [SCOPE.sCountry('buyer_scope').GetName] for a weekly sum of #bold £3500#! per [concept_state]"
 treaty_of_limits_province_transfer_tt:0 "[SCOPE.sCountry('buyer_scope').GetName] becomes the partial owner of [GetGeographicRegion('geographic_region_frontera_adams_onis_treatyline').GetName]"