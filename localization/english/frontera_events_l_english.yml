l_english:
 debug_req_pop_ct:0 "STATE has NUMBER of POPS"
 debug_req_primary_perc:0 "STATE has PERCENT PRIMARY CULTURE of OVERLORD"
 frontera_ot_homeland.1:0 "Statehood"
 frontera_ot_homeland.1.t:0 "Home, Sweet Home"
 frontera_ot_homeland.1.d:0 "Settler populations in [SCOPE.sState('ascendent_state').GetName] have grown considerably. Despite any unresolved conflicts with the natives, it appears this place will be a [Concept('concept_homeland','$concept_homeland$')] for many [SCOPE.sCountry('overlord_scope').GetAdjectiveNoFormatting] generations to come."
 frontera_ot_homeland.1.f:0 "\"I was born on the prairies where the wind blew free and there was nothing to break the light of the sun.\" — Geronimo"
 frontera_ot_homeland.1.a:0 "Splendid!"
 frontera_ot_homeland.1.b:0 "My work here is done."
 frontera_ot_homeland_gained_homeland:0 "Has happened:\n#indent_newline:3 [SCOPE.sState('ascendent_state').GetName] became a [Concept('concept_homeland','$concept_homeland$')] to its majority [SCOPE.sCountry('overlord_scope').GetAdjectiveNoFormatting] [Concept('concept_primary_cultures','$concept_primary_culture$')]#!"
 frontera_fort_ross.1:0 "Cutting our Losses"
 frontera_fort_ross.1.t:0 "Cutting our Losses"
 frontera_fort_ross.1.d:0 "Fort Ross was first established to provide food to colonists in Alaska. This fledgling [SCOPE.sCountry('seller_scope').GetAdjectiveNoFlag] outpost has since lost its importance. [SCOPE.sCountry('buyer_scope').GetAdjectiveNoFlag] officials have recently taken notice to our dubious claim to the land. Selling off the structures would provide an opportunity to leave with our honor intact, and ease any tensions in the region."
 frontera_fort_ross.1.f:0 "\n"As you can see, this would be an ideal location to found my #bold New Helvatia#!. Yes, this is fine land... which you would be paid for! Ah #italic Of course#! you will be paid handsomly,\" says Mr. [SCOPE.sCharacter('john_sutter_scope').GetLastName], eager to make the purchase. "In due time. Oh yes, in due time...\""
 frontera_fort_ross.1.a:0 "Never! [SCOPE.sState('california_scope').GetName] is rightfully ours."
 frontera_fort_ross.1.b:0 "This is a good plan."
 frontera_fort_ross.1.c:0 "[SCOPE.sState('california_scope').GetName] has always been [SCOPE.sCountry('seller_scope').GetAdjectiveNoFlag]..."
 frontera_fort_ross.2:0 "Cutting our Losses"
 frontera_fort_ross.2.t:0 "Cutting Our Losses"
 frontera_fort_ross.2.d:0 "[SCOPE.sCountry('seller_scope').GetNameNoFlag], our [concept_subject], intends to surrender their holdings in [SCOPE.sState('california_scope').GetName]."
 frontera_fort_ross.2.f:0 "Local [SCOPE.sCountry('buyer_scope').GetAdjectiveNoFlag] officials would be delighted for us to abandon the settlement. Selling off the structures would provide an opportunity to leave with our honor intact, and ease any tensions in the region."
 frontera_fort_ross.2.a:0 "No, [SCOPE.sState('california_scope').GetName] is a valuable foothold."
 frontera_fort_ross.2.b:0 "Fine, this is of no concern to the mighty [SCOPE.sCountry('overlord_scope').GetNameNoFlag]."
 frontera_fort_ross.3:0 "The Audacity!"
 frontera_fort_ross.3.t:0 "The Audacity!"
 frontera_fort_ross.3.d:0 "[SCOPE.sCountry('seller_scope').GetNameNoFlag] is growing more assertive in [SCOPE.sState('california_scope').GetName]."
 frontera_fort_ross.3.f:0 "Despite the unstable legality of their [concept_claim], groups of [SCOPE.sCountry('seller_scope').GetAdjectiveNoFlag] colonists have stoked the flames of a growing territorial dispute between [SCOPE.sCountry('buyer_scope').GetNameNoFlag] and [SCOPE.sCountry('seller_scope').GetNameNoFlag]."
 frontera_fort_ross.3.a:0 "[SCOPE.sCountry('buyer_scope').GetAdjectiveNoFlag] people must stand together against this threat"
 frontera_fort_ross.4:0 "The [SCOPE.sCharacter('john_sutter_scope').GetLastName] Fort"
 frontera_fort_ross.4.t:0 "The [SCOPE.sCharacter('john_sutter_scope').GetLastName] Fort"
 frontera_fort_ross.4.d:0 "Swiss-American immigrant, pioneer, and polyglot, [SCOPE.sCharacter('john_sutter_scope').GetFullName], has arrived in [SCOPE.sState('california_scope').GetName]."
 frontera_fort_ross.4.f:0 "[SCOPE.sCharacter('john_sutter_scope').GetFullName] has purchased all [SCOPE.sCountry('seller_scope').GetNameNoFlag]-owned assets in [SCOPE.sState('california_scope').GetName] for his grand settlement of #bold New Helvetia#!. With our blessing, the colony may serve as a buffer against unruly natives. [SCOPE.sCharacter('john_sutter_scope').GetLastName] claims that #bold New Helvetia#! will be a beacon of civilization for the frontier. However, there are concerning reports of his violent abuse toward natives under his employ and in the surrounding villages. \n\n #italic "The old world is dying, and the new world struggles to be born: now is the time of monsters.\" — Antonio Gramsci#!"
 frontera_fort_ross.4.a:0 "Return this lunatic to wherever he came from."
 frontera_fort_ross.4.b:0 "He will help us tame the wilderness!"
