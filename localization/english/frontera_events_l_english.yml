 debug_req_pop_ct:0 "STATE has NUMBER of POPS"
 debug_req_primary_perc:0 "STATE has PERCENT PRIMARY CULTURE of OVERLORD"
 frontera_ot_homeland.1:0 "Statehood"
 frontera_ot_homeland.1.t:0 "Home, Sweet Home"
 frontera_ot_homeland.1.d:0 "Settler populations in [SCOPE.sState('ascendent_state').GetName] have grown considerably. Despite any unresolved conflicts with the natives, it appears this place will be a [Concept('concept_homeland','$concept_homeland$')] for many [SCOPE.sCountry('overlord_scope').GetAdjectiveNoFormatting] generations to come."
 frontera_ot_homeland.1.f:0 "\"I was born on the prairies where the wind blew free and there was nothing to break the light of the sun.\" — Geronimo"
 frontera_ot_homeland.1.a:0 "[SCOPE.sState('ascendent_state').GetName] may soon become a state."
 frontera_ot_homeland.1.b:0 "My work here is done."
 frontera_ot_homeland.1.c:0 "[SCOPE.sState('ascendent_state').GetName] will remain a territorial holding, for now."
 frontera_fort_ross.1:0 "Cutting our Losses"
 frontera_fort_ross.1.t:0 "Cutting our Losses"
 frontera_fort_ross.1.d:0 "Fort Ross was first established to provide food to colonists in Alaska. This fledgling [SCOPE.sCountry('seller_scope').GetAdjectiveNoFlag] outpost has since lost its importance. [SCOPE.sCountry('buyer_scope').GetAdjectiveNoFlag] officials have recently taken notice to our dubious claim to the land. Selling off the structures would provide an opportunity to leave with our honor intact, and ease any tensions in the region."
 frontera_fort_ross.1.f:0 "\n"As you can see, this would be an ideal location to found my #bold New Helvetia#!. Yes, this is fine land... which you would be paid for! Ah #italic Of course#! you will be paid handsomely,\" says Mr. [SCOPE.sCharacter('john_sutter_scope').GetLastName], eager to make the purchase. "In due time. Oh yes, in due time...\""
 frontera_fort_ross.1.a:0 "Never! [SCOPE.sState('california_scope').GetName] is rightfully ours."
 frontera_fort_ross.1.b:0 "This is a good plan."
 frontera_fort_ross.1.c:0 "[SCOPE.sState('california_scope').GetName] has always been [SCOPE.sCountry('seller_scope').GetAdjectiveNoFlag]..."
 frontera_fort_ross.2:0 "Cutting our Losses"
 frontera_fort_ross.2.t:0 "Cutting Our Losses"
 frontera_fort_ross.2.d:0 "[SCOPE.sCountry('seller_scope').GetNameNoFlag], our [concept_subject], intends to surrender their holdings in [SCOPE.sState('california_scope').GetName]."
 frontera_fort_ross.2.f:0 "Local [SCOPE.sCountry('buyer_scope').GetAdjectiveNoFlag] officials would be delighted for us to abandon the settlement. Selling off the structures would provide an opportunity to leave with our honor intact, and ease any tensions in the region."
 frontera_fort_ross.2.a:0 "No, [SCOPE.sState('california_scope').GetName] is a valuable foothold."
 frontera_fort_ross.2.b:0 "Fine, this is of no concern to the mighty [SCOPE.sCountry('overlord_scope').GetNameNoFlag]."
 frontera_fort_ross.3:0 "The Audacity!"
 frontera_fort_ross.3.t:0 "The Audacity!"
 frontera_fort_ross.3.d:0 "[SCOPE.sCountry('seller_scope').GetNameNoFlag] is growing more assertive in [SCOPE.sState('california_scope').GetName]."
 frontera_fort_ross.3.f:0 "Despite the unstable legality of their [concept_claim], groups of [SCOPE.sCountry('seller_scope').GetAdjectiveNoFlag] colonists have stoked the flames of a growing territorial dispute between [SCOPE.sCountry('buyer_scope').GetNameNoFlag] and [SCOPE.sCountry('seller_scope').GetNameNoFlag]."
 frontera_fort_ross.3.a:0 "[SCOPE.sCountry('buyer_scope').GetAdjectiveNoFlag] people must stand together against this threat"
 frontera_fort_ross.4:0 "The [SCOPE.sCharacter('john_sutter_scope').GetLastName] Fort"
 frontera_fort_ross.4.t:0 "The [SCOPE.sCharacter('john_sutter_scope').GetLastName] Fort"
 frontera_fort_ross.4.d:0 "Swiss-American immigrant, pioneer, and polyglot, [SCOPE.sCharacter('john_sutter_scope').GetFullName], has arrived in [SCOPE.sState('california_scope').GetName]."
 frontera_fort_ross.4.f:0 "[SCOPE.sCharacter('john_sutter_scope').GetFullName] has purchased all [SCOPE.sCountry('seller_scope').GetNameNoFlag]-owned assets in [SCOPE.sState('california_scope').GetName] for his grand settlement of #bold New Helvetia#!. With our blessing, the colony may serve as a buffer against unruly natives. [SCOPE.sCharacter('john_sutter_scope').GetLastName] claims that #bold New Helvetia#! will be a beacon of civilization for the frontier. However, there are concerning reports of his violent abuse toward natives under his employ and in the surrounding villages. \n\n #italic "The old world is dying, and the new world struggles to be born: now is the time of monsters.\" — Antonio Gramsci#!"
 frontera_fort_ross.4.a:0 "Return this lunatic to wherever he came from."
 frontera_fort_ross.4.b:0 "He will help us tame the wilderness!"
 frontera_sunset_route_event.1:0 "The Sunset Route"
 frontera_sunset_route_event.1.t:0 "The Sunset Route"
 frontera_sunset_route_event.1.d:0 "[SCOPE.sState('california_scope').GetName] has been successfully connected to the Eastern reaches of the continent by rail. Cutting across the Sonoran desert, this warm-weather route can operate non-stop throughout the year."
 frontera_sunset_route_event.2.d:0 "[SCOPE.sCountry('builder_scope').GetNameNoFlag] has spearheaded an effort to connect [SCOPE.sState('california_scope').GetName] to the Eastern reaches of the continent by rail. Cutting across the Sonoran desert, this warm-weather route can operate non-stop throughout the year."
 frontera_sunset_route_event.1.f:0 ""There's the law for you boys, clear as day,\" the Governor declared, his voice was sturdy as the iron giant at his back.  Wind whipped across the desert, and Virgil Earp's hand lingered over his revolver. Perhaps there would have been a shootout, if not for all the innocent townsfolk that had come to watch. Earp's reluctant sigh floated into the sun-baked heat as a hiss of steam. The locomotive rolled on, and the Sunset Route was opened."
 frontera_sunset_route_event.1.a:0 "A Victory for Progress!"
 frontera_sunset_route_event.2.a:0 "Good for them..."
 frontera_sunset_route_event.3:0 "Dispute in the Mesilla Valley"
 frontera_sunset_route_event.3.t:0 "Dispute in the Mesilla Valley"
 frontera_sunset_route_event.3.d:0 "Questions over the ownership of the Mesilla Valley have escalated into a diplomatic dispute between [SCOPE.sCountry('buyer_scope').GetName] and [SCOPE.sCountry('angry_country_scope').GetName]."
 frontera_sunset_route_event.3.f:0 ""The [SCOPE.sCountry('buyer_scope').GetAdjectiveNoFlag] scouts ride across our border as if it were already theirs,\" the [SCOPE.sCountry('angry_country_scope').GetAdjectiveNoFlag] minister fumed. [SCOPE.sCountry('angry_country_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('angry_country_scope').GetRuler.GetFullName] drew on his cigar in a brooding tranquility, the faint glow briefly outlined his weathered features before fading into the dark.\n\n"If I refuse to sell, they will simply take it—and claim destiny.\"\n\n"And if you agree?\"\n\n"We are paid... for what we are forced to lose.\""
 frontera_sunset_route_event.3.a:0 "Send more armed expeditions"
 frontera_sunset_route_event.3.b:0 "Attempt a more peaceful approach"
 frontera_sunset_route_event.4:0 "Intrusions in the Mesilla Valley"
 frontera_sunset_route_event.4.t:0 "Intrusions in the Mesilla Valley"
 frontera_sunset_route_event.4.d:0 "Foreign military expeditions have repeatedly trespassed beyond the border established near the Mesilla Valley."
 frontera_sunset_route_event.4.f:0 ""The [SCOPE.sCountry('buyer_scope').GetAdjectiveNoFlag] scouts ride across our border as if it were already theirs,\" the [SCOPE.sCountry('angry_country_scope').GetAdjectiveNoFlag] minister fumed. [SCOPE.sCountry('angry_country_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('angry_country_scope').GetRuler.GetFullName] drew on his cigar in a brooding tranquility, the faint glow briefly outlined his weathered features before fading into the dark.\n\n"If I refuse to sell, they will simply take it—and claim destiny.\"\n\n"And if you agree?\"\n\n"We are paid... for what we are forced to lose.\""
 frontera_sunset_route_event.4.a:0 "Offer to sell the land"
 frontera_sunset_route_event.4.b:0 "They would be fools to invade"
 frontera_sunset_route_event.5:0 "Surveyors in the Desert"
 frontera_sunset_route_event.5.t:0 "Surveyors in the Desert"
 frontera_sunset_route_event.5.d:0 "[SCOPE.sCountry('buyer_scope').GetAdjectiveNoFlag] agents have included some of our diplomats in a field mission. It appears they are hoping to establish international railway networks between our countries."
 frontera_sunset_route_event.5.f:0 "Whether we agree with the plan or not, these surveys are an excellent opportunity to plan infrastructure improvements and to exchange knowledge of more advanced methods of transportation."
 frontera_sunset_route_event.5.a:0 "A neighborly gesture indeed"
 frontera_treaty_of_limits.1:0 "Old Words, New Treaty: [SCOPE.sCountry('seller_scope').GetCapital.GetCityHubName]"
 frontera_treaty_of_limits.1.t:0 "Old Words, New Treaty: [SCOPE.sCountry('seller_scope').GetCapital.GetCityHubName]"
 frontera_treaty_of_limits.1.d:0 "Claiming to be the legal inheritors of the defunct #bold Adams—Onís Treaty#!, [SCOPE.sCountry('buyer_scope').GetAdjectiveNoFormatting] officials have been pressuring [SCOPE.sCountry('seller_scope').GetCapital.GetCityHubName] to recognize and enforce the treaty's old demarcation lines."
 frontera_treaty_of_limits.1.f:0 "The #italic Treaty of Limits#! was signed between the United States and Mexico in 1821. It renewed articles of the #italic Adams—Onís Treaty#!, as was formerly signed by Spain two years before. Apart from transferring control of Florida to the United States, the #italic Adams—Onís Treaty#! also affirmed a legal border with Spain in the West."
 frontera_treaty_of_limits.1.a:0 "Ratify the treaty."
 frontera_treaty_of_limits.1.b:0 "What a preposterous idea..."
 frontera_treaty_of_limits.2:0 "Old Words, No Treaty: [SCOPE.sCountry('seller_scope').GetCapital.GetCityHubName] Mission"
 frontera_treaty_of_limits.2.t:0 "Old Words, No Treaty: [SCOPE.sCountry('seller_scope').GetCapital.GetCityHubName] Mission"
 frontera_treaty_of_limits.2.d:0 "The [SCOPE.sCountry('buyer_scope').GetAdjectiveNoFormatting] officials have returned from the diplomatic mission in [SCOPE.sCountry('seller_scope').GetCapital.GetCityHubName]. Unfortunately, their [SCOPE.sCountry('seller_scope').GetAdjectiveNoFormatting] counterparts balked at the \" preposterous\" idea of resurrecting the #italic Treaty of Limits#!."
 frontera_treaty_of_limits.2.f:0 "They sat in a cushioned booth by the tall window. It was one of the best places to impress a distinguished guest, in one of the finest restaurants in [SCOPE.sCountry('seller_scope').GetCapital.GetCityHubName] no less. The [SCOPE.sCountry('seller_scope').GetAdjectiveNoFormatting] socialites erupted with laughter, “Of courrrse! We will also, on #italic their#! behalf, plant a great big [SCOPE.sCountry('buyer_scope').GetAdjectiveNoFormatting] flag on the moon!” They were unaware of the [SCOPE.sCountry('buyer_scope').GetAdjectiveNoFormatting] diplomats, quietly dining only a few tables away."
 frontera_treaty_of_limits.2.a:0 "Issue a formal denunciation."
 frontera_treaty_of_limits.2.b:0 "Abandon the idea."
 frontera_treaty_of_limits.3.d:0 "The [SCOPE.sCountry('buyer_scope').GetAdjectiveNoFormatting] officials have returned from the diplomatic mission in [SCOPE.sCountry('seller_scope').GetCapital.GetCityHubName], elated by pleasant dealings with their [SCOPE.sCountry('seller_scope').GetAdjectiveNoFormatting] counterparts. The negotiations are proceeding in favor of [SCOPE.sCountry('buyer_scope').GetNameNoFormatting]."
 frontera_treaty_of_limits.3.b:0 "It is a sign of weakness."