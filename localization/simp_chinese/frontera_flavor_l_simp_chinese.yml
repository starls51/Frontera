l_simp_chinese:
 CAL_FLAVOR_TEXT: "1821年，上加利福尼亚宣布效忠于刚刚独立的墨西哥。墨西哥当局曾试图将这片广袤的领土纳入版图，但与殖民者及当地加利福尼亚领袖之间的紧张关系已达到沸点。在野心勃勃的殖民列强包围下，加利福尼亚的未来将何去何从？" #deepl:578679357
 frontera_settler_lore: "#lore  定居者、商人、传教士和士兵不断向外拓展，寻求土地与机遇，这些地区往往超出了中央政府轻易管辖的范围。若要使这些偏远地区融入整体，行政管理必须跟上扩张的步伐。随着定居点的扩展，这些新州终有一天可能会被纳入我们的版图。#!" #deepl:5769617
