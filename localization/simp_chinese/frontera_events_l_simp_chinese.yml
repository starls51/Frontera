 frontera_sunset_route_event.4.d: "外国军事远征队屡次越过梅西利亚谷地附近划定的边界。" #deepl:2990890124
 frontera_sunset_route_event.4.f: ""那些[SCOPE.sCountry('buyer_scope').GetAdjectiveNoFlag]的探子骑马越过我们的边界，仿佛这土地早已属于他们，"[SCOPE.sCountry('angry_country_scope').GetAdjectiveNoFlag]部长愤愤不平地说道。[SCOPE.sCountry('angry_country_scope').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('angry_country_scope').GetRuler.GetFullName]沉静地叼着雪茄，微弱的烟光在昏暗中短暂勾勒出他饱经风霜的面容，随即又隐入黑暗。\n\n"若我拒绝出售，他们便会强取豪夺——并宣称这是天命所归。"\n\n"而若你同意呢？"\n\n"我们被迫失去的...终将获得补偿。"" #deepl:87387247
 frontera_sunset_route_event.4.a: "出售土地的要约" #deepl:3847002548
 frontera_sunset_route_event.4.b: "他们若入侵便是愚人" #deepl:346374326
 frontera_sunset_route_event.5: "沙漠中的测量员" #deepl:1781160719
 frontera_sunset_route_event.5.t: "沙漠中的测量员" #deepl:1781160719
 frontera_sunset_route_event.5.d: "[SCOPE.sCountry('buyer_scope').GetAdjectiveNoFlag] 情报人员已将我方部分外交官纳入实地考察任务。他们似乎正试图在我们两国之间建立国际铁路网络。" #deepl:368096293
 frontera_sunset_route_event.5.f: "无论我们是否认同该计划，这些调查都是规划基础设施改善和交流更先进交通方法知识的绝佳机会。" #deepl:652771437
 frontera_sunset_route_event.5.a: "确实是邻里间的善意举动" #deepl:1043888935
 