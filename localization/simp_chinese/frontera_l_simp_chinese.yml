 je_organized_territories_frontera_reason: "为拓展国家版图，可从部分[Concept('concept_unincorporated_state','$concept_unincorporated_states$')]中建立#bold 组织领地#!。这些领地将归属[Concept('concept_incorporated_state','$concept_incorporated_states$')]，由#bold 组织领地#!所有。\n\n当#bold 组织领地#!实施[GetLawType('law_homesteading').GetName]政策时，其[Concept('concept_gdp','$concept_gdp_short$')]最高的两名[Concept('concept_incorporated_state','$concept_states$')]将获得年度奖金[Concept('concept_migration','$concept_migration$')]。任何隶属于#bold 组织领地#!的[Concept('concept_incorporated_state','$concept_incorporated_state$')]最终可晋升为[Concept('concept_homeland','$concept_homeland$')]，隶属于[Concept('concept_overlord','$concept_overlord_possessive$')][Concept('concept_primary_cultures','$concept_primary_culture$')]。\n #indent_newline:2 \n 当满足以下条件时，[concept_state]将升级为[Concept('concept_homeland','$concept_homeland$')]： \n $EFFECT_LIST_BULLET$ 该的[Concept('concept_cultural_community','$concept_cultural_community$')]值达到： [Concept('concept_overlord','$concept_overlord_possessive$')] [Concept('concept_primary_cultures','$concept_primary_culture$')] \n $EFFECT_LIST_BULLET$ 且60%的[Concept('concept_pop', '$concept_population$')]拥有[concept_acceptance]值≥65 \n $EFFECT_LIST_BULLET$ 同时[concept_state]值 [Concept('concept_pop', '$concept_population$')]超过85,000 \n \n #lore  拓荒者、商人、传教士和士兵不断向外拓展疆域，寻求土地与机遇，其足迹常超出中央政府有效管辖范围。若要使这些边远地区融入体系，行政管理必须紧随扩张步伐。在定居点蓬勃发展的区域，新州份终将被纳入我们的版图。 #!" #deepl:544344828
