 je_sunset_route_frontera_reason: "一条通往加州的暖季铁路连接线，将使东西部之间实现前所未有的商业与人员流动。然而该项目需要高度协调。除了解决土地所有者之间持续的蟾蜍战争（详见：#italic ）外，轨道标准、信号系统和运行时刻表的统一也至关重要。若拟建路线沿途存在外国控制的轨道区域，协调难度可能更大，但这项任务绝非不可能完成。" #deepl:1621464726
