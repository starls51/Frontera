 concept_organized_territory_desc: "一个已实现[GetLawType('law_frontier_territorial_administration').GetName]的[concept_subject]（[concept_country]）。其任意一个[Concept('concept_incorporated_state','$concept_incorporated_states$')]最终都可能成为某个[Concept('concept_overlord','$concept_overlord_possessive$')]（[Concept('concept_primary_cultures','$concept_primary_culture$')]）的[Concept('concept_homeland','$concept_homeland$')]。其每个[Concept('concept_state','$concept_states$')]都必须满足特定条件，[concept_homeland]才能出现。\n \n 当满足以下条件时，[concept_state] 中将出现新的 [concept_homeland]：\n $EFFECT_LIST_BULLET$ 其 [Concept('concept_pop', '$concept_population$')] 规模超过 #bold  85,000 #! \n $EFFECT_LIST_BULLET$ 其 [Concept('concept_cultural_community','$concept_cultural_community$')] 为 [Concept('concept_overlord','$concept_overlord_possessive$')] [Concept('concept_primary_cultures','$concept_primary_culture$')] \n $EFFECT_LIST_BULLET$ 且 #bold  60% #! 的 [Concept('concept_pop', '$concept_pops$')] 属于 [Concept('concept_discrimination','@acceptance_status_5! $full_acceptance$')] 或 [Concept('concept_discrimination','@acceptance_status_4! $second_rate_citizen$')] #indent_newline:3 \n #italic  该要求 #tooltippable;tooltip: [GetPlayer.GetTooltipTag],frontera_ot_pop_scaling_rule_tt 会随着州人口的增加而降低 #! #! #! \n \n #bold  建制辖区 #! 可享受 [GetLawType('law_homesteading').GetName] 的福利，并可在 [GetInstitutionType('institution_colonial_affairs').GetName] [concept_institution] 内直接 [Concept('concept_overlord','$concept_overlord$')] 筹集 [Concept('concept_investment_level', '$concept_investment_levels$')]。" #deepl:3004377925
 concept_organized_territory_desc_added: "[GetInstitutionType('institution_colonial_affairs').GetName]" #deepl:743845877
 frontera_ot_homeland_gained_homeland: "由于 [SCOPE.sState('ascendent_state').GetName] 是其控股公司 [SCOPE.sCountry('overlord_scope').GetAdjectiveNoFormatting] [Concept('concept_primary_cultures','$concept_primary_culture$')] #! 的 [Concept('concept_homeland','$concept_homeland$')]，因此现在可被 [SCOPE.sCountry('overlord_scope').GetName] 合并。\n \n #italic  该 [concept_state] 仍需通过 [Concept('concept_unincorporated_state','$concept_incorporation$')] 流程才能成为 [concept_incorporated_state]。#!" #deepl:3409905544
 frontera_establish_ot_in_region_tt: "将创建一个[concept_organized_territory]。\n $EFFECT_LIST_BULLET$ 将让出以下[Concept('concept_unincorporated_state','$concept_unincorporated_states$')]：#indent_newline:2 #indent_newline:2 " #deepl:4160631454
