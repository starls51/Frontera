 frontera_ot_pop_scaling_rule_tt: "$EFFECT_LIST_BULLET$ [concept_state] [Concept('concept_pop', '$concept_population$')] 大小 #bold  85k #!—#bold  200k #!：至少 #bold  60% #! 必须为 [Concept('concept_acceptance', '$concept_accepted$')] \n $EFFECT_LIST_BULLET$ [concept_state] [Concept('concept_pop', '$concept_population$')] 大小 #bold  200k #!—#bold  500k #!：至少 #bold  45% #! 必须为 [Concept('concept_acceptance', '$concept_accepted$')] \n $EFFECT_LIST_BULLET$ [concept_state] [Concept('concept_pop', '$concept_population$')] 大小 #bold  500k #!—#bold  1m #!：至少 #bold  30% #! 必须为 [Concept('concept_acceptance', '$concept_accepted$')] \n $EFFECT_LIST_BULLET$ [concept_state] [Concept('concept_pop', '$concept_population$')] 大小 #bold  1m #! 及以上：至少 #bold  20% #! 必须为 [Concept('concept_acceptance', '$concept_accepted$')]" #deepl:2529047697
 frontera_ot_creation_reset_tt: "创建新[concept_organized_territory]的冷却计时器将重置 \n \n #italic  将[GetDecreeType('decree_greener_grass_campaign').GetName] [concept_decree]放置在与[concept_incorporated_state]相邻的[concept_unincorporated_state]中，可以决定下次触发此事件时，将选择哪个[concept_state]作为新的[Concept('concept_organized_territory','$concept_organize_territory_possessive$')] [Concept('concept_capital_state','$concept_capital_state_short$')]。 #!" #deepl:668338308
