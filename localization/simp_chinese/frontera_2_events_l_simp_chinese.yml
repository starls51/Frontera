 frontera_acw_events.3.t: "《[SCOPE.sCharacter('wilmot_proviso_ig_leader').GetLastName]》条款" #deepl:1352998344
 frontera_acw_events.3.d: "“自由与平等党”（[SCOPE.gsInterestGroup('wilmot_proviso_ig').GetName]）领袖罗伯特·斯塔尔（[SCOPE.sCharacter('wilmot_proviso_ig_leader').GetFullName]）提议在所有新领地彻底废除奴隶制。一些反对者主张采取温和措施，但另一些人则要求在所有新领地将奴隶制合法化。" #deepl:3885920250
 frontera_acw_events.3.f: "“这个令人无法容忍的制度绝不能再扩大其影响！一个自由的国家若要繁荣昌盛，就必须拥有自由的土地！”" #deepl:3646320274
 frontera_acw_events.3.a: "驳回该附加条款，此事仍属各州自行决定的事项。" #deepl:3123663819
 frontera_acw_events.3.b: "接受这一附加条件，并在各领地废除奴隶制。" #deepl:2346190169
 frontera_acw_events.3.c: "否决该附加条款，并在各领地扩大奴隶制。" #deepl:2300651371
