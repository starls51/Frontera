l_japanese:
 CAL_FLAVOR_TEXT: "1821年、アルタ・カリフォルニアは独立を果たしたばかりのメキシコへの忠誠を宣言した。メキシコ当局はこの広大な領土の統合を図ってきたが、入植者や地元のカリフォルニオの指導者たちとの緊張は限界に達しつつある。野心的な列強に囲まれたカリフォルニアの未来は、果たしてどうなるのだろうか。" #deepl:578679357
 frontera_settler_lore: "#lore  入植者、商人、宣教師、そして兵士たちは、土地と機会を求めて外へと進出し、その多くは中央政府の直接的な支配が及ばない地域へと足を延ばす。こうした遠隔地を統合するためには、領土の拡大に合わせ、行政体制も整備されなければならない。入植地が発展すれば、いつの日か新たな州が我が領土に加わるかもしれない。#!" #deepl:5769617
