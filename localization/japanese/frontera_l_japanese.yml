 je_organized_territories_frontera_reason: "国家拡大を追求するにあたり、#bold  組織領土 #! は、一部の [Concept('concept_unincorporated_state','$concept_unincorporated_states$')] から設立される可能性があります。これらは [Concept('concept_incorporated_state','$concept_incorporated_states$')] となり、#bold  組織領土 #! が所有します。\n \n #bold  組織領土 #! が [GetLawType('law_homesteading').GetName] を制定している間、[Concept('concept_gdp','$concept_gdp_short$')] において最も高い  を有する 2 つの [Concept('concept_incorporated_state','$concept_states$')] は、[Concept('concept_migration','$concept_migration$')] への年間ボーナスを受け取ります。#bold  組織領土 #! に属する [Concept('concept_incorporated_state','$concept_incorporated_state$')] は、最終的に [Concept('concept_overlord','$concept_overlord_possessive$')] [Concept('concept_primary_cultures','$concept_primary_culture$')] の [Concept('concept_homeland','$concept_homeland$')] になる可能性があります。\n #indent_newline:2 \n [concept_state] は以下の条件を満たす場合、[Concept('concept_homeland','$concept_homeland$')] となる： \n $EFFECT_LIST_BULLET$ [Concept('concept_cultural_community','$concept_cultural_community$')] が [Concept('concept_overlord','$concept_overlord_possessive$')] であること [Concept('concept_primary_cultures','$concept_primary_culture$')] \n $EFFECT_LIST_BULLET$ [Concept('concept_pop', '$concept_population$')] の 60% が [concept_acceptance] で 65 以上であること \n $EFFECT_LIST_BULLET$ [concept_state] が [Concept('concept_pop', '$concept_population$')] で 85,000 を超えること \n \n #lore  開拓者、商人、宣教師、兵士たちは土地と機会を求めて外へ外へと進出し、しばしば中央政府の手の届きにくい地域にまで到達する。これらの遠隔地を統合するためには、拡大に続いて行政が行き届かねばならない。入植地が成長する場所では、いずれ新たな州が我々の領域に加わるかもしれない。 #!" #deepl:544344828
