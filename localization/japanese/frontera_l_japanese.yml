 je_sunset_route_frontera_reason: "温暖な気候のカリフォルニア州への鉄道接続は、東西間の商業と人の流れを前例のない規模で可能にするだろう。しかしこのプロジェクトには大規模な調整が必要だ。土地所有者間の継続的な線路敷設権争い（フロッグ・ウォーズ）の解決（#italic  #!）に加え、軌間・信号・運行スケジュールの標準化も不可欠である。提案ルート沿いの線路区域を外国が管理している場合、この作業はより困難になる可能性があるが、決して不可能ではない。" #deepl:1621464726
