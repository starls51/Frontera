 je_sunset_route_frontera_button_desc: "様々な利害関係者の間を取り持ち、カリフォルニア州への新たな鉄道路線を創設する。" #deepl:952386937
 je_gadsden_purchase_frontera_button: "境界線を試す" #deepl:2467056109
 je_gadsden_purchase_frontera_button_desc: "西進する鉄道拡張は、必要な土地回廊を物理的に掌握すればより管理しやすくなる。政治的にはリスクを伴うが、近隣諸国との国境紛争を煽ることで、プロジェクトのための土地取得に向けたさらなる外交的・軍事的選択肢が開ける可能性がある。" #deepl:1391362877
