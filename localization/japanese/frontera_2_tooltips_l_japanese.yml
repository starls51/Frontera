 concept_organized_territory_desc: "[GetLawType('law_frontier_territorial_administration').GetName] を実装した [concept_subject] [concept_country]。その [Concept('concept_incorporated_state','$concept_incorporated_states$')] のいずれかが、最終的に [Concept('concept_overlord','$concept_overlord_possessive$')] [Concept('concept_primary_cultures','$concept_primary_culture$')] の [Concept('concept_homeland','$concept_homeland$')] となる可能性があります。[concept_homeland] が表示されるためには、その [Concept('concept_state','$concept_states$')] の各々が特定の条件を満たす必要があります。\n \n 以下の条件を満たす場合、[concept_state]に新しい[concept_homeland]が表示されます：\n $EFFECT_LIST_BULLET$ [Concept('concept_pop', '$concept_population$')]のサイズが#bold  85,000 #! \n $EFFECT_LIST_BULLET$ [Concept('concept_cultural_community','$concept_cultural_community$')]が[Concept('concept_overlord','$concept_overlord_possessive$')] [Concept('concept_primary_cultures','$concept_primary_culture$')] \n $EFFECT_LIST_BULLET$ 少なくとも#bold  60% #! [Concept('concept_pop', '$concept_pops$')]の[Concept('concept_discrimination','@acceptance_status_5! $full_acceptance$')]または[Concept('concept_discrimination','@acceptance_status_4! $second_rate_citizen$')] #indent_newline:3 \n #italic  この要件 #tooltippable;tooltip: [GetPlayer.GetTooltipTag],frontera_ot_pop_scaling_rule_tt は、州の人口が増加するにつれて#! 緩和されます #! #! \n \n #bold  組織化された地域 #! は[GetLawType('law_homesteading').GetName]の恩恵を受け、[GetInstitutionType('institution_colonial_affairs').GetName] [concept_institution] における[Concept('concept_investment_level', '$concept_investment_levels$')]の直接的な[Concept('concept_overlord','$concept_overlord$')]増強が行われます。" #deepl:3004377925
 concept_organized_territory_desc_added: "[GetInstitutionType('institution_colonial_affairs').GetName]" #deepl:743845877
 frontera_ot_homeland_gained_homeland: "[SCOPE.sState('ascendent_state').GetName]は、その過半数を占める[SCOPE.sCountry('overlord_scope').GetAdjectiveNoFormatting]、[Concept('concept_primary_cultures','$concept_primary_culture$')]、#!に対して[Concept('concept_homeland','$concept_homeland$')]であるため、現在、[SCOPE.sCountry('overlord_scope').GetName]によって併合される可能性があります。\n \n #italic  [concept_state]は、[concept_incorporated_state]となるために、依然として[Concept('concept_unincorporated_state','$concept_incorporation$')]のプロセスを経る必要があります。#!" #deepl:3409905544
 frontera_establish_ot_in_region_tt: "[concept_organized_territory] が作成されます。 \n $EFFECT_LIST_BULLET$ 以下の [Concept('concept_unincorporated_state','$concept_unincorporated_states$')] が譲渡されます：#indent_newline:2 #indent_newline:2 " #deepl:4160631454
 frontera_stateslist_tt: "[THIS.GetState.GetName]" #deepl:318863887
 frontera_ot_homeland_not_ready_for_statehood_tt: "この[concept_state]は、少なくとも今後#bold  3年間は、[concept_overlord] [concept_country] への参加を試みません#!。" #deepl:3349629079
 frontera_ot_pop_scaling_rule_tt: "$EFFECT_LIST_BULLET$ [concept_state] [Concept('concept_pop', '$concept_population$')] サイズ #bold  85k #!—#bold  200k #!: 少なくとも #bold  60% #! は [Concept('concept_acceptance', '$concept_accepted$')] \n $EFFECT_LIST_BULLET$ [concept_state] [Concept('concept_pop', '$concept_population$')] サイズ #bold  200k #!—#bold  500k #!: 少なくとも #bold  45% #! は [Concept('concept_acceptance', '$concept_accepted$')] \n $EFFECT_LIST_BULLET$ [concept_state] [Concept('concept_pop', '$concept_population$')] サイズ #bold  500k #!—#bold  1m #!: 少なくとも #bold  30% #! は [Concept('concept_acceptance', '$concept_accepted$')] \n $EFFECT_LIST_BULLET$ [concept_state] [Concept('concept_pop', '$concept_population$')] サイズ #bold  1m #! 以上: 少なくとも #bold  20% #! は [Concept('concept_acceptance', '$concept_accepted$')]" #deepl:2529047697
 frontera_ot_creation_reset_tt: "新しい[concept_organized_territory]を作成するためのクールダウンタイマーはリセットされます \n \n #italic  [concept_incorporated_state]に隣接する[concept_unincorporated_state]に[GetDecreeType('decree_greener_grass_campaign').GetName] [concept_decree]を配置することで、このイベントが次にトリガーされた際に、どの[concept_state]が新しい[Concept('concept_organized_territory','$concept_organize_territory_possessive$')] [Concept('concept_capital_state','$concept_capital_state_short$')]として選択されるかを決定できます。 #!" #deepl:668338308
 creating_OT_frontera_tt: "#indent_newline:2 [concept_organized_territory] には、以下の規則に従って [concept_capital_state] が付与されます： \n $EFFECT_LIST_BULLET$ [Concept('concept_unincorporated_state','$concept_unincorporated_state$')] \n $EFFECT_LIST_BULLET$ #bold  #! [ROOT.GetCountry.GetAdjectiveNoFormatting] [Concept('concept_homeland','$concept_homeland$')] \n $EFFECT_LIST_BULLET$ #bold  #! [ROOT.GetCountry.GetAdjectiveNoFormatting] [Concept('concept_incorporated_state','$concept_incorporated_state$')] に隣接していますか。 \n $EFFECT_LIST_BULLET$ [GetDecreeType('decree_greener_grass_campaign').GetName] または [concept_state] を持ち、未割り当ての [concept_arable_land] が最も多いですか。" #deepl:1587096270
 creating_OT_frontera_2_tt: "#italic  最初の2つのルールに従い、かつ新しい「[concept_capital_state]」と「[concept_strategic_region]」を共有する州はすべて、「[concept_organized_territory]」#!に割譲される。" #deepl:2838758393
