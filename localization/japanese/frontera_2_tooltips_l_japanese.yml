 colonial_affairs_owner_is_discriminated_country_tt: "[GetPlayer.GetAdjective] [concept_homeland] に隣接するすべての [concept_state] は、[concept_country] に属しており、その [concept_primary_cultures] はすべて、[GetPlayer.GetName] 内の [Concept('concept_discrimination','@acceptance_status_4! $second_rate_citizen$')] の下にあります。" #deepl:3595122018
 mesilla_treaty_creation_tt: "[concept_treaty]のオファーを追加し、アリゾナ州またはニューメキシコ州に所有する土地を、[SCOPE.sCountry('buyer_scope').GetName]に週額#bold £3500で売却しましょう。#!（[concept_state]）" #deepl:2192895926
