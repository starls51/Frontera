 ideology_frontera_mexican_centralist_desc: "中央集権主義者は、通常は地域の自治を犠牲にして、強固で統一的な国家政府を望んでいる。彼らは植民地時代の集中化された構造を模倣することで、混沌とした初期共和国の秩序を強制しようとしている。" #deepl:2906061988
