l_japanese:
 frontera_ot.1: "未開の地" #deepl:770041530
 frontera_ot.1.t: "未開の地" #deepl:770041530
 frontera_ot.1.d: "[SCOPE.sCountry('overlord_scope').GetNameNoFlag] [SCOPE.sCountry('ot_scope').GetNameNoFlag]を独立した運営組織の下で維持することには、ほとんど関心がありません。" #deepl:791967195
 frontera_ot.1.f: "この地域は、組織化されていない、自治権を持たない[SCOPE.sCountry('overlord_scope').GetAdjectiveNoFlag]の領土となる。しかし、将来的に新たな領土として編入される可能性もある。" #deepl:2413213071
 frontera_ot.1.a: "知事は別の仕事を見つけることになるかもしれない……" #deepl:671175547
 frontera_ot.2: "西部へ、ワゴンで！" #deepl:3523476864
 frontera_ot.2.t: "西部へ、ワゴンで！" #deepl:3523476864
 frontera_ot.2.d: "[SCOPE.sCountry('overlord_scope').GetAdjectiveNoFlag] 入植者たちが[SCOPE.sState('ot_state_scope').GetName]へ移住している" #deepl:2987101877
 frontera_ot.2.f: "フロンティアへの移住者たちは、それぞれの歴史と信念を独自に融合させていくことになるでしょう。新たな土地への旅は、彼ら自身を試すだけでなく、彼らがどのような人間になるかを形作っていくことになるでしょう。 \n \n #bold  これらの新しい入植者たちは…… #!" #deepl:4166109341
 frontera_ot.2.a: "[SCOPE.sPop('pop_a_scope').GetCulture.GetName] [SCOPE.sPop('pop_a_scope').GetPopType.GetNameNoIcon]。彼はよく、[SCOPE.sPoliticalMovement('movement_a_scope').GetNameNoIcon]について話しているのを耳にします。" #deepl:43556161
 frontera_ot.2.b: "[SCOPE.sPop('pop_b_scope').GetCulture.GetName] [SCOPE.sPop('pop_b_scope').GetPopType.GetNameNoIcon]、[SCOPE.sPoliticalMovement('movement_b_scope').GetNameNoIcon]をめぐる内部対立。" #deepl:1096300513
 frontera_ot.2.c: "[SCOPE.sPop('pop_c_scope').GetCulture.GetName] [SCOPE.sPop('pop_c_scope').GetPopType.GetNameNoIcon]、[SCOPE.sPoliticalMovement('movement_c_scope').GetNameNoIcon]について静かな確信を抱いて。" #deepl:456112610
 frontera_ot.3: "領土条例" #deepl:2442298291
 frontera_ot.3.t: "「[SCOPE.sState('newly_formed_colonial_nation_anchor_state').GetNameNoFormatting]条例」" #deepl:64569039
 frontera_ot.3.d: "熟考を重ねた結果、新しい[concept_organized_territory]の概要がほぼ固まりつつあります。あとは細部の調整を残すのみです。" #deepl:3662192004
 frontera_ot.3.f: "[SCOPE.sState('newly_formed_colonial_nation_anchor_state').GetName]の[Concept('concept_unincorporated_state','$concept_unincorporated_state$')]は、[Concept('concept_capital_state','$concept_capital_state_short$')]として適格であると認定されました。境界が確定次第、当該地域を管理する地方自治体が任命される可能性があります。 \n \n #bold  この地域はどこに設置されるのでしょうか？ #!" #deepl:3332362391
 frontera_ot.3.a: "[SCOPE.sState('newly_formed_colonial_nation_anchor_state').GetName] 周辺の領域を設定します。" #deepl:1584845668
 frontera_ot.3.b: "[SCOPE.sStrategicRegion('region_scope').GetName] エリアにテリトリーを確立する。" #deepl:236851503
 frontera_ot.3.c: "よく考えてみると、これは後回しにできる。" #deepl:3045238605
 frontera_acw_events.3.t: "「[SCOPE.sCharacter('wilmot_proviso_ig_leader').GetLastName]」の特例" #deepl:1352998344
 frontera_acw_events.3.d: "「[SCOPE.gsInterestGroup('wilmot_proviso_ig').GetName]」のリーダーである[SCOPE.sCharacter('wilmot_proviso_ig_leader').GetFullName]は、すべての新領土において奴隷制を全面的に禁止することを提案した。反対派の中には、単に節度ある対応を求める者もいれば、すべての新領土での奴隷制の合法化を要求する者もいる。" #deepl:3885920250
 frontera_acw_events.3.f: "「この耐え難い制度がこれ以上勢力を広げることは許されない！自由な国家が繁栄するためには、自由な土地が必要なのだ！」" #deepl:3646320274
 frontera_acw_events.3.a: "この付帯条項を否決すれば、これは依然として各州ごとの問題となる。" #deepl:3123663819
 frontera_acw_events.3.b: "その条件を受け入れ、領土における奴隷制を廃止せよ。" #deepl:2346190169
 frontera_acw_events.3.c: "その付帯条項を否決し、領土における奴隷制を拡大する。" #deepl:2300651371
 frontera_ot.4: "国境紛争" #deepl:988586463
 frontera_ot.4.t: "国境紛争" #deepl:988586463
 frontera_ot.4.d: "[SCOPE.sCountry('ot_1_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('ot_1_scope').GetRuler.GetLastName] は、[SCOPE.sCountry('ot_2_scope').GetNameNoFormatting]との境界が不明確であるとの懸念を政府に伝えた。[SCOPE.sCountry('ot_2_scope').GetRuler.GetPrimaryRoleTitle]（[SCOPE.sCountry('ot_2_scope').GetRuler.GetLastName]）の代表を名乗る徴税人が、[SCOPE.sState('ot_1_state_scope').GetName]の集落から徴収を試みている。" #deepl:1034593519
 frontera_ot.4.f: "この汚れた古い地図の上で、小さな国境線と皺を見分けることなど、誰にできようか？" #deepl:2316071882
 frontera_ot.4.a: "[SCOPE.sCountry('ot_1_scope').GetNameNoFlag]で再調査を依頼してください。" #deepl:2273386938
 frontera_ot.4.b: "[SCOPE.sCountry('ot_2_scope').GetNameNoFlag] の「[SCOPE.sCountry('ot_2_scope').GetRuler.GetPrimaryRoleTitle]」は、[SCOPE.sCountry('ot_2_scope').GetRuler.GetHerHis] の権利の範囲内です。" #deepl:4240412277
 frontera_ot.4.c: "そうだ！大虐殺だ！[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]のために血を流せ！" #deepl:2183657101
 frontera_ot.4.e: "そうだ！大虐殺だ！[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]のために血を流せ！" #deepl:2183657101
