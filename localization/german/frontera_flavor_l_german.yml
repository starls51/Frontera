 CAL_FLAVOR_TEXT: "Alta California erklärte 1821 seine Treue gegenüber dem neu unabhängigen Mexiko. Die mexikanischen Behörden haben versucht, das riesige Gebiet zu integrieren, aber die Spannungen zwischen den Kolonisten und den lokalen Führern der Californio erreichen ihren Siedepunkt. Umgeben von ehrgeizigen Kolonialmächten, wie könnte die Zukunft Kaliforniens aussehen?" #deepl:578679357
