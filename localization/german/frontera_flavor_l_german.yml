l_german:
 CAL_FLAVOR_TEXT: "Alta California erklärte 1821 seine Treue gegenüber dem gerade unabhängig gewordenen Mexiko. Die mexikanischen Behörden haben versucht, das riesige Gebiet zu integrieren, doch die Spannungen mit den Kolonisten und den lokalen Führern der Californio erreichen ihren Höhepunkt. Umgeben von ehrgeizigen Kolonialmächten – wie könnte die Zukunft Kaliforniens aussehen?" #deepl:578679357
 frontera_settler_lore: "#lore  Siedler, Händler, Missionare und Soldaten dringen auf der Suche nach Land und neuen Möglichkeiten immer weiter vor, oft weit außerhalb der Reichweite der Zentralregierung. Wenn diese entlegenen Gebiete integriert werden sollen, muss die Verwaltung der Expansion folgen. Wo Siedlungen wachsen, könnten eines Tages neue Staaten in unser Herrschaftsgebiet aufgenommen werden. #!" #deepl:5769617
