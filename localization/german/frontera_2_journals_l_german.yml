l_german:
 je_organized_territories_frontera: "Gebiet organisieren" #deepl:2984011793
 je_organized_territories_frontera_reason: "Im Bestreben, das Land zu erweitern, könnte aus einigen unserer [Concept('concept_unincorporated_state','$concept_unincorporated_states$')] ein [concept_organized_territory] gegründet werden. Diese werden zu [Concept('concept_incorporated_state','$concept_incorporated_states$')], die sich im Besitz der [concept_organized_territory] befinden. \n \n $frontera_settler_lore$" #deepl:334027685
 je_organize_territory_button: "Neues Terrain erschließen" #deepl:3442212506
 je_organize_territory_button_desc: "Organisieren Sie einige „[Concept('concept_unincorporated_state','$concept_unincorporated_states$')]“ zu einem „[concept_organized_territory]“." #deepl:2770156865
 je_sunset_route_frontera: "Die Sonnenuntergangsroute" #deepl:1011417108
 je_sunset_route_frontera_reason: "Eine Eisenbahnverbindung nach Kalifornien, die auch bei warmem Wetter befahrbar ist, würde einen beispiellosen Waren- und Personenverkehr zwischen Ost und West ermöglichen. Dieses Projekt erfordert jedoch ein hohes Maß an Koordination. Neben der Beilegung der anhaltenden „Froschkriege“ #! zwischen Grundstückseigentümern ist es zudem unerlässlich, Spurweiten, Signalanlagen und Fahrpläne zu vereinheitlichen. Dies könnte sich als schwieriger erweisen, wenn ausländische Staaten Abschnitte der Strecke entlang der geplanten Route kontrollieren, doch ist diese Aufgabe keineswegs unmöglich." #deepl:2977714634
 je_sunset_route_frontera_button: "Verbinde die Sunset Route" #deepl:317884082
 je_sunset_route_frontera_button_desc: "Vermittlung zwischen verschiedenen Interessengruppen beim Bau einer neuen Eisenbahnstrecke nach Kalifornien" #deepl:1348194334
 je_gadsden_purchase_frontera_button: "Die Grenzen auf die Probe stellen" #deepl:2467056109
 je_gadsden_purchase_frontera_button_desc: "Der Ausbau des Schienennetzes in Richtung Westen wird durch die physische Kontrolle über den erforderlichen Landkorridor besser zu bewältigen sein. Auch wenn dies politisch riskant ist, könnte die Auslösung von Grenzstreitigkeiten mit Nachbarländern weitere diplomatische oder militärische Optionen eröffnen, um Land für das Projekt zu erwerben." #deepl:110269188
 je_organized_territory_internal_frontera: "Die Grenze besiedeln" #deepl:2132308742
 je_organized_territory_internal_frontera_reason: "[ROOT.GetCountry.GetNameNoFlag] ist eine [concept_organized_territory], die zu [ROOT.GetCountry.GetTopOverlord.GetNameNoFlag] gehört. Diese [concept_subject_type] ermöglicht eine erhöhte [concept_migration] und die spätere Erstellung neuer [Concept('concept_homeland','$concept_homelands$')] für die [concept_overlord] [concept_country]. Durch den Erwerb von [concept_autonomy] wird [ROOT.GetCountry.GetNameNoFlag] zu einer [concept_dominion] und ermöglicht Änderungen an deren [GetLawGroup('lawgroup_governance_principles').GetName]. \n \n $frontera_settler_lore$" #deepl:4286496753
 je_fort_ross_frontera: "Tor zum Pazifik" #deepl:2279191856
 je_fort_ross_frontera_reason: "[GetStateRegion('STATE_CALIFORNIA').GetName] bleibt ein dünn besiedeltes Grenzgebiet, das unter einem fragilen spanischen Papieranspruch wankt und von ehrgeizigen Nachbarn umgeben ist. Doch ihre Häfen, Ländereien und Ressourcen sind reich an Segen. \n \n Die Kontrolle über dieses [concept_state_region] könnte eine wichtige Rolle bei der Festlegung des Kräfteverhältnisses auf der [GetStrategicRegion('region_pacific_coast').GetName] spielen." #deepl:51288871
 frontera_treaty_of_limits: "Entwurf eines überarbeiteten Grenzvertrags" #deepl:2091412374
 frontera_treaty_of_limits_desc: "Die rechtlichen Grenzen an der amerikanischen Grenze werden von unseren Nachbarn nicht respektiert. Entsenden Sie eine diplomatische Mission und klären Sie diese Angelegenheit ein für alle Mal." #deepl:1253377358
 frontera_manifest_destiny: "Den Nueces Strip ausbauen" #deepl:2389825869
 frontera_manifest_destiny_desc: "Mexiko hat unsere Souveränität über Texas noch nicht anerkannt. Wir müssen eine militärische Präsenz jenseits des Nueces River aufbauen und keinen Zweifel an den Ambitionen Amerikas im Westen aufkommen lassen." #deepl:784934809
