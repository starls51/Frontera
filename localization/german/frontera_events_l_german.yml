 debug_req_pop_ct: "Der Bundesstaat hat eine Einwohnerzahl von" #deepl:2150280673
 debug_req_primary_perc: "Der Staat hat einen prozentualen Anteil von [Prozent] an der Hauptkultur von Overlord" #deepl:695788310
 frontera_ot_homeland.1: "Staatszugehörigkeit" #deepl:290487462
 frontera_ot_homeland.1.t: "Zuhause, süßes Zuhause" #deepl:759433816
 frontera_ot_homeland.1.d: "Die Siedlerbevölkerung in [SCOPE.sState('ascendent_state').GetNameNoFormatting] ist erheblich gewachsen. Trotz aller ungelösten Konflikte mit den Ureinwohnern scheint dieser Ort für viele kommende Generationen [SCOPE.sCountry('overlord_scope').GetAdjectiveNoFormatting] ein [Concept('concept_homeland','$concept_homeland$')] zu sein." #deepl:4242322575
 frontera_ot_homeland.1.f: "„Ich wurde in der Prärie geboren, wo der Wind frei wehte und nichts das Sonnenlicht trübte.“ – Geronimo" #deepl:2391563847
 frontera_ot_homeland.1.a: "[SCOPE.sState('ascendent_state').GetNameNoFormatting] könnte bald ein Bundesstaat werden." #deepl:3155158794
 frontera_ot_homeland.1.b: "Meine Arbeit hier ist getan." #deepl:1429745245
 frontera_ot_homeland.1.c: "[SCOPE.sState('ascendent_state').GetNameNoFormatting] wird vorerst eine territoriale Beteiligung bleiben." #deepl:1129899227
 frontera_fort_ross.1: "Verluste begrenzen" #deepl:1680067657
 frontera_fort_ross.1.t: "Verluste begrenzen" #deepl:1680067657
 frontera_fort_ross.1.d: "Fort Ross wurde ursprünglich gegründet, um die Siedler in Alaska mit Lebensmitteln zu versorgen. Dieser junge Außenposten der „[SCOPE.sCountry('seller_scope').GetAdjectiveNoFormatting]“ hat seitdem an Bedeutung verloren. Beamte der „[SCOPE.sCountry('buyer_scope').GetAdjectiveNoFormatting]“ sind kürzlich auf diesen zweifelhaften Landanspruch aufmerksam geworden. Der Verkauf der Gebäude würde die Möglichkeit bieten, sich in Würde zurückzuziehen und etwaige Spannungen in der Region abzubauen." #deepl:3386575780
 frontera_fort_ross.1.f: "\n„Wie Sie sehen, wäre dies ein idealer Ort, um meine #bold  New Helvetia #! zu gründen. Ja, das ist gutes Land … für das Sie bezahlt würden! Ah #italic  Natürlich #! werden Sie großzügig entlohnt“, sagt [SCOPE.sCharacter('john_sutter_scope').GetLastNameNoFormatting], der den Kauf unbedingt abschließen möchte. „Zu gegebener Zeit. Oh ja, zu gegebener Zeit …“" #deepl:1029766778
 frontera_fort_ross.1.a: "Niemals! [SCOPE.sState('california_scope').GetNameNoFormatting] gehört zu Recht uns." #deepl:207577355
 frontera_fort_ross.1.b: "Das ist ein guter Plan." #deepl:3518633261
 frontera_fort_ross.1.c: "[SCOPE.sState('california_scope').GetNameNoFormatting] war schon immer [SCOPE.sCountry('seller_scope').GetAdjectiveNoFormatting]..." #deepl:1496946436
 frontera_fort_ross.2: "Verluste begrenzen" #deepl:1680067657
 frontera_fort_ross.2.t: "Den Schaden begrenzen" #deepl:3839667639
 frontera_fort_ross.2.d: "[SCOPE.sCountry('seller_scope').GetNameNoFormatting] beabsichtigt, seine Anteile an der „[SCOPE.sState('california_scope').GetNameNoFormatting]“ abzugeben." #deepl:1434516165
 frontera_fort_ross.2.f: "Die lokalen Vertreter der „[SCOPE.sCountry('buyer_scope').GetAdjectiveNoFormatting]“ würden es sehr begrüßen, wenn „[SCOPE.sCountry('seller_scope').GetNameNoFormatting]“ die Siedlung aufgeben würde. Ein Verkauf der Gebäude würde die Möglichkeit bieten, sich mit gewahrter Ehre zurückzuziehen und etwaige Spannungen in der Region abzubauen." #deepl:2936373317
 frontera_fort_ross.2.a: "Nein, „[SCOPE.sState('california_scope').GetNameNoFormatting]“ ist ein wertvoller Ansatzpunkt." #deepl:4183963343
 frontera_fort_ross.2.b: "Na gut, das geht die mächtige „[SCOPE.sCountry('overlord_scope').GetNameNoFormatting]“ nichts an." #deepl:1288417892
 frontera_fort_ross.3: "Was für eine Unverschämtheit!" #deepl:61601467
 frontera_fort_ross.3.t: "Was für eine Unverschämtheit!" #deepl:61601467
 frontera_fort_ross.3.d: "[SCOPE.sCountry('seller_scope').GetNameNoFormatting] [SCOPE.sState('california_scope').GetNameNoFormatting] wird immer selbstbewusster." #deepl:2360485480
 frontera_fort_ross.3.f: "Trotz der rechtlich unsicheren Grundlage ihres Anspruchs haben Gruppen von Siedlern aus [SCOPE.sCountry('seller_scope').GetAdjectiveNoFormatting] den schwelenden Territorialstreit zwischen [SCOPE.sCountry('buyer_scope').GetNameNoFormatting] und [SCOPE.sCountry('seller_scope').GetNameNoFormatting] weiter angeheizt." #deepl:2021577011
 frontera_fort_ross.3.a: "[SCOPE.sCountry('buyer_scope').GetAdjectiveNoFormatting] Die Menschen müssen sich gemeinsam gegen diese Bedrohung stellen" #deepl:177952069
 frontera_fort_ross.4: "Das Fort „[SCOPE.sCharacter('john_sutter_scope').GetLastNameNoFormatting]“" #deepl:4241808508
 frontera_fort_ross.4.t: "Das Fort „[SCOPE.sCharacter('john_sutter_scope').GetLastNameNoFormatting]“" #deepl:4241808508
 frontera_fort_ross.4.d: "[SCOPE.sCharacter('john_sutter_scope').GetHomeCountry.GetAdjectiveNoFormatting] – Die amerikanische Einwanderin, Pionierin und Polyglottin[SCOPE.sCharacter('john_sutter_scope').GetFullNameNoFormatting] ist in „[SCOPE.sState('california_scope').GetNameNoFormatting]“ angekommen." #deepl:1729197350
 frontera_fort_ross.4.f: "[SCOPE.sCharacter('john_sutter_scope').GetFullNameNoFormatting] hat die Überreste einer alten Festung in [SCOPE.sState('california_scope').GetNameNoFormatting] erworben. Materialien aus den abgerissenen Gebäuden werden für den Bau [SCOPE.sCharacter('john_sutter_scope').GetHerHis] einer neuen Siedlung namens #bold  New Helvetia #! verwendet. Mit unserem Segen könnte die Kolonie als Puffer gegen widerspenstige Ureinwohner dienen. [SCOPE.sCharacter('john_sutter_scope').GetLastNameNoFormatting] behauptet, dass #bold  New Helvetia #! ein Leuchtfeuer der Zivilisation für die Grenzregion sein wird. Es gibt jedoch besorgniserregende Berichte über Misshandlungen von Ureinwohnern, die bei [SCOPE.sCharacter('john_sutter_scope').GetHerHis] beschäftigt sind, sowie in den umliegenden Dörfern. \n \n #italic „Die alte Welt stirbt, und die neue Welt kämpft um ihre Geburt: Jetzt ist die Zeit der Monster.“ – Antonio Gramsci #!" #deepl:4023662245
 frontera_fort_ross.4.a: "Schickt diesen Verrückten dorthin zurück, wo „[SCOPE.sCharacter('john_sutter_scope').GetSheHe]“ herkam." #deepl:508690232
 frontera_fort_ross.4.b: "Na gut, „[SCOPE.sCharacter('john_sutter_scope').GetSheHe]“ wird uns helfen, die Wildnis zu zähmen!" #deepl:3603057105
 frontera_sunset_route_event.1: "Die Sonnenuntergangsroute" #deepl:1011417108
 frontera_sunset_route_event.1.t: "Die Sonnenuntergangsroute" #deepl:1011417108
 frontera_sunset_route_event.1.d: "[SCOPE.sState('california_scope').GetNameNoFormatting] wurde erfolgreich per Eisenbahn an den östlichen Teil des Kontinents angebunden. Diese durch die Sonora-Wüste führende Strecke mit ihrem milden Klima kann das ganze Jahr über ohne Unterbrechung befahren werden." #deepl:1375503153
 frontera_sunset_route_event.2.d: "[SCOPE.sCountry('builder_scope').GetNameNoFormatting] hat sich dafür eingesetzt, die Region „[SCOPE.sState('california_scope').GetNameNoFormatting]“ per Bahn mit dem Osten des Kontinents zu verbinden. Diese durch die Sonora-Wüste führende Strecke mit ihrem milden Klima kann das ganze Jahr über ohne Unterbrechung befahren werden." #deepl:3852099163
 frontera_sunset_route_event.1.f: "„Da habt ihr das Gesetz, Jungs, klar wie Kloßbrühe“, erklärte der Gouverneur, und seine Stimme klang so fest wie der eiserne Riese hinter ihm. Der Wind peitschte über die Wüste, und Virgil Earps Hand ruhte auf seinem Revolver. Wären nicht all die unschuldigen Stadtbewohner gekommen, um zuzusehen, hätte es vielleicht zu einer Schießerei gekommen. Earps widerwilliger Seufzer schwebte wie ein zischender Dampfschwaden in die sonnenverbrannte Hitze. Die Lokomotive rollte weiter, und die Sunset Route war eröffnet." #deepl:295026560
 frontera_sunset_route_event.1.a: "Ein Sieg für den Fortschritt!" #deepl:2958605196
 frontera_sunset_route_event.2.a: "Schön für sie..." #deepl:2754019974
 frontera_sunset_route_event.3: "Streit im Mesilla-Tal" #deepl:510184323
 frontera_sunset_route_event.3.t: "Streit im Mesilla-Tal" #deepl:510184323
 frontera_sunset_route_event.3.d: "Die Streitigkeiten um die Eigentumsverhältnisse im Mesilla-Tal haben sich zu einem diplomatischen Konflikt zwischen [SCOPE.sCountry('buyer_scope').GetNameNoFormatting] und [SCOPE.sCountry('angry_country_scope').GetNameNoFormatting] ausgeweitet." #deepl:1879231144
 frontera_sunset_route_event.3.f: "„Die Späher der ‚[SCOPE.sCountry('buyer_scope').GetAdjectiveNoFormatting]‘ reiten über unsere Grenze hinweg, als gehöre sie ihnen bereits“, schimpfte der Minister von [SCOPE.sCountry('angry_country_scope').GetAdjectiveNoFormatting]. [SCOPE.sCountry('angry_country_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('angry_country_scope').GetRuler.GetFullNameNoFormatting] zog in grüblerischer Ruhe an einer [SCOPE.sCountry('angry_country_scope').GetRuler.GetHerHis]-Zigarre; der schwache Schein umrandete kurz [SCOPE.sCountry('angry_country_scope').GetRuler.GetHerHis] verwitterte Gesichtszüge, bevor er in der Dunkelheit verschwand. \n \n„Wenn ich mich weigere zu verkaufen, werden sie es mit Gewalt an sich reißen.“\n \n„Und wenn Sie zustimmen?“\n \n„Wir werden bezahlt … für das, was wir verlieren müssen.“" #deepl:3985735214
 frontera_sunset_route_event.3.a: "Weitere bewaffnete Expeditionen entsenden" #deepl:3471564856
 frontera_sunset_route_event.3.b: "Versuchen Sie es mit einem friedlicheren Ansatz" #deepl:990404971
 frontera_sunset_route_event.4: "Eindringen in das Mesilla-Tal" #deepl:3780924556
 frontera_sunset_route_event.4.t: "Eindringen in das Mesilla-Tal" #deepl:3780924556
 frontera_sunset_route_event.4.d: "Ausländische Militärexpeditionen haben wiederholt die in der Nähe des Mesilla-Tals gezogene Grenze überschritten." #deepl:2990890124
 frontera_sunset_route_event.4.f: "$frontera_sunset_route_event.3.f$" #deepl:3255788596
 frontera_sunset_route_event.4.a: "Angebot zum Verkauf des Grundstücks" #deepl:3847002548
 frontera_sunset_route_event.4.b: "Sie wären Narren, wenn sie einmarschieren würden" #deepl:346374326
 frontera_sunset_route_event.5: "Vermessungsingenieure in der Wüste" #deepl:1781160719
 frontera_sunset_route_event.5.t: "Vermessungsingenieure in der Wüste" #deepl:1781160719
 frontera_sunset_route_event.5.d: "[SCOPE.sCountry('buyer_scope').GetAdjectiveNoFormatting] Vertreter haben Diplomaten aus dem „[SCOPE.sCountry('seller_scope').GetAdjectiveNoFormatting]“ in eine Sondierungsmission im Mesilla-Tal einbezogen. Es scheint, als hofften sie, internationale Eisenbahnverbindungen zwischen den beiden Ländern aufzubauen." #deepl:3671600249
 frontera_sunset_route_event.5.f: "Unabhängig davon, ob wir dem Plan zustimmen oder nicht, bieten diese Erhebungen eine hervorragende Gelegenheit, Infrastrukturverbesserungen zu planen und Erfahrungen mit fortschrittlicheren Verkehrsmitteln auszutauschen." #deepl:3061632216
 frontera_sunset_route_event.5.a: "Eine nachbarschaftliche Geste." #deepl:3189443051
 frontera_treaty_of_limits.1:0 "Old Words, New Treaty
 frontera_treaty_of_limits.1.t:0 "Old Words, New Treaty
 frontera_treaty_of_limits.1.d: "Unter dem Vorwand, die rechtmäßigen Erben des nicht mehr gültigen „Adams–Onís-Vertrags“ (#bold ) zu sein (#!, [SCOPE.sCountry('buyer_scope').GetAdjectiveNoFormatting]), üben Vertreter dieser Organisation Druck auf [SCOPE.sCountry('seller_scope').GetCapital.GetCityHubName] aus, die alten Grenzverläufe des Vertrags anzuerkennen und durchzusetzen." #deepl:2830373953
 frontera_treaty_of_limits.1.f: "Der Grenzvertrag von Limits #! wurde 1821 zwischen den Vereinigten Staaten und Mexiko unterzeichnet. Er erneuerte Bestimmungen des Adams-Onís-Vertrags #italic , der zwei Jahre zuvor von Spanien unterzeichnet worden war. Neben der Übertragung der Kontrolle über Florida an die Vereinigten Staaten bestätigte der Adams-Onís-Vertrag #! auch eine rechtliche Grenze zu Spanien im Westen." #deepl:4100799599
 frontera_treaty_of_limits.1.a: "Ratifizieren Sie den Vertrag." #deepl:468172514
 frontera_treaty_of_limits.1.b: "Was für eine absurde Idee..." #deepl:1417336212
 frontera_treaty_of_limits.2: "Alte Worte, kein Vertrag: [SCOPE.sCountry('seller_scope').GetCapital.GetCityHubName]" #deepl:1106196979
 frontera_treaty_of_limits.2.t: "Alte Worte, kein Vertrag: [SCOPE.sCountry('seller_scope').GetCapital.GetCityHubName]" #deepl:1106196979
 frontera_treaty_of_limits.2.d: "Die Vertreter der „[SCOPE.sCountry('buyer_scope').GetAdjectiveNoFormatting]“ sind von ihrer diplomatischen Mission in [SCOPE.sCountry('seller_scope').GetCapital.GetCityHubName] zurückgekehrt. Leider lehnten ihre Kollegen von der „[SCOPE.sCountry('seller_scope').GetAdjectiveNoFormatting]“ die „absurde“ Idee ab, den „#italic “-Vertrag von Limits #! wiederzubeleben." #deepl:4221233034
 frontera_treaty_of_limits.2.f: "Es war einer der besten Orte, um einen angesehenen Gast zu beeindrucken, und eines der besten Restaurants in [SCOPE.sCountry('seller_scope').GetCapital.GetCityHubName]. „Da könnten sie uns genauso gut bitten, eine Flagge von [SCOPE.sCountry('buyer_scope').GetAdjectiveNoFormatting] auf dem Mond zu hissen!“ Die Gesellschaftsleute von [SCOPE.sCountry('seller_scope').GetAdjectiveNoFormatting] brachen in Gelächter aus. \n \n An einem Tisch in der Nähe tauschten zwei Diplomaten von [SCOPE.sCountry('buyer_scope').GetAdjectiveNoFormatting] besorgte Blicke aus." #deepl:1334437244
 frontera_treaty_of_limits.2.a: "Eine formelle Anzeige erstatten." #deepl:3722538865
 frontera_treaty_of_limits.2.b: "Lass diese Idee sein." #deepl:3521850535
 frontera_treaty_of_limits.3: "Alte Worte, neuer Vertrag: [SCOPE.sCountry('seller_scope').GetCapital.GetCityHubName]" #deepl:3693793379
 frontera_treaty_of_limits.3.t: "Alte Worte, neuer Vertrag: [SCOPE.sCountry('seller_scope').GetCapital.GetCityHubName]" #deepl:3693793379
 frontera_treaty_of_limits.3.d: "Die Vertreter der „[SCOPE.sCountry('buyer_scope').GetAdjectiveNoFormatting]“ sind von ihrer diplomatischen Mission in „[SCOPE.sCountry('seller_scope').GetCapital.GetCityHubName]“ zurückgekehrt und zeigen sich begeistert von den positiven Kontakten zu ihren Kollegen von „[SCOPE.sCountry('seller_scope').GetAdjectiveNoFormatting]“. Die Verhandlungen verlaufen zugunsten von „[SCOPE.sCountry('buyer_scope').GetNameNoFormatting]“." #deepl:1366457633
 frontera_treaty_of_limits.3.b: "Das ist ein Zeichen von Schwäche." #deepl:2947401295
