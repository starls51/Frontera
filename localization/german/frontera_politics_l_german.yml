 ideology_frontera_mexican_federalist: "Mexikanischer Föderalist" #deepl:2228111078
 ideology_frontera_mexican_federalist_desc: "Die Föderalisten treten für eine dezentrale Regierungsform ein, die den einzelnen Bundesstaaten weitgehende Autonomie gewährt. Inspiriert vom Vorbild der Vereinigten Staaten wollen die Föderalisten die lokalen Freiheiten schützen und verhindern, dass sich in der Hauptstadt ein einzelner Diktator etabliert." #deepl:3704296238
