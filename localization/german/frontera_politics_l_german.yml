 ideology_frontera_mexican_federalist_desc: "Föderalisten befürworten eine dezentrale Regierung, die den einzelnen Staaten weitgehende Autonomie gewährt. Inspiriert vom Modell der Vereinigten Staaten wollen die Föderalisten die lokalen Freiheiten schützen und den Aufstieg eines einzelnen Diktators in der Hauptstadt verhindern." #deepl:3704296238
