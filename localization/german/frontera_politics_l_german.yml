 ideology_frontera_mexican_centralist: "Mexikanischer Zentralist" #deepl:1986234739
 ideology_frontera_mexican_centralist_desc: "Zentralisten streben eine starke, einheitliche nationale Regierung an, typischerweise auf Kosten der regionalen Autonomie. Sie versuchen, Ordnung in eine chaotische frühe Republik zu bringen, indem sie die zentralisierte Struktur der Kolonialzeit nachahmen." #deepl:2906061988
