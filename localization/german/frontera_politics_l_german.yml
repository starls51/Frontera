 ideology_frontera_mexican_centralist_desc: "Zentralisten streben nach einer starken, einheitlichen nationalen Regierung, meist auf Kosten der regionalen Autonomie. Sie versuchen, in der chaotischen Frühphase der Republik Ordnung zu schaffen, indem sie die zentralistische Struktur der Kolonialzeit nachahmen." #deepl:2906061988
