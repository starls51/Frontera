 concept_organized_territory_desc: "Ein „[concept_subject]“ ([concept_country]), der „[GetLawType('law_frontier_territorial_administration').GetName]“ implementiert hat. Jeder seiner „[Concept('concept_incorporated_state','$concept_incorporated_states$')]“ kann schließlich zu einem „[Concept('concept_homeland','$concept_homeland$')]“ für einen „[Concept('concept_overlord','$concept_overlord_possessive$')]“ ([Concept('concept_primary_cultures','$concept_primary_culture$')]) werden. Jeder seiner „[Concept('concept_state','$concept_states$')]“ muss bestimmte Bedingungen erfüllen, damit der „[concept_homeland]“ erscheint. \n \n Ein neuer [concept_homeland] erscheint in einem [concept_state], wenn: \n $EFFECT_LIST_BULLET$ die [Concept('concept_pop', '$concept_population$')]-Größe über #bold  85.000 #! \n $EFFECT_LIST_BULLET$ liegt; [Concept('concept_cultural_community','$concept_cultural_community$')] von [Concept('concept_overlord','$concept_overlord_possessive$')] [Concept('concept_primary_cultures','$concept_primary_culture$')] \n $EFFECT_LIST_BULLET$ mindestens #bold  60 % #! von [Concept('concept_pop', '$concept_pops$')] [Concept('concept_discrimination','@acceptance_status_5! $full_acceptance$')] oder [Concept('concept_discrimination','@acceptance_status_4! $second_rate_citizen$')] sind #indent_newline:3 \n #italic  Diese Anforderung #tooltippable;tooltip: [GetPlayer.GetTooltipTag],frontera_ot_pop_scaling_rule_tt wird #! mit steigender Bevölkerungszahl des Bundesstaates #! #! \n \n #bold  reduziert. Organisierte Gebiete #! profitieren von [GetLawType('law_homesteading').GetName] und einer direkten [Concept('concept_overlord','$concept_overlord$')], die [Concept('concept_investment_level', '$concept_investment_levels$')] im [GetInstitutionType('institution_colonial_affairs').GetName] [concept_institution] erhöht." #deepl:3004377925
 concept_organized_territory_desc_added: "[GetInstitutionType('institution_colonial_affairs').GetName]" #deepl:743845877
 frontera_ot_homeland_gained_homeland: "Da [SCOPE.sState('ascendent_state').GetName] eine [Concept('concept_homeland','$concept_homeland$')] zu seiner Mehrheit [SCOPE.sCountry('overlord_scope').GetAdjectiveNoFormatting] [Concept('concept_primary_cultures','$concept_primary_culture$')] #! ist, kann es nun von [SCOPE.sCountry('overlord_scope').GetName] annektiert werden. \n \n #italic  Die [concept_state] muss noch den [Concept('concept_unincorporated_state','$concept_incorporation$')]-Prozess durchlaufen, um eine [concept_incorporated_state] zu werden. #!" #deepl:3409905544
 frontera_establish_ot_in_region_tt: "Es wird eine Datei „[concept_organized_territory]“ erstellt. \n $EFFECT_LIST_BULLET$ Die folgenden Dateien werden übertragen: [Concept('concept_unincorporated_state','$concept_unincorporated_states$')]:#indent_newline:2 #indent_newline:2 " #deepl:4160631454
 frontera_stateslist_tt: "[THIS.GetState.GetName]" #deepl:318863887
 frontera_ot_homeland_not_ready_for_statehood_tt: "Diese Website [concept_state] wird mindestens weitere #bold  3 Jahre lang #! nicht versuchen, sich der Website [concept_overlord] [concept_country] anzuschließen." #deepl:3349629079
 frontera_ot_pop_scaling_rule_tt: "$EFFECT_LIST_BULLET$ [concept_state] [Concept('concept_pop', '$concept_population$')] Größe #bold  85k #!—#bold  200k #!: mindestens #bold  60% #! muss [Concept('concept_acceptance', '$concept_accepted$')] \n $EFFECT_LIST_BULLET$ [concept_state] [Concept('concept_pop', '$concept_population$')] Größe #bold  200k #!—#bold  500k #!: mindestens #bold  45% #! muss [Concept('concept_acceptance', '$concept_accepted$')] \n $EFFECT_LIST_BULLET$ [concept_state] [Concept('concept_pop', '$concept_population$')] Größe #bold  500k #!—#bold  1m #!: mindestens #bold  30% #! muss [Concept('concept_acceptance', '$concept_accepted$')] \n $EFFECT_LIST_BULLET$ [concept_state] [Concept('concept_pop', '$concept_population$')] Größe #bold  1m #! und darüber: mindestens #bold  20% #! muss [Concept('concept_acceptance', '$concept_accepted$')]" #deepl:2529047697
 frontera_ot_creation_reset_tt: "Der Abklingzeit-Timer für die Erstellung eines neuen [concept_organized_territory] wird zurückgesetzt \n \n #italic  Das Platzieren eines [GetDecreeType('decree_greener_grass_campaign').GetName] [concept_decree] in einem [concept_unincorporated_state] neben einem [concept_incorporated_state] kann darüber entscheiden, welches [concept_state] als neues [Concept('concept_organized_territory','$concept_organize_territory_possessive$')] [Concept('concept_capital_state','$concept_capital_state_short$')] ausgewählt wird, wenn dieses Ereignis das nächste Mal ausgelöst wird. #!" #deepl:668338308
 creating_OT_frontera_tt: "#indent_newline:2 Einem „[concept_organized_territory]“ wird ein „[concept_capital_state]“ nach folgenden Regeln zugewiesen: \n $EFFECT_LIST_BULLET$ Ist [Concept('concept_unincorporated_state','$concept_unincorporated_state$')] \n $EFFECT_LIST_BULLET$ Ist #bold  nicht #! [ROOT.GetCountry.GetAdjectiveNoFormatting] [Concept('concept_homeland','$concept_homeland$')] \n $EFFECT_LIST_BULLET$ Ist #bold  benachbart #! zu [ROOT.GetCountry.GetAdjectiveNoFormatting] [Concept('concept_incorporated_state','$concept_incorporated_state$')]. \n $EFFECT_LIST_BULLET$ Hat [GetDecreeType('decree_greener_grass_campaign').GetName] oder [concept_state] mit den meisten unbesetzten [concept_arable_land]" #deepl:1587096270
 creating_OT_frontera_2_tt: "#italic  Alle Staaten, die die ersten beiden Regeln befolgen und eine gemeinsame Domain „[concept_strategic_region]“ mit der neuen Website „[concept_capital_state]“ nutzen, werden an die „[concept_organized_territory]“ (#!) abgetreten." #deepl:2838758393
