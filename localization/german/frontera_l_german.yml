 je_sunset_route_frontera_reason: "Eine Eisenbahnverbindung nach Kalifornien für die warme Jahreszeit würde einen beispiellosen Handels- und Personenverkehr zwischen Ost und West ermöglichen. Dieses Projekt erfordert jedoch eine erhebliche Koordinierung. Abgesehen von der Beilegung der anhaltenden „Frog Wars“ #! zwischen Grundstückseigentümern ist es auch unerlässlich, Spurweiten, Signale und Fahrpläne zu standardisieren. Dies könnte sich als schwieriger erweisen, wenn ausländische Staaten Abschnitte der geplanten Strecke kontrollieren, aber die Aufgabe ist keineswegs unmöglich." #deepl:1621464726
 je_sunset_route_frontera_button: "Verbinden Sie die Sunset Route" #deepl:317884082
 je_sunset_route_frontera_button_desc: "Vermitteln Sie zwischen verschiedenen Interessengruppen, um eine neue Bahnstrecke nach Kalifornien zu schaffen." #deepl:952386937
