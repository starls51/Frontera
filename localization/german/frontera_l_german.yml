 da_organize_territory_from_subject_desc: "Die „[Concept('concept_law', '$concept_laws$')]” und „[Concept('concept_institution', '$concept_institutions$')]” dieser „[concept_subject]” werden zu einem „#bold ” umgewandelt. Organisiertes Territorium #!. Siedler werden sich eher hier niederlassen [Concept('concept_migration','$concept_migrate$')], aber die lokale „[Concept('concept_pop', '$Population$')]” wird „[Concept('concept_radical','$concept_radicalized$')]” werden." #deepl:2949097403
