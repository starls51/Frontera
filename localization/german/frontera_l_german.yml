 je_organized_territories_frontera: "Organisiertes Territorium etablieren" #deepl:1625332565
 je_organized_territories_frontera_reason: "Im Bestreben, unser Land zu vergrößern, kann aus einigen unserer [Concept('concept_unincorporated_state','$concept_unincorporated_states$')] ein #bold  Organized Territory #! gegründet werden. Diese werden zu [Concept('concept_incorporated_state','$concept_incorporated_states$')] im Besitz des #bold  Organized Territory #!. \n \n Während ein #bold  Organized Territory #! [GetLawType('law_homesteading').GetName] in Kraft gesetzt hat, erhalten seine beiden [Concept('concept_incorporated_state','$concept_states$')] mit dem höchsten [Concept('concept_gdp','$concept_gdp_short$')] einen jährlichen Bonus auf [Concept('concept_migration','$concept_migration$')]. Jedes [Concept('concept_incorporated_state','$concept_incorporated_state$')], das zu einem #bold  Organized Territory #! gehört, kann schließlich zu einem [Concept('concept_homeland','$concept_homeland$')] eines [Concept('concept_overlord','$concept_overlord_possessive$')] [Concept('concept_primary_cultures','$concept_primary_culture$')] werden. \n #indent_newline:2 \n Ein „[concept_state]” wird zu einem „[Concept('concept_homeland','$concept_homeland$')]”, wenn: \n $EFFECT_LIST_BULLET$ Es einen „[Concept('concept_cultural_community','$concept_cultural_community$')]” von [Concept('concept_overlord','$concept_overlord_possessive$')] [Concept('concept_primary_cultures','$concept_primary_culture$')] \n $EFFECT_LIST_BULLET$ 60 % der „[Concept('concept_pop', '$concept_population$')]” einen „[concept_acceptance]” von 65 oder mehr haben \n $EFFECT_LIST_BULLET$ Der „[concept_state]” [Concept('concept_pop', '$concept_population$')] über 85.000 beträgt \n \n #lore  Siedler, Händler, Missionare und Soldaten drängen auf der Suche nach Land und Möglichkeiten nach außen, oft außerhalb der Reichweite der Zentralregierung. Wenn diese entfernten Gebiete integriert werden sollen, muss die Verwaltung der Expansion folgen. Wo Siedlungen wachsen, können eines Tages neue Staaten in unser Herrschaftsgebiet aufgenommen werden. #!" #deepl:544344828
