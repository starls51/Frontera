 je_gadsden_purchase_frontera_button_desc: "Die Erweiterung der Eisenbahn nach Westen wird besser zu bewältigen sein, wenn wir den erforderlichen Landkorridor physisch kontrollieren. Auch wenn dies politisch riskant ist, könnten Grenzstreitigkeiten mit unseren Nachbarn weitere diplomatische oder militärische Optionen eröffnen, um Land für unser Projekt zu erwerben." #deepl:1391362877
