 creating_OT_frontera_tt: "#indent_newline:2 Ein #bold  Organisiertes Gebiet #! erhält einen [concept_capital_state] gemäß den folgenden Regeln: \n $EFFECT_LIST_BULLET$ Ist [Concept('concept_unincorporated_state','$concept_unincorporated_state$')] \n $EFFECT_LIST_BULLET$ Ist #bold  nicht #! [ROOT.GetCountry.GetAdjectiveNoFormatting] [Concept('concept_homeland','$concept_homeland$')] \n $EFFECT_LIST_BULLET$ Ist #bold  angrenzend #! an [ROOT.GetCountry.GetAdjectiveNoFormatting] [Concept('concept_incorporated_state','$concept_incorporated_state$')]. \n $EFFECT_LIST_BULLET$ Hat [GetDecreeType('decree_greener_grass_campaign').GetName] oder [concept_state] mit höchstem [Concept('concept_gdp','$concept_gdp_short$')]" #deepl:2335454090
 creating_OT_frontera_2_tt: "#italic  Alle Staaten, die die ersten beiden Regeln befolgen und eine „[concept_strategic_region]“ mit dem neuen „[concept_capital_state]“ teilen, werden an das „#bold  Organized Territory“ #! #! abgetreten." #deepl:1399382270
