 law_frontier_territorial_administration_desc: "Der Staat ist rechtlich gesehen eine Unterabteilung einer ausländischen Macht und verfügt über keine eigene Souveränität. Ihm wurde eine begrenzte Befugnis zur Verwaltung eines Flickenteppichs von Territorialbesitzungen übertragen. Die Territorialregierung soll bewusst Migration, Bevölkerungswachstum oder geografische Kontrolle fördern. Ihre Funktion kann zu einer schrittweisen Integration mit ihrem Oberherrn führen." #deepl:2928952332
