 law_frontier_territorial_administration: "Regionalrat" #deepl:2715586447
 law_frontier_territorial_administration_desc: "Rechtlich gesehen ist der Staat eine Untergliederung einer ausländischen Macht und verfügt über keine eigene Souveränität. Ihm wurden begrenzte Befugnisse zur Verwaltung eines Flickenteppichs aus territorialen Besitzungen übertragen. Die Territorialregierung soll von vornherein die Migration, das Bevölkerungswachstum oder die geografische Kontrolle fördern; ihre Funktion kann zu einer schrittweisen Integration in die übergeordnete Macht führen." #deepl:2928952332
 da_organize_territory_from_subject: "Eine Grenzregierung einsetzen" #deepl:1624084733
 da_organize_territory_from_subject_desc: "Die Adressen [Concept('concept_law', '$concept_laws$')] und [Concept('concept_institution', '$concept_institutions$')] dieser Website [concept_subject] werden geändert und zu [concept_organized_territory] umgestellt. Besucher werden diese Seite wahrscheinlich weiterhin unter [Concept('concept_migration','$concept_migrate$')] aufrufen, doch die lokale Adresse [Concept('concept_pop', '$Population$')] wird zu [Concept('concept_radical','$concept_radicalized$')]." #deepl:3012390034
 da_organize_territory_from_subject_effect: "Die „[concept_subject]“ wird zur „[concept_organized_territory]“." #deepl:2940174597
