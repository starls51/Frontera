 concept_organized_territory_desc: "Un «[concept_subject]» [concept_country] que haya implementado [GetLawType('law_frontier_territorial_administration').GetName]. Cualquiera de sus «[Concept('concept_incorporated_state','$concept_incorporated_states$')]» puede llegar a convertirse en un «[Concept('concept_homeland','$concept_homeland$')]» para un «[Concept('concept_overlord','$concept_overlord_possessive$')]» [Concept('concept_primary_cultures','$concept_primary_culture$')]. Cada uno de sus «[Concept('concept_state','$concept_states$')]» debe cumplir ciertas condiciones para que aparezca el «[concept_homeland]». \n \n Un nuevo [concept_homeland] aparecerá en un [concept_state] si: \n $EFFECT_LIST_BULLET$ Tiene un [Concept('concept_pop', '$concept_population$')] tamaño superior a #bold  85 000 #! \n $EFFECT_LIST_BULLET$ Tiene un [Concept('concept_cultural_community','$concept_cultural_community$')] de [Concept('concept_overlord','$concept_overlord_possessive$')] [Concept('concept_primary_cultures','$concept_primary_culture$')] \n $EFFECT_LIST_BULLET$ Al menos #bold  60 % #! de [Concept('concept_pop', '$concept_pops$')] son [Concept('concept_discrimination','@acceptance_status_5! $full_acceptance$')] o [Concept('concept_discrimination','@acceptance_status_4! $second_rate_citizen$')] #indent_newline:3 \n #italic  Este requisito #tooltippable;tooltip: [GetPlayer.GetTooltipTag],frontera_ot_pop_scaling_rule_tt se reduce #! a medida que aumenta la población del estado #! #! \n \n #bold  Los territorios organizados #! se benefician de [GetLawType('law_homesteading').GetName], y un aumento directo [Concept('concept_overlord','$concept_overlord$')] de [Concept('concept_investment_level', '$concept_investment_levels$')] en el [GetInstitutionType('institution_colonial_affairs').GetName] [concept_institution]." #deepl:3004377925
 concept_organized_territory_desc_added: "[GetInstitutionType('institution_colonial_affairs').GetName]" #deepl:743845877
 frontera_ot_homeland_gained_homeland: "Dado que [SCOPE.sState('ascendent_state').GetName] es un [Concept('concept_homeland','$concept_homeland$')] de su [SCOPE.sCountry('overlord_scope').GetAdjectiveNoFormatting] [Concept('concept_primary_cultures','$concept_primary_culture$')] #! mayoritario, ahora puede ser anexionado por [SCOPE.sCountry('overlord_scope').GetName]. \n \n #italic  El [concept_state] aún debe pasar por el proceso de [Concept('concept_unincorporated_state','$concept_incorporation$')] para convertirse en un [concept_incorporated_state]. #!" #deepl:3409905544
 frontera_establish_ot_in_region_tt: "Se creará un [concept_organized_territory]. \n $EFFECT_LIST_BULLET$ Se cederán los siguientes [Concept('concept_unincorporated_state','$concept_unincorporated_states$')]:#indent_newline:2 #indent_newline:2 " #deepl:4160631454
 frontera_stateslist_tt: "[THIS.GetState.GetName]" #deepl:318863887
 frontera_ot_homeland_not_ready_for_statehood_tt: "Este [concept_state] no intentará unirse a [concept_overlord] [concept_country] durante al menos otros #bold  3 años #!." #deepl:3349629079
 frontera_ot_pop_scaling_rule_tt: "$EFFECT_LIST_BULLET$ [concept_state] [Concept('concept_pop', '$concept_population$')] tamaño #bold  85k #!—#bold  200k #!: al menos #bold  60% #! debe ser [Concept('concept_acceptance', '$concept_accepted$')] \n $EFFECT_LIST_BULLET$ [concept_state] [Concept('concept_pop', '$concept_population$')] tamaño #bold  200k #!—#bold  500k #!: al menos #bold  45% #! debe ser [Concept('concept_acceptance', '$concept_accepted$')] \n $EFFECT_LIST_BULLET$ [concept_state] [Concept('concept_pop', '$concept_population$')] tamaño #bold  500k #!—#bold  1m #!: al menos #bold  30% #! debe ser [Concept('concept_acceptance', '$concept_accepted$')] \n $EFFECT_LIST_BULLET$ [concept_state] [Concept('concept_pop', '$concept_population$')] tamaño #bold  1m #! y superior: al menos #bold  20% #! debe ser [Concept('concept_acceptance', '$concept_accepted$')]" #deepl:2529047697
 frontera_ot_creation_reset_tt: "El temporizador de espera para crear un nuevo [concept_organized_territory] se reiniciará \n \n #italic  Colocar un [GetDecreeType('decree_greener_grass_campaign').GetName] [concept_decree] en un [concept_unincorporated_state] adyacente a un [concept_incorporated_state] puede determinar qué [concept_state] se seleccionará como el nuevo [Concept('concept_organized_territory','$concept_organize_territory_possessive$')] [Concept('concept_capital_state','$concept_capital_state_short$')] la próxima vez que se active este evento. #!" #deepl:668338308
 creating_OT_frontera_tt: "#indent_newline:2 A un «[concept_organized_territory]» se le asignará un «[concept_capital_state]» siguiendo estas reglas: \n $EFFECT_LIST_BULLET$ ¿Es [Concept('concept_unincorporated_state','$concept_unincorporated_state$')] \n $EFFECT_LIST_BULLET$ ¿Es #bold  no #! [ROOT.GetCountry.GetAdjectiveNoFormatting] [Concept('concept_homeland','$concept_homeland$')] \n $EFFECT_LIST_BULLET$ ¿Es #bold  adyacente #! a [ROOT.GetCountry.GetAdjectiveNoFormatting] [Concept('concept_incorporated_state','$concept_incorporated_state$')]? \n $EFFECT_LIST_BULLET$ ¿Tiene [GetDecreeType('decree_greener_grass_campaign').GetName], o [concept_state] con la mayor parte sin reclamar [concept_arable_land]?" #deepl:1587096270
 creating_OT_frontera_2_tt: "#italic  Cualquier estado que cumpla las dos primeras reglas y comparta un [concept_strategic_region] con el nuevo [concept_capital_state] será transferido a [concept_organized_territory] #!." #deepl:2838758393
