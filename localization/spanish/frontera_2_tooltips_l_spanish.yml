 colonial_affairs_owner_is_discriminated_country_tt: "Cualquier dominio [concept_state] adyacente a [GetPlayer.GetAdjective] y [concept_homeland] pertenece a [concept_country], cuyos dominios [concept_primary_cultures] se encuentran todos bajo [Concept('concept_discrimination','@acceptance_status_4! $second_rate_citizen$')] en [GetPlayer.GetName]." #deepl:3595122018
