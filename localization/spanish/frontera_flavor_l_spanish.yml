 CAL_FLAVOR_TEXT: "Alta California declaró su lealtad al recién independizado México en 1821. Las autoridades mexicanas han intentado integrar el vasto territorio, pero las tensiones con los colonos y los líderes locales californianos están llegando a un punto crítico. Rodeada de ambiciosas potencias coloniales, ¿qué futuro le espera a California?" #deepl:578679357
