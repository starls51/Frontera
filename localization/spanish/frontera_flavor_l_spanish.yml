 CAL_FLAVOR_TEXT: "Alta California declaró su lealtad a un México recién independizado en 1821. Las autoridades mexicanas han intentado integrar ese vasto territorio, pero las tensiones con los colonos y los líderes californianos locales están llegando a un punto crítico. Rodeada de ambiciosas potencias coloniales, ¿qué le deparará el futuro a California?" #deepl:578679357
 frontera_settler_lore: "#lore  Los colonos, comerciantes, misioneros y soldados se adentran en el territorio en busca de tierras y oportunidades, a menudo más allá del fácil alcance del gobierno central. Para que estos territorios lejanos se integren, la administración debe seguir el ritmo de la expansión. Allí donde crecen los asentamientos, es posible que algún día se admitan nuevos estados en nuestro dominio. #!" #deepl:5769617
