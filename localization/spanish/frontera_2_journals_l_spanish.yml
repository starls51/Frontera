l_spanish:
 je_organized_territories_frontera: "Organizar el territorio" #deepl:2984011793
 je_organized_territories_frontera_reason: "Con el fin de ampliar la red, es posible que se creen filiales ([concept_organized_territory]) a partir de algunas de nuestras sucursales ([Concept('concept_unincorporated_state','$concept_unincorporated_states$')]). Estas se convertirán en filiales ([Concept('concept_incorporated_state','$concept_incorporated_states$')]) propiedad de la empresa matriz ([concept_organized_territory]). \n \n $frontera_settler_lore$" #deepl:334027685
 je_organize_territory_button: "Abrir nuevos horizontes" #deepl:3442212506
 je_organize_territory_button_desc: "Convierte el texto «[Concept('concept_unincorporated_state','$concept_unincorporated_states$')]» en «[concept_organized_territory]»." #deepl:2770156865
 je_sunset_route_frontera: "La Ruta del Atardecer" #deepl:1011417108
 je_sunset_route_frontera_reason: "Una conexión ferroviaria con California, en una zona de clima cálido, permitiría un flujo sin precedentes de mercancías y personas entre el este y el oeste. Sin embargo, este proyecto requiere una coordinación considerable. Además de resolver las continuas disputas sobre las «ranas» #italic  #! entre los propietarios, también es imprescindible armonizar los anchos de vía, las señales y los horarios. Esto podría resultar más difícil si hay países extranjeros que controlan tramos de vía a lo largo del trazado propuesto, pero la tarea no es en absoluto imposible." #deepl:2977714634
 je_sunset_route_frontera_button: "Conecta la Ruta del Atardecer" #deepl:317884082
 je_sunset_route_frontera_button_desc: "Actuar como mediador entre las distintas partes interesadas en la construcción de una nueva línea ferroviaria hacia California" #deepl:1348194334
 je_gadsden_purchase_frontera_button: "Pon a prueba los límites" #deepl:2467056109
 je_gadsden_purchase_frontera_button_desc: "La expansión ferroviaria hacia el oeste será más factible si se logra el control físico del corredor de terreno necesario. Aunque resulte políticamente arriesgado, provocar disputas fronterizas con los países vecinos podría abrir nuevas vías diplomáticas o militares para adquirir los terrenos necesarios para el proyecto." #deepl:110269188
 je_organized_territory_internal_frontera: "Poblar la frontera" #deepl:2132308742
 je_organized_territory_internal_frontera_reason: "[ROOT.GetCountry.GetNameNoFlag] es un [concept_organized_territory] perteneciente a [ROOT.GetCountry.GetTopOverlord.GetNameNoFlag]. Este [concept_subject_type] permite aumentar el [concept_migration] y, con el tiempo, crear un nuevo [Concept('concept_homeland','$concept_homelands$')] para el [concept_overlord] [concept_country]. Al obtener [concept_autonomy], [ROOT.GetCountry.GetNameNoFlag] se convertirá en un [concept_dominion] y permitirá realizar cambios en su [GetLawGroup('lawgroup_governance_principles').GetName]. \n \n $frontera_settler_lore$" #deepl:4286496753
 je_fort_ross_frontera: "Puerta de entrada al Pacífico" #deepl:2279191856
 je_fort_ross_frontera_reason: "[GetStateRegion('STATE_CALIFORNIA').GetName] sigue siendo una frontera escasamente poblada, que se tambalea bajo una frágil reivindicación española sobre el papel y está flanqueada por vecinos ambiciosos. Sin embargo, sus puertos, tierras y recursos rebosan de abundancia. \n \n El control sobre este [concept_state_region] podría desempeñar un papel importante a la hora de definir el equilibrio de poder en el [GetStrategicRegion('region_pacific_coast').GetName]." #deepl:51288871
 frontera_treaty_of_limits: "Redactar un proyecto de tratado revisado sobre límites" #deepl:2091412374
 frontera_treaty_of_limits_desc: "Nuestros vecinos no respetan las fronteras legales de la frontera estadounidense. Enviemos una misión diplomática y resolvamos este asunto de una vez por todas." #deepl:1253377358
 frontera_manifest_destiny: "Reforzar la franja de Nueces" #deepl:2389825869
 frontera_manifest_destiny_desc: "México aún no ha reconocido nuestra soberanía sobre Texas. Establezcamos una presencia militar más allá del río Nueces y no dejemos lugar a dudas sobre las ambiciones de Estados Unidos en el Oeste." #deepl:784934809
