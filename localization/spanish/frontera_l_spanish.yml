 je_sunset_route_frontera: "La ruta del atardecer" #deepl:1011417108
 je_sunset_route_frontera_reason: "Una conexión ferroviaria con California para la temporada cálida permitiría un flujo sin precedentes de comercio y personas entre el este y el oeste. Sin embargo, este proyecto requiere una coordinación significativa. Además de resolver las continuas disputas entre propietarios de terrenos #italic  frog wars #!, también es imprescindible estandarizar los anchos de vía, las señales y los horarios. Esto puede resultar más difícil si países extranjeros controlan zonas de la vía a lo largo de la ruta propuesta, pero la tarea no es en absoluto imposible." #deepl:1621464726
 je_sunset_route_frontera_button: "Conecta la ruta del atardecer" #deepl:317884082
 je_sunset_route_frontera_button_desc: "Mediar entre las distintas partes interesadas para crear una nueva ruta ferroviaria hacia California." #deepl:952386937
 je_gadsden_purchase_frontera_button: "Prueba los límites" #deepl:2467056109
 je_gadsden_purchase_frontera_button_desc: "La expansión ferroviaria hacia el oeste será más manejable si controlamos físicamente el corredor terrestre necesario. Aunque es políticamente arriesgado, provocar disputas fronterizas con nuestros vecinos podría abrir nuevas opciones diplomáticas o militares para adquirir terrenos para nuestro proyecto." #deepl:1391362877
