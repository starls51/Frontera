 je_organized_territories_frontera: "Establecer un territorio organizado" #deepl:1625332565
 je_organized_territories_frontera_reason: "Con el fin de expandir nuestra nación, se puede establecer un territorio organizado #bold  #! a partir de algunos de nuestros [Concept('concept_unincorporated_state','$concept_unincorporated_states$')]. Estos se convertirán en [Concept('concept_incorporated_state','$concept_incorporated_states$')] propiedad del territorio organizado #bold  #!. \n \n Mientras que un territorio organizado #bold  #! tiene [GetLawType('law_homesteading').GetName] promulgado, sus dos [Concept('concept_incorporated_state','$concept_states$')] con el mayor [Concept('concept_gdp','$concept_gdp_short$')] recibirán una bonificación anual a [Concept('concept_migration','$concept_migration$')]. Cualquier [Concept('concept_incorporated_state','$concept_incorporated_state$')] perteneciente a un territorio organizado #bold  #! puede eventualmente convertirse en un [Concept('concept_homeland','$concept_homeland$')] a un [Concept('concept_overlord','$concept_overlord_possessive$')] [Concept('concept_primary_cultures','$concept_primary_culture$')]. \n #indent_newline:2 \n Un [concept_state] se convertirá en un [Concept('concept_homeland','$concept_homeland$')] si: \n $EFFECT_LIST_BULLET$ Tiene un [Concept('concept_cultural_community','$concept_cultural_community$')] de [Concept('concept_overlord','$concept_overlord_possessive$')] [Concept('concept_primary_cultures','$concept_primary_culture$')] \n $EFFECT_LIST_BULLET$ El 60 % de la [Concept('concept_pop', '$concept_population$')] tiene un [concept_acceptance] de 65 o más \n $EFFECT_LIST_BULLET$ El [concept_state] [Concept('concept_pop', '$concept_population$')] es superior a 85 000 \n \n #lore  Los colonos, comerciantes, misioneros y soldados se adentran en busca de tierras y oportunidades, a menudo más allá del alcance del gobierno central. Para que estos territorios lejanos se integren, la administración debe seguir la expansión. Donde crecen los asentamientos, algún día pueden admitirse nuevos estados en nuestro dominio. #!" #deepl:544344828
 je_organize_territory_button: "Establecer territorio" #deepl:4044636356
 je_organize_territory_button_desc: "Organiza algunos de nuestros «[Concept('concept_unincorporated_state','$concept_unincorporated_states$')]» (Estrategias de marketing de contenidos) en un «#bold » (Estrategia de marketing de contenidos) «Organized Territory» (Territorio organizado) «#!» (Estrategia de marketing de contenidos)." #deepl:1558054720
 da_organize_territory_from_subject: "Establecer un gobierno fronterizo" #deepl:1624084733
 da_organize_territory_from_subject_desc: "El [Concept('concept_law', '$concept_laws$')] y el [Concept('concept_institution', '$concept_institutions$')] de este [concept_subject] cambiarán para convertirse en un #bold  Territorio organizado #!. Los colonos serán más propensos a [Concept('concept_migration','$concept_migrate$')] aquí, pero el [Concept('concept_pop', '$Population$')] local se volverá más [Concept('concept_radical','$concept_radicalized$')]." #deepl:2949097403
