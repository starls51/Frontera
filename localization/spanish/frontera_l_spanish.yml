 creating_OT_frontera_tt: "#indent_newline:2 Un territorio organizado de forma e#bold  #! recibirá un [concept_capital_state] siguiendo estas reglas: \n $EFFECT_LIST_BULLET$ Es [Concept('concept_unincorporated_state','$concept_unincorporated_state$')] \n $EFFECT_LIST_BULLET$ Es #bold  no #! [ROOT.GetCountry.GetAdjectiveNoFormatting] [Concept('concept_homeland','$concept_homeland$')] \n $EFFECT_LIST_BULLET$ Es #bold  adyacente #! a [ROOT.GetCountry.GetAdjectiveNoFormatting] [Concept('concept_incorporated_state','$concept_incorporated_state$')]. \n $EFFECT_LIST_BULLET$ Tiene [GetDecreeType('decree_greener_grass_campaign').GetName] , o [concept_state] con el más alto [Concept('concept_gdp','$concept_gdp_short$')]" #deepl:2335454090
