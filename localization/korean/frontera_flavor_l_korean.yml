l_korean:
 CAL_FLAVOR_TEXT: "알타 캘리포니아는 1821년 막 독립을 쟁취한 멕시코에 충성을 맹세했다. 멕시코 당국은 이 광활한 영토를 통합하려 노력해 왔으나, 식민지 주민들과 현지 캘리포니오 지도자들과의 갈등은 이제 한계에 다다르고 있다. 야심 찬 식민 열강들에 둘러싸인 캘리포니아의 미래는 과연 어떻게 될 것인가?" #deepl:578679357
 frontera_settler_lore: "#lore  정착민, 상인, 선교사, 군인들은 땅과 기회를 찾아 중앙 정부의 손길이 닿기 어려운 곳까지 진출해 나갑니다. 이러한 외딴 영토들을 통합하려면, 확장에 따라 행정 체계도 따라가야 합니다. 정착지가 성장하는 곳이라면, 언젠가 새로운 주들이 우리 영토에 편입될 수도 있습니다. #!" #deepl:5769617
