 ideology_frontera_mexican_centralist_desc: "중앙집권주의자들은 강력한 단일 국가 정부를 원하며, 이는 대개 지역 자치권을 희생시키면서 이루어진다. 그들은 식민지 시대의 중앙집권적 구조를 모방함으로써 혼란스러운 초기 공화국에 질서를 강요하려 한다." #deepl:2906061988
