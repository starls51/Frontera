 ideology_frontera_mexican_federalist_desc: "연방주의자들은 분권화된 정부를 옹호하며, 각 주에 상당한 자치권을 부여해야 한다고 주장한다. 미국의 모델에서 영감을 얻은 연방주의자들은 지역의 자유를 보호하고 수도에서 독재자가 등장하는 것을 막는 것을 목표로 한다." #deepl:3704296238
