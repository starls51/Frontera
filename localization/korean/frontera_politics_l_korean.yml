 ideology_frontera_mexican_centralist: "멕시코 중앙주의자" #deepl:1986234739
 ideology_frontera_mexican_centralist_desc: "중앙집권주의자들은 대개 지역 자치를 희생시키면서라도 강력하고 단일한 중앙 정부를 원한다. 그들은 식민지 시대의 중앙집권적 구조를 모방함으로써 혼란스러운 초기 공화국에 질서를 확립하고자 한다." #deepl:2906061988
