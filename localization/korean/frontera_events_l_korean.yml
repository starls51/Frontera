 frontera_treaty_of_limits.1.d: "자칭 해체된 아담스-오니스 조약(#bold )의 법적 상속자라고 주장하는 #!, [SCOPE.sCountry('buyer_scope').GetAdjectiveNoFormatting] 관계자들은 [SCOPE.sCountry('seller_scope').GetCapital.GetCityHubName] 측에 조약에 명시된 기존의 경계선을 인정하고 이행할 것을 압박해 왔다." #deepl:2830373953
 frontera_treaty_of_limits.1.f: "1821년 미국과 멕시코는 리미트 조약(#italic ) #!을 체결했다. 이 조약은 2년 전 스페인과 체결된 애덤스-오니스 조약(#italic ) #!의 조항들을 갱신한 것이었다. 플로리다에 대한 지배권을 미국에 이양한 것 외에도, 애덤스-오니스 조약(#italic ) #!은 서부 지역에서 스페인과의 법적 국경을 확정지었다." #deepl:4100799599
 frontera_treaty_of_limits.1.a: "조약을 비준하십시오." #deepl:468172514
 frontera_treaty_of_limits.1.b: "정말 터무니없는 생각이야..." #deepl:1417336212
