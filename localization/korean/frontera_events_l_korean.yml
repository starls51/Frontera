 frontera_treaty_of_limits.3.d: "[SCOPE.sCountry('buyer_scope').GetAdjectiveNoFormatting] 관계자들은 [SCOPE.sCountry('seller_scope').GetCapital.GetCityHubName]에서의 외교 사명을 마치고 돌아왔으며, [SCOPE.sCountry('seller_scope').GetAdjectiveNoFormatting] 측과의 원만한 협상에 큰 만족감을 표했다. 협상은 [SCOPE.sCountry('buyer_scope').GetNameNoFormatting]에 유리한 방향으로 진행되고 있다." #deepl:1366457633
 frontera_treaty_of_limits.3.b: "그것은 약함의 표시입니다." #deepl:2947401295
