 frontera_fort_ross.1: "손실을 최소화하기" #deepl:1680067657
 frontera_fort_ross.1.t: "손실을 최소화하기" #deepl:1680067657
 frontera_fort_ross.1.d: "포트 로스는 원래 알래스카의 식민지 주민들에게 식량을 공급하기 위해 설립되었습니다. 이 미합중국([SCOPE.sCountry('seller_scope').GetAdjectiveNoFormatting])의 초창기 전초 기지는 이후 그 중요성을 잃었습니다. 미합중국 정부 관계자들은 최근 이 논란의 여지가 있는 영유권 주장에 주목하기 시작했습니다. 해당 시설들을 매각한다면 명예를 지키며 물러날 기회를 얻을 수 있을 뿐만 아니라, 이 지역의 긴장도 완화할 수 있을 것입니다." #deepl:3386575780
 frontera_fort_ross.1.f: "\n“보시다시피, 이곳은 제가 ‘뉴 헬베티아(New Helvetia)’ #!를 세우기에 이상적인 장소입니다. 네, 정말 훌륭한 땅이군요… 그리고 여러분께 대가를 지불해 드릴 겁니다! 아 #italic  물론 #! 넉넉하게 보상해 드릴 겁니다,”라고 매입을 서두르는 [SCOPE.sCharacter('john_sutter_scope').GetLastNameNoFormatting]가 말합니다. “때가 되면요. 오, 그래요, 때가 되면 말이죠…”" #deepl:1029766778
 frontera_fort_ross.1.a: "절대 안 돼! ‘[SCOPE.sState('california_scope').GetNameNoFormatting]’는 당연히 우리 것이야." #deepl:207577355
 frontera_fort_ross.1.b: "좋은 계획이네요." #deepl:3518633261
 frontera_fort_ross.1.c: "[SCOPE.sState('california_scope').GetNameNoFormatting] 항상 [SCOPE.sCountry('seller_scope').GetAdjectiveNoFormatting]..." #deepl:1496946436
 frontera_fort_ross.2: "손실을 최소화하기" #deepl:1680067657
