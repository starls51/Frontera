 frontera_sunset_route_event.4.d: "외국 군대의 원정대는 메실라 계곡 근처에 설정된 국경을 반복적으로 침범해 왔다." #deepl:2990890124
 frontera_sunset_route_event.4.f: ""[SCOPE.sCountry('buyer_scope').GetAdjectiveNoFlag]의 정찰대가 우리 국경을 마치 이미 자기들 것인 양 넘나든다," [SCOPE.sCountry('angry_country_scope').GetAdjectiveNoFlag] 장관이 분노에 차 말했다. [SCOPE.sCountry('angry_country_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('angry_country_scope').GetRuler.GetFullName]는 침착한 표정으로 시가를 물고 있었고, 희미한 불빛이 잠시 그의 거친 얼굴을 비추었다가 어둠 속으로 사라졌다. \n \n"내가 팔기를 거부하면, 그들은 그냥 가져갈 거야—그리고 운명이라 주장할 테지."\n \n"그럼 네가 동의하면?"\n \n"우린 강제로 잃어야 하는 것에 대해... 대가를 받게 될 거야."" #deepl:87387247
