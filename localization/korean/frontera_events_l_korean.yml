 frontera_ot_homeland.1.d: "[SCOPE.sState('ascendent_state').GetNameNoFormatting]의 정착민 인구는 상당히 증가했다. 원주민들과의 미해결 갈등이 남아 있음에도 불구하고, 이곳은 앞으로 수 세대에 걸쳐 [SCOPE.sCountry('overlord_scope').GetAdjectiveNoFormatting]의 [Concept('concept_homeland','$concept_homeland$')]가 될 것으로 보인다." #deepl:4242322575
 frontera_ot_homeland.1.f: ""나는 바람이 자유롭게 불고, 태양빛을 가릴 것이 아무것도 없던 대초원에서 태어났습니다." — 제로니모" #deepl:2391563847
