 frontera_sunset_route_event.1.t: "일몰 루트" #deepl:1011417108
 frontera_sunset_route_event.1.d: "[SCOPE.sState('california_scope').GetName] 대륙 동부 지역까지 철도로 성공적으로 연결되었습니다. 소노란 사막을 가로지르는 이 온난 기후 노선은 연중 무휴로 운행할 수 있습니다." #deepl:3309601727
 frontera_sunset_route_event.2.d: "[SCOPE.sCountry('builder_scope').GetNameNoFlag] 애리조나주([SCOPE.sState('california_scope').GetName])를 대륙 동부 지역과 철도로 연결하기 위한 노력을 주도해 왔다. 소노란 사막을 가로지르는 이 온난 기후 노선은 연중 무휴로 운행이 가능하다." #deepl:2730146222
 frontera_sunset_route_event.1.f: ""이것이 너희들을 위한 법이다, 햇빛처럼 맑게," 주지사가 선언했다. 그의 목소리는 등 뒤의 철제 거인처럼 단단했다. 사막을 가로지르는 바람이 휘몰아쳤고, 버질 어프의 손이 권총 위에 머물렀다. 무고한 마을 사람들이 지켜보러 오지 않았다면 총격전이 벌어졌을지도 모른다. 어프의 마지못한 한숨이 증기 소리와 함께 햇볕에 달궈진 공기로 스멀스멀 퍼져나갔다. 기관차는 굴러갔고, 선셋 루트가 개통되었다." #deepl:295026560
 frontera_sunset_route_event.1.a: "진보를 위한 승리!" #deepl:2958605196
