 frontera_treaty_of_limits.2.t: "오래된 말, 조약은 없다: [SCOPE.sCountry('seller_scope').GetCapital.GetCityHubName]" #deepl:1106196979
 frontera_treaty_of_limits.2.d: "[SCOPE.sCountry('buyer_scope').GetAdjectiveNoFormatting] 관계자들이 [SCOPE.sCountry('seller_scope').GetCapital.GetCityHubName]에서의 외교 사절단 활동을 마치고 돌아왔다. 안타깝게도, [SCOPE.sCountry('seller_scope').GetAdjectiveNoFormatting] 측 관계자들은 1990년 10월 1일자 리미트 조약(#italic )을 부활시키자는 “터무니없는” 제안을 거부했다. #!." #deepl:4221233034
 frontera_treaty_of_limits.2.f: "그곳은 저명한 손님을 대접하기에 가장 좋은 장소 중 하나였으며, [SCOPE.sCountry('seller_scope').GetCapital.GetCityHubName]에서 손꼽히는 최고급 레스토랑이기도 했다. “차라리 달에 ‘[SCOPE.sCountry('buyer_scope').GetAdjectiveNoFormatting]’ 깃발을 꽂아달라고 요청하는 게 낫겠네요!” [SCOPE.sCountry('seller_scope').GetAdjectiveNoFormatting]의 사교계 인사들은 폭소를 터뜨렸다. \n \n 근처 테이블에서는 두 명의 [SCOPE.sCountry('buyer_scope').GetAdjectiveNoFormatting] 외교관이 서로 걱정스러운 눈빛을 주고받았다." #deepl:1334437244
 frontera_treaty_of_limits.2.a: "공식적인 항의문을 발표하십시오." #deepl:3722538865
 frontera_treaty_of_limits.2.b: "그 생각은 접어두세요." #deepl:3521850535
