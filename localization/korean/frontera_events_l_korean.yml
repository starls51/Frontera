 frontera_sunset_route_event.5.d: "[SCOPE.sCountry('buyer_scope').GetAdjectiveNoFormatting] 요원들은 메실라 계곡 일대를 탐사하는 임무에 [SCOPE.sCountry('seller_scope').GetAdjectiveNoFormatting]의 외교관들을 동행시켰다. 이들은 양국 간 국제 철도망을 구축하기를 희망하는 것으로 보인다." #deepl:3671600249
 frontera_sunset_route_event.5.f: "이 계획에 동의하든 그렇지 않든, 이러한 설문조사는 인프라 개선을 계획하고 더 발전된 교통 수단에 대한 지식을 공유할 수 있는 훌륭한 기회입니다." #deepl:3061632216
 frontera_sunset_route_event.5.a: "이웃 간의 정을 보여주는 행동." #deepl:3189443051
