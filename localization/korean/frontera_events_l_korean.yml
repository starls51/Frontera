 frontera_fort_ross.2.d: "[SCOPE.sCountry('seller_scope').GetNameNoFormatting] [SCOPE.sState('california_scope').GetNameNoFormatting]의 지분을 매각할 계획이다." #deepl:1434516165
 frontera_fort_ross.2.f: "[SCOPE.sCountry('buyer_scope').GetAdjectiveNoFormatting]의 지역 관계자들은 [SCOPE.sCountry('seller_scope').GetNameNoFormatting]가 해당 정착지를 포기하기를 바라고 있다. 시설물을 매각한다면 명예를 지키며 물러날 기회를 얻을 수 있을 뿐만 아니라, 이 지역의 긴장도 완화될 것이다." #deepl:2936373317
 frontera_fort_ross.2.a: "아니요, [SCOPE.sState('california_scope').GetNameNoFormatting]은 중요한 거점입니다." #deepl:4183963343
 frontera_fort_ross.2.b: "좋아, 이건 위대한 ‘[SCOPE.sCountry('overlord_scope').GetNameNoFormatting]’에게는 상관없는 일이다." #deepl:1288417892
 frontera_fort_ross.3: "참으로 뻔뻔하군!" #deepl:61601467
 frontera_fort_ross.3.t: "참으로 뻔뻔하군!" #deepl:61601467
 frontera_fort_ross.3.d: "[SCOPE.sCountry('seller_scope').GetNameNoFormatting] [SCOPE.sState('california_scope').GetNameNoFormatting]에서 점점 더 당당해지고 있다." #deepl:2360485480
 frontera_fort_ross.3.f: "그들의 주장이 법적으로 불확실함에도 불구하고, ‘[SCOPE.sCountry('seller_scope').GetAdjectiveNoFormatting]’ 식민지 주민들은 ‘[SCOPE.sCountry('buyer_scope').GetNameNoFormatting]’와 ‘[SCOPE.sCountry('seller_scope').GetNameNoFormatting]’ 사이에서 점차 격화되고 있는 영토 분쟁에 기름을 부어왔다." #deepl:2021577011
 frontera_fort_ross.3.a: "[SCOPE.sCountry('buyer_scope').GetAdjectiveNoFormatting] 사람들은 이 위협에 맞서 단결해야 합니다" #deepl:177952069
 frontera_fort_ross.4: "[SCOPE.sCharacter('john_sutter_scope').GetLastNameNoFormatting] 요새" #deepl:4241808508
 frontera_fort_ross.4.t: "[SCOPE.sCharacter('john_sutter_scope').GetLastNameNoFormatting] 요새" #deepl:4241808508
 frontera_fort_ross.4.d: "[SCOPE.sCharacter('john_sutter_scope').GetHomeCountry.GetAdjectiveNoFormatting] -미국 이민자이자 개척자, 그리고 다언어 구사자인 조지 워싱턴 윌리엄스([SCOPE.sCharacter('john_sutter_scope').GetFullNameNoFormatting])가 《[SCOPE.sState('california_scope').GetNameNoFormatting]》에 등장했다." #deepl:1729197350
 frontera_fort_ross.4.f: "[SCOPE.sCharacter('john_sutter_scope').GetFullNameNoFormatting] 는 [SCOPE.sState('california_scope').GetNameNoFormatting]에 있는 오래된 요새의 잔해를 매입했다. 철거된 건물에서 나온 자재는 [SCOPE.sCharacter('john_sutter_scope').GetHerHis] 뉴 헬베티아(#bold )의 새로운 정착지 #! 건설에 사용될 것입니다. 우리의 축복 아래, 이 식민지는 난폭한 원주민들에 대한 완충지대 역할을 할 수 있을 것입니다. [SCOPE.sCharacter('john_sutter_scope').GetLastNameNoFormatting]는 #bold  뉴 헬베티아 #!가 개척지의 문명 등대가 될 것이라고 주장합니다. 그러나 [SCOPE.sCharacter('john_sutter_scope').GetHerHis]의 고용 하에 있는 원주민들과 인근 마을 주민들에 대한 학대 보고가 우려를 자아내고 있습니다. \n \n #italic "구세계는 죽어가고, 신세계는 태어나기 위해 고군분투하고 있다: 지금은 괴물들의 시대다.\" — 안토니오 그람시 #!" #deepl:4023662245
 frontera_fort_ross.4.a: "이 미친놈을 ‘[SCOPE.sCharacter('john_sutter_scope').GetSheHe]’가 나온 곳으로 돌려보내라." #deepl:508690232
 frontera_fort_ross.4.b: "좋아요, ‘[SCOPE.sCharacter('john_sutter_scope').GetSheHe]’가 우리가 황야를 정복하는 데 도움을 줄 거예요!" #deepl:3603057105
 frontera_sunset_route_event.1: "선셋 루트" #deepl:1011417108
 frontera_sunset_route_event.1.t: "선셋 루트" #deepl:1011417108
 frontera_sunset_route_event.1.d: "[SCOPE.sState('california_scope').GetNameNoFormatting] 이 노선은 철도를 통해 대륙의 동부 지역과 성공적으로 연결되었습니다. 소노라 사막을 가로지르는 이 노선은 기후가 온화하여 일 년 내내 직통 운행이 가능합니다." #deepl:1375503153
 frontera_sunset_route_event.2.d: "[SCOPE.sCountry('builder_scope').GetNameNoFormatting] 캘리포니아-네바다 철도([SCOPE.sState('california_scope').GetNameNoFormatting])를 대륙 동부 지역과 철도로 연결하기 위한 노력을 주도해 왔다. 소노라 사막을 가로지르는 이 노선은 기후가 온화하여 일 년 내내 운행이 가능하다." #deepl:3852099163
 frontera_sunset_route_event.1.f: "“자, 여러분, 법은 이렇습니다. 한낮의 태양처럼 명백하죠.” 주지사가 선언했다. 그의 목소리는 등 뒤에 서 있는 철의 거인처럼 단단했다. 사막을 가로질러 바람이 휘몰아쳤고, 버질 어프는 권총 위에 손을 얹은 채 움직이지 않았다. 구경하러 나온 무고한 마을 주민들이 없었다면, 아마도 총격전이 벌어졌을지도 모른다. 어프가 내뱉은 마지못한 한숨은 증기의 쉭 하는 소리와 함께 햇볕에 달궈진 공기로 스며들었다. 기관차는 달렸고, 선셋 루트가 개통되었다." #deepl:295026560
 frontera_sunset_route_event.1.a: "진보를 향한 승리!" #deepl:2958605196
 frontera_sunset_route_event.2.a: "잘됐네..." #deepl:2754019974
 frontera_sunset_route_event.3: "메실라 계곡의 분쟁" #deepl:510184323
 frontera_sunset_route_event.3.t: "메실라 계곡의 분쟁" #deepl:510184323
 frontera_sunset_route_event.3.d: "메실라 계곡의 소유권을 둘러싼 논란이 멕시코([SCOPE.sCountry('buyer_scope').GetNameNoFormatting])와 미국([SCOPE.sCountry('angry_country_scope').GetNameNoFormatting]) 간의 외교적 분쟁으로 번졌다." #deepl:1879231144
 frontera_sunset_route_event.3.f: ""[SCOPE.sCountry('buyer_scope').GetAdjectiveNoFormatting]의 정찰병들은 마치 우리 국경이 이미 그들의 것인 양 마음대로 넘나들고 있습니다,"라고 [SCOPE.sCountry('angry_country_scope').GetAdjectiveNoFormatting]의 장관이 분노에 차서 말했다. [SCOPE.sCountry('angry_country_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('angry_country_scope').GetRuler.GetFullNameNoFormatting]는 [SCOPE.sCountry('angry_country_scope').GetRuler.GetHerHis] 시가를 묵묵히 피우며 깊은 사색에 잠겨 있었고, 희미한 불빛이 [SCOPE.sCountry('angry_country_scope').GetRuler.GetHerHis]의 풍파에 닳은 얼굴을 잠시 비추었다가 어둠 속으로 사라졌다. \n \n"내가 팔기를 거부하면, 그들은 무력으로 빼앗아 갈 것입니다."\n \n"그리고 당신이 동의한다면요?"\n \n"우리는... 강제로 잃게 되는 것에 대해 대가를 받습니다."" #deepl:3985735214
