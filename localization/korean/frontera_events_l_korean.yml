 frontera_sunset_route_event.3.d: "메실라 계곡의 소유권에 대한 논란이 미국과 멕시코([SCOPE.sCountry('buyer_scope').GetName]) 간 외교 분쟁으로 격화되었다." #deepl:1502838723
 frontera_sunset_route_event.3.f: ""[SCOPE.sCountry('buyer_scope').GetAdjectiveNoFlag]의 정찰대가 우리 국경을 마치 이미 자기들 것인 양 넘나든다," [SCOPE.sCountry('angry_country_scope').GetAdjectiveNoFlag] 장관이 분노에 차 말했다. [SCOPE.sCountry('angry_country_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('angry_country_scope').GetRuler.GetFullName]는 침착한 표정으로 시가를 물고 있었고, 희미한 불빛이 잠시 그의 거친 얼굴을 비추었다가 어둠 속으로 사라졌다. \n \n"내가 팔기를 거부하면, 그들은 그냥 가져갈 거야—그리고 운명이라 주장할 테지."\n \n"그럼 네가 동의하면?"\n \n"우린 강제로 잃어야 하는 것에 대해... 대가를 받게 될 거야."" #deepl:87387247
