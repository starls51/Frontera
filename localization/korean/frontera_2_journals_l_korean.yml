l_korean:
 je_organized_territories_frontera: "영토 정리하기" #deepl:2984011793
 je_organized_territories_frontera_reason: "국가 확장을 위해, 기존 지역 지부([Concept('concept_unincorporated_state','$concept_unincorporated_states$')]) 중 일부를 통합하여 전국 지부([concept_organized_territory])를 설립할 수 있습니다. 이 지부들은 전국 지부([Concept('concept_incorporated_state','$concept_incorporated_states$')])가 되며, 전국 지부 연합([concept_organized_territory])의 산하 조직이 됩니다. \n \n $frontera_settler_lore$" #deepl:334027685
 je_organize_territory_button: "새로운 영역 개척" #deepl:3442212506
 je_organize_territory_button_desc: "[Concept('concept_unincorporated_state','$concept_unincorporated_states$')]를 [concept_organized_territory]로 정리하세요." #deepl:2770156865
 je_sunset_route_frontera: "선셋 루트" #deepl:1011417108
 je_sunset_route_frontera_reason: "캘리포니아로 이어지는 온난 기후 지역의 철도 노선이 개통된다면, 동부와 서부 간에 전례 없는 규모의 물자와 인력의 이동이 가능해질 것입니다. 하지만 이 프로젝트는 상당한 수준의 조율이 필요합니다. 토지 소유자들 사이에서 진행 중인 ‘개구리 전쟁’ #! 문제를 해결하는 것 외에도, 선로 폭, 신호 체계, 운행 스케줄을 표준화하는 것이 필수적입니다. 제안된 노선 구간의 일부를 외국이 관리하고 있다면 이 작업이 더 어려워질 수 있겠지만, 결코 불가능한 일은 아닙니다." #deepl:2977714634
 je_sunset_route_frontera_button: "선셋 루트 연결하기" #deepl:317884082
 je_sunset_route_frontera_button_desc: "다양한 이해관계자 간의 중재를 통해 캘리포니아로 향하는 새로운 철도 노선을 구축한다" #deepl:1348194334
 je_gadsden_purchase_frontera_button: "국경 시험" #deepl:2467056109
 je_gadsden_purchase_frontera_button_desc: "필요한 토지 통로에 대한 물리적 통제권을 확보하면 서부 지역으로의 철도 확장이 훨씬 수월해질 것이다. 비록 정치적으로 위험하긴 하지만, 인접국과의 국경 분쟁을 유발하는 것이 이 프로젝트를 위한 토지 확보를 위한 추가적인 외교적 또는 군사적 선택지를 열어줄 수도 있다." #deepl:110269188
 je_organized_territory_internal_frontera: "개척지에 정착하다" #deepl:2132308742
 je_organized_territory_internal_frontera_reason: "[ROOT.GetCountry.GetNameNoFlag] 이는 [ROOT.GetCountry.GetTopOverlord.GetNameNoFlag]에 속하는 [concept_organized_territory]입니다. 이 [concept_subject_type]는 [concept_migration]를 강화하고, 궁극적으로 [concept_overlord] [concept_country]를 위한 새로운 [Concept('concept_homeland','$concept_homelands$')]를 생성할 수 있게 해줍니다. [concept_autonomy]를 획득하면 [ROOT.GetCountry.GetNameNoFlag]가 [concept_dominion]로 변환되며, [GetLawGroup('lawgroup_governance_principles').GetName]를 변경할 수 있게 됩니다. \n \n $frontera_settler_lore$" #deepl:4286496753
 je_fort_ross_frontera: "태평양으로 가는 관문" #deepl:2279191856
 je_fort_ross_frontera_reason: "[GetStateRegion('STATE_CALIFORNIA').GetName] 여전히 인구가 드문 변방으로, 허약한 스페인의 명목상 지배권 아래 위태롭게 버티고 있으며, 야심 찬 이웃 국가들에 둘러싸여 있다. 그럼에도 이곳의 항구와 땅, 자원은 풍요로움으로 넘쳐난다. \n \n 이 지역([concept_state_region])에 대한 지배권은 대서양([GetStrategicRegion('region_pacific_coast').GetName])의 권력 균형을 결정하는 데 중요한 역할을 할 수 있다." #deepl:51288871
 frontera_treaty_of_limits: "개정된 경계 조약 초안 작성" #deepl:2091412374
 frontera_treaty_of_limits_desc: "미국 국경 지역의 법적 경계가 이웃 국가들에 의해 존중받지 못하고 있습니다. 외교 사절단을 파견하여 이 문제를 단번에 해결하십시오." #deepl:1253377358
 frontera_manifest_destiny: "누에세스 스트립 강화" #deepl:2389825869
 frontera_manifest_destiny_desc: "멕시코는 아직 텍사스에 대한 우리의 주권을 인정하지 않고 있다. 누에세스 강 너머에 군사력을 배치하여, 서부 지역에 대한 미국의 야망을 누구도 의심할 여지 없이 분명히 보여줘야 한다." #deepl:784934809
