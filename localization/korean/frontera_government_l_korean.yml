 da_organize_territory_from_subject_desc: "이 [concept_subject]의 [Concept('concept_law', '$concept_laws$')]와 [Concept('concept_institution', '$concept_institutions$')]는 [concept_organized_territory]로 변경될 예정입니다. 정착민들은 이곳에 [Concept('concept_migration','$concept_migrate$')]할 가능성이 더 높아지겠지만, 이 지역의 [Concept('concept_pop', '$Population$')]는 [Concept('concept_radical','$concept_radicalized$')]해질 것입니다." #deepl:3012390034
