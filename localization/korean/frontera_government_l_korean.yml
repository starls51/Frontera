 law_frontier_territorial_administration_desc: "법적으로 볼 때, 이 주(州)는 외국 세력의 하위 행정 구역에 불과하며 독자적인 주권을 보유하지 않는다. 이 주에는 제각각 흩어져 있는 영토를 관리할 수 있는 제한된 권한이 부여되었다. 이 지역 정부의 설립 취지는 이주 촉진, 인구 증가, 또는 지리적 통제를 도모하는 데 있으며, 이러한 기능은 결국 상급 통치권자와의 점진적인 통합으로 이어질 수 있다." #deepl:2928952332
