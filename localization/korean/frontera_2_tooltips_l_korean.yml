 sunset_route_complete_effect_tt: "[GetGeographicRegion('geographic_region_sunset_route_frontera').GetName]의 모든 [concept_state]: \n [GetStaticModifier('sunset_route_frontera').GetDesc] \n #italic  임시 상태 수정자 #!" #deepl:1935387611
 colonial_affairs_owner_is_discriminated_country_tt: "[GetPlayer.GetAdjective]([concept_homeland])와 인접한 모든 [concept_state]는 [concept_country]에 속하며, 이 의 모든 [concept_primary_cultures]는 [GetPlayer.GetName] 내의 [Concept('concept_discrimination','@acceptance_status_4! $second_rate_citizen$')] 아래에 위치합니다." #deepl:3595122018
 mesilla_treaty_creation_tt: "[concept_treaty]의 제안을 추가하여, 애리조나주 또는 뉴멕시코주에 소유하고 있는 토지를 [SCOPE.sCountry('buyer_scope').GetName]에 매주 #bold £3500에 매각하세요. #! ([concept_state] 참조)" #deepl:2192895926
