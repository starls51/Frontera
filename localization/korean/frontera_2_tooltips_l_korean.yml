l_korean:
 concept_organized_territory: "조직된 영토" #deepl:2352668119
 concept_organized_territories: "행정 구역" #deepl:2238868231
 concept_organize_territory: "영토 정리하기" #deepl:2984011793
 concept_organize_territory_possessive: "조직된 영토의" #deepl:3867352861
 concept_organized_territory_desc: "[GetLawType('law_frontier_territorial_administration').GetName]를 구현한 [concept_subject] [concept_country]. 이 객체의 [Concept('concept_incorporated_state','$concept_incorporated_states$')] 중 어느 것이든 결국 [Concept('concept_overlord','$concept_overlord_possessive$')] [Concept('concept_primary_cultures','$concept_primary_culture$')]에 대한 [Concept('concept_homeland','$concept_homeland$')]가 될 수 있습니다. [concept_homeland]가 나타나기 위해서는 각 [Concept('concept_state','$concept_states$')]가 특정 조건을 충족해야 합니다. \n \n 다음과 같은 경우 [concept_state]에 새로운 [concept_homeland]가 나타납니다: \n $EFFECT_LIST_BULLET$ [Concept('concept_pop', '$concept_population$')] 크기가 #bold  85,000 #! \n $EFFECT_LIST_BULLET$ 이상일 경우 [Concept('concept_cultural_community','$concept_cultural_community$')]가 [Concept('concept_overlord','$concept_overlord_possessive$')] [Concept('concept_primary_cultures','$concept_primary_culture$')] \n $EFFECT_LIST_BULLET$ 이상일 경우 [Concept('concept_pop', '$concept_pops$')]의 #bold  60% #! 이상이 [Concept('concept_discrimination','@acceptance_status_5! $full_acceptance$')] 또는 [Concept('concept_discrimination','@acceptance_status_4! $second_rate_citizen$')]일 경우 #indent_newline:3 \n #italic  이 요건 #tooltippable;tooltip: [GetPlayer.GetTooltipTag],frontera_ot_pop_scaling_rule_tt은 주 인구가 증가함에 따라 #! 완화됩니다 #! #! \n \n #bold  조직된 영토(Organized Territories) #!는 [GetLawType('law_homesteading').GetName]의 혜택을 받으며, [GetInstitutionType('institution_colonial_affairs').GetName] [concept_institution]에서 [Concept('concept_investment_level', '$concept_investment_levels$')]을 직접 [Concept('concept_overlord','$concept_overlord$')] 모금할 수 있습니다." #deepl:3004377925
 concept_organized_territory_desc_added: "[GetInstitutionType('institution_colonial_affairs').GetName]" #deepl:743845877
 frontera_ot_homeland_gained_homeland: "[SCOPE.sState('ascendent_state').GetName]는 [SCOPE.sCountry('overlord_scope').GetAdjectiveNoFormatting] [Concept('concept_primary_cultures','$concept_primary_culture$')] #!의 [Concept('concept_homeland','$concept_homeland$')]이므로, 이제 [SCOPE.sCountry('overlord_scope').GetName]에 편입될 수 있습니다. \n \n #italic  [concept_state]는 [concept_incorporated_state]가 되기 위해 여전히 [Concept('concept_unincorporated_state','$concept_incorporation$')] 절차를 거쳐야 합니다. #!" #deepl:3409905544
 frontera_establish_ot_in_region_tt: "[concept_organized_territory]가 생성됩니다. \n $EFFECT_LIST_BULLET$ 다음 [Concept('concept_unincorporated_state','$concept_unincorporated_states$')]가 양도됩니다:#indent_newline:2 #indent_newline:2 " #deepl:4160631454
 frontera_stateslist_tt: "[THIS.GetState.GetName]" #deepl:318863887
 frontera_ot_homeland_not_ready_for_statehood_tt: "이 [concept_state]는 앞으로 최소 #bold  3년 동안 [concept_country] [concept_overlord]에 가입하지 않을 것입니다. #!." #deepl:3349629079
 frontera_ot_pop_scaling_rule_tt: "$EFFECT_LIST_BULLET$ [concept_state] [Concept('concept_pop', '$concept_population$')] 규모 #bold  85k #!—#bold  200k #!: 최소 #bold  60% #!는 반드시 [Concept('concept_acceptance', '$concept_accepted$')] \n $EFFECT_LIST_BULLET$ [concept_state] [Concept('concept_pop', '$concept_population$')] 규모 #bold  200k #!—#bold  500k #!: 최소 #bold  45% #!는 반드시 [Concept('concept_acceptance', '$concept_accepted$')] \n $EFFECT_LIST_BULLET$ [concept_state] [Concept('concept_pop', '$concept_population$')] 규모 #bold  500k #!—#bold  1m #!: 최소 #bold  30% #!는 반드시 [Concept('concept_acceptance', '$concept_accepted$')] \n $EFFECT_LIST_BULLET$ [concept_state] [Concept('concept_pop', '$concept_population$')] 규모 #bold  1m #! 이상: 최소 #bold  20% #!는 반드시 [Concept('concept_acceptance', '$concept_accepted$')]" #deepl:2529047697
 frontera_ot_creation_reset_tt: "새로운 [concept_organized_territory]를 생성할 때의 재사용 대기시간은 다음 링크에서 재설정됩니다. \n \n #italic  [concept_incorporated_state]와 인접한 [concept_unincorporated_state]에 [GetDecreeType('decree_greener_grass_campaign').GetName] [concept_decree]를 배치하면, 이 이벤트가 다음에 발동될 때 어떤 [concept_state]가 새로운 [Concept('concept_organized_territory','$concept_organize_territory_possessive$')] [Concept('concept_capital_state','$concept_capital_state_short$')]로 선택될지 결정할 수 있습니다. #!" #deepl:668338308
 creating_OT_frontera_tt: "#indent_newline:2 `[concept_organized_territory]`에는 다음 규칙에 따라 `[concept_capital_state]`가 할당됩니다: \n $EFFECT_LIST_BULLET$ `[Concept('concept_unincorporated_state','$concept_unincorporated_state$')]`는 \n $EFFECT_LIST_BULLET$ `#bold `는 #! [ROOT.GetCountry.GetAdjectiveNoFormatting] [Concept('concept_homeland','$concept_homeland$')] \n $EFFECT_LIST_BULLET$ `#bold `는 #! `[ROOT.GetCountry.GetAdjectiveNoFormatting]` [Concept('concept_incorporated_state','$concept_incorporated_state$')]와 인접해 있습니다. \n $EFFECT_LIST_BULLET$ `[GetDecreeType('decree_greener_grass_campaign').GetName]` 또는 [concept_state] 중 미지정된 `[concept_arable_land]`가 가장 많은 것을 갖습니다." #deepl:1587096270
 creating_OT_frontera_2_tt: "#italic  처음 두 가지 규칙을 따르며 새로운 [concept_capital_state]와 [concept_strategic_region]를 공유하는 모든 주는 [concept_organized_territory] #!에 양도됩니다." #deepl:2838758393
