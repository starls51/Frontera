 je_sunset_route_frontera_reason: "캘리포니아까지 이어지는 온난 기후 철도 연결은 동부와 서부 간 전례 없는 상업 및 인적 교류의 흐름을 가능케 할 것이다. 그러나 이 프로젝트는 상당한 조정이 필요하다. 지속적인 캘리포니아 철도 분쟁(#italic ) #! 을 해결하는 것 외에도, 궤간, 신호 체계, 운행 스케줄을 표준화하는 것이 필수적이다. 제안된 노선 상의 선로 구간을 외국이 통제하는 경우 이는 더 어려울 수 있으나, 결코 불가능한 과제는 아니다." #deepl:1621464726
