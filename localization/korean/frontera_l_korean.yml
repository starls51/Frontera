 je_organized_territories_frontera_reason: "국가 확장을 위해 일부 [Concept('concept_unincorporated_state','$concept_unincorporated_states$')]에서 #bold  조직 영토 #!를 설립할 수 있습니다. 이는 #bold  조직 영토 #!가 소유하는 [Concept('concept_incorporated_state','$concept_incorporated_states$')]가 됩니다. \n \n #bold  조직 영토 #!에 [GetLawType('law_homesteading').GetName]가 제정되면, 가장 높은 [Concept('concept_gdp','$concept_gdp_short$')]를 보유한 두 [Concept('concept_incorporated_state','$concept_states$')]에게 [Concept('concept_migration','$concept_migration$')]에 대한 연간 보너스가 지급됩니다. #bold  조직 영토 #!에 속한 [Concept('concept_incorporated_state','$concept_incorporated_state$')]는 결국 [Concept('concept_overlord','$concept_overlord_possessive$')] [Concept('concept_primary_cultures','$concept_primary_culture$')]의 [Concept('concept_homeland','$concept_homeland$')]가 될 수 있습니다. \n #indent_newline:2 \n [concept_state]는 다음 조건을 충족할 경우 [Concept('concept_homeland','$concept_homeland$')]가 됩니다: \n $EFFECT_LIST_BULLET$ [Concept('concept_cultural_community','$concept_cultural_community$')]가 [Concept('concept_overlord','$concept_overlord_possessive$')] [Concept('concept_primary_cultures','$concept_primary_culture$')] \n $EFFECT_LIST_BULLET$ [Concept('concept_pop', '$concept_population$')]의 60%가 [concept_acceptance] 65 이상인 경우 \n $EFFECT_LIST_BULLET$ [concept_state][Concept('concept_pop', '$concept_population$')]가 85,000 이상인 경우 \n \n #lore  정착민, 상인, 선교사, 군인들은 땅과 기회를 찾아 중앙 정부의 손이 미치지 않는 먼 곳까지 진출합니다. 이러한 외딴 영토들이 통합되려면 행정도 확장에 따라야 합니다. 정착지가 성장하는 곳에는 언젠가 새로운 주가 우리 영토에 편입될 수 있습니다. #!" #deepl:544344828
