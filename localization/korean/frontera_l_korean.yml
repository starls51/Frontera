 je_sunset_route_frontera_button_desc: "다양한 이해관계자들 사이에서 중재하여 캘리포니아로 가는 새로운 철도 노선을 구축한다." #deepl:952386937
 je_gadsden_purchase_frontera_button: "경계를 시험하다" #deepl:2467056109
 je_gadsden_purchase_frontera_button_desc: "서부 철도 확장은 필요한 토지 통로를 물리적으로 장악할 경우 보다 수월하게 진행될 수 있다. 비록 정치적 위험이 따르지만, 이웃 국가들과의 국경 분쟁을 유발함으로써 우리 프로젝트를 위한 토지를 확보하기 위한 추가적인 외교적 또는 군사적 옵션을 모색할 수 있을 것이다." #deepl:1391362877
