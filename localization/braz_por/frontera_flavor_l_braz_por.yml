 CAL_FLAVOR_TEXT: "A Alta Califórnia declarou sua lealdade ao México, recém-independente, em 1821. As autoridades mexicanas tentaram integrar esse vasto território, mas as tensões com os colonos e os líderes californianos locais estão chegando ao ponto de ebulição. Cercada por potências coloniais ambiciosas, o que o futuro reserva para a Califórnia?" #deepl:578679357
 frontera_settler_lore: "#lore  Colonos, comerciantes, missionários e soldados avançam em busca de terras e oportunidades, muitas vezes para além do alcance imediato do governo central. Para que esses territórios distantes se integrem, a administração deve acompanhar a expansão. Onde os assentamentos crescem, novos estados poderão um dia ser admitidos em nosso domínio. #!" #deepl:5769617
