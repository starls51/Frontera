 concept_organized_territory_desc: "Um [concept_subject] [concept_country] que tenha implementado [GetLawType('law_frontier_territorial_administration').GetName]. Qualquer um de seus [Concept('concept_incorporated_state','$concept_incorporated_states$')] pode eventualmente se tornar um [Concept('concept_homeland','$concept_homeland$')] para um [Concept('concept_overlord','$concept_overlord_possessive$')] [Concept('concept_primary_cultures','$concept_primary_culture$')]. Cada um de seus [Concept('concept_state','$concept_states$')] deve atender a certas condições para que o [concept_homeland] apareça. \n \n Um novo [concept_homeland] aparecerá em um [concept_state] se: \n $EFFECT_LIST_BULLET$ Tiver um [Concept('concept_pop', '$concept_population$')] tamanho acima de #bold  85.000 #! \n $EFFECT_LIST_BULLET$ Tiver um [Concept('concept_cultural_community','$concept_cultural_community$')] de [Concept('concept_overlord','$concept_overlord_possessive$')] [Concept('concept_primary_cultures','$concept_primary_culture$')] \n $EFFECT_LIST_BULLET$ Pelo menos #bold  60% #! de [Concept('concept_pop', '$concept_pops$')] forem [Concept('concept_discrimination','@acceptance_status_5! $full_acceptance$')] ou [Concept('concept_discrimination','@acceptance_status_4! $second_rate_citizen$')] #indent_newline:3 \n #italic  Este requisito #tooltippable;tooltip: [GetPlayer.GetTooltipTag],frontera_ot_pop_scaling_rule_tt diminui #! à medida que a população do estado aumenta #! #! \n \n #bold  Territórios Organizados #! se beneficiam de [GetLawType('law_homesteading').GetName], e um [Concept('concept_overlord','$concept_overlord$')] direto aumenta [Concept('concept_investment_level', '$concept_investment_levels$')] no [GetInstitutionType('institution_colonial_affairs').GetName] [concept_institution]." #deepl:3004377925
 concept_organized_territory_desc_added: "[GetInstitutionType('institution_colonial_affairs').GetName]" #deepl:743845877
 frontera_ot_homeland_gained_homeland: "Como [SCOPE.sState('ascendent_state').GetName] é um [Concept('concept_homeland','$concept_homeland$')] em relação ao seu [SCOPE.sCountry('overlord_scope').GetAdjectiveNoFormatting] [Concept('concept_primary_cultures','$concept_primary_culture$')] #!, ele pode agora ser anexado por [SCOPE.sCountry('overlord_scope').GetName]. \n \n #italic  O [concept_state] ainda precisa passar pelo processo de [Concept('concept_unincorporated_state','$concept_incorporation$')] para se tornar um [concept_incorporated_state]. #!" #deepl:3409905544
 frontera_establish_ot_in_region_tt: "Será criado um [concept_organized_territory]. \n $EFFECT_LIST_BULLET$ Serão cedidos os seguintes [Concept('concept_unincorporated_state','$concept_unincorporated_states$')]:#indent_newline:2 #indent_newline:2 " #deepl:4160631454
 frontera_stateslist_tt: "[THIS.GetState.GetName]" #deepl:318863887
 frontera_ot_homeland_not_ready_for_statehood_tt: "Este [concept_state] não tentará acessar o [concept_overlord] [concept_country] por pelo menos mais #bold  3 anos #!." #deepl:3349629079
 frontera_ot_pop_scaling_rule_tt: "$EFFECT_LIST_BULLET$ [concept_state] [Concept('concept_pop', '$concept_population$')] tamanho #bold  85 mil #!—#bold  200 mil #!: pelo menos #bold  60% #! deve ser [Concept('concept_acceptance', '$concept_accepted$')] \n $EFFECT_LIST_BULLET$ [concept_state] [Concept('concept_pop', '$concept_population$')] tamanho #bold  200 mil #!—#bold  500 mil #!: pelo menos #bold  45% #! deve ser [Concept('concept_acceptance', '$concept_accepted$')] \n $EFFECT_LIST_BULLET$ [concept_state] [Concept('concept_pop', '$concept_population$')] tamanho #bold  500 mil #!—#bold  1 milhão #!: pelo menos #bold  30% #! deve ser [Concept('concept_acceptance', '$concept_accepted$')] \n $EFFECT_LIST_BULLET$ [concept_state] [Concept('concept_pop', '$concept_population$')] tamanho #bold  1 milhão #! e acima: pelo menos #bold  20% #! deve ser [Concept('concept_acceptance', '$concept_accepted$')]" #deepl:2529047697
 frontera_ot_creation_reset_tt: "O temporizador de recarga para a criação de um novo [concept_organized_territory] será reiniciado \n \n #italic  Colocar um [GetDecreeType('decree_greener_grass_campaign').GetName] [concept_decree] em um [concept_unincorporated_state] adjacente a um [concept_incorporated_state] pode determinar qual [concept_state] será selecionado como o novo [Concept('concept_organized_territory','$concept_organize_territory_possessive$')] [Concept('concept_capital_state','$concept_capital_state_short$')], para quando esse evento for acionado novamente. #!" #deepl:668338308
 creating_OT_frontera_tt: "#indent_newline:2 A expressão «[concept_organized_territory]» receberá uma «[concept_capital_state]» de acordo com estas regras: \n $EFFECT_LIST_BULLET$ É [Concept('concept_unincorporated_state','$concept_unincorporated_state$')] \n $EFFECT_LIST_BULLET$ É #bold  não #! [ROOT.GetCountry.GetAdjectiveNoFormatting] [Concept('concept_homeland','$concept_homeland$')] \n $EFFECT_LIST_BULLET$ É #bold  adjacente #! a [ROOT.GetCountry.GetAdjectiveNoFormatting] [Concept('concept_incorporated_state','$concept_incorporated_state$')]. \n $EFFECT_LIST_BULLET$ Tem [GetDecreeType('decree_greener_grass_campaign').GetName], ou [concept_state] com a maior parte não reivindicada [concept_arable_land]" #deepl:1587096270
 creating_OT_frontera_2_tt: "#italic  Quaisquer estados que sigam as duas primeiras regras e compartilhem um [concept_strategic_region] com o novo [concept_capital_state] serão transferidos para o [concept_organized_territory] #!." #deepl:2838758393
