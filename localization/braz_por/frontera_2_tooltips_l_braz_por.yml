 colonial_affairs_owner_is_discriminated_country_tt: "Qualquer [concept_state] adjacente a [GetPlayer.GetAdjective] [concept_homeland] pertence a um [concept_country] cujos [concept_primary_cultures] estão todos abaixo de [Concept('concept_discrimination','@acceptance_status_4! $second_rate_citizen$')] em [GetPlayer.GetName]." #deepl:3595122018
