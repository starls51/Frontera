 je_organized_territories_frontera: "Estabelecer um território organizado" #deepl:1625332565
 je_organized_territories_frontera_reason: "Com o objetivo de expandir nossa nação, um Território Organizado #bold  #! pode ser estabelecido a partir de alguns de nossos [Concept('concept_unincorporated_state','$concept_unincorporated_states$')]. Estes se tornarão [Concept('concept_incorporated_state','$concept_incorporated_states$')] de propriedade do Território Organizado #bold  #!. \n \n Enquanto um Território Organizado #bold  #! tiver [GetLawType('law_homesteading').GetName] promulgado, seus dois [Concept('concept_incorporated_state','$concept_states$')] com o maior [Concept('concept_gdp','$concept_gdp_short$')] receberão um bônus anual para [Concept('concept_migration','$concept_migration$')]. Qualquer [Concept('concept_incorporated_state','$concept_incorporated_state$')] pertencente a um Território Organizado #bold  #! pode eventualmente se tornar um [Concept('concept_homeland','$concept_homeland$')] para um [Concept('concept_overlord','$concept_overlord_possessive$')] [Concept('concept_primary_cultures','$concept_primary_culture$')]. \n \n Um [concept_state] se tornará um [Concept('concept_homeland','$concept_homeland$')] se: \n $EFFECT_LIST_BULLET$ Tiver um [Concept('concept_cultural_community','$concept_cultural_community$')] de [Concept('concept_overlord','$concept_overlord_possessive$')] [Concept('concept_primary_cultures','$concept_primary_culture$')] \n $EFFECT_LIST_BULLET$ 60% do [Concept('concept_pop', '$concept_population$')] tiver um [concept_acceptance] de 65 ou mais \n $EFFECT_LIST_BULLET$ O [concept_state] [Concept('concept_pop', '$concept_population$')] for superior a 85.000 \n \n #lore  Colonos, comerciantes, missionários e soldados avançam em busca de terras e oportunidades, muitas vezes além do alcance fácil do governo central. Para que esses territórios distantes se integrem, a administração deve acompanhar a expansão. Onde os assentamentos crescem, novos estados podem um dia ser admitidos em nosso domínio. #!" #deepl:544344828
