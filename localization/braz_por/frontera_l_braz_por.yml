 je_sunset_route_frontera: "A Rota do Pôr do Sol" #deepl:1011417108
 je_sunset_route_frontera_reason: "Uma conexão ferroviária para a Califórnia em climas quentes permitiria um fluxo sem precedentes de comércio e pessoas entre o leste e o oeste. No entanto, esse projeto requer uma coordenação significativa. Além de resolver as contínuas disputas entre proprietários de terras #italic  frog wars #!, também é imperativo padronizar bitolas, sinais e horários. Isso pode ser mais difícil se países estrangeiros controlarem áreas da ferrovia ao longo da rota proposta, mas a tarefa não é de forma alguma impossível." #deepl:1621464726
 je_sunset_route_frontera_button: "Conecte a Rota do Pôr do Sol" #deepl:317884082
 je_sunset_route_frontera_button_desc: "Mediar entre as várias partes interessadas para criar uma nova rota ferroviária para a Califórnia." #deepl:952386937
 je_gadsden_purchase_frontera_button: "Teste as Fronteiras" #deepl:2467056109
 je_gadsden_purchase_frontera_button_desc: "A expansão ferroviária para o oeste será mais fácil de gerir se controlarmos fisicamente o corredor terrestre necessário. Embora seja politicamente arriscado, provocar disputas fronteiriças com os nossos vizinhos poderá permitir mais opções diplomáticas ou militares para adquirir terrenos para o nosso projeto." #deepl:1391362877
