 da_organize_territory_from_subject_desc: "Os [Concept('concept_law', '$concept_laws$')] e [Concept('concept_institution', '$concept_institutions$')] deste [concept_subject] serão alterados para se tornarem um #bold  Território Organizado #!. Os colonos estarão mais propensos a [Concept('concept_migration','$concept_migrate$')] aqui, mas o [Concept('concept_pop', '$Population$')] local se tornará mais [Concept('concept_radical','$concept_radicalized$')]." #deepl:2949097403
