 creating_OT_frontera_tt: "#indent_newline:2 Um território organizado por #bold  #! receberá um [concept_capital_state] seguindo estas regras: \n $EFFECT_LIST_BULLET$ É [Concept('concept_unincorporated_state','$concept_unincorporated_state$')] \n $EFFECT_LIST_BULLET$ É #bold  não #! [ROOT.GetCountry.GetAdjectiveNoFormatting] [Concept('concept_homeland','$concept_homeland$')] \n $EFFECT_LIST_BULLET$ É #bold  adjacente #! a [ROOT.GetCountry.GetAdjectiveNoFormatting] [Concept('concept_incorporated_state','$concept_incorporated_state$')]. \n $EFFECT_LIST_BULLET$ Tem [GetDecreeType('decree_greener_grass_campaign').GetName] , ou [concept_state] com o maior [Concept('concept_gdp','$concept_gdp_short$')]" #deepl:2335454090
 creating_OT_frontera_2_tt: "#italic  Quaisquer estados que sigam as duas primeiras regras e compartilhem um [concept_strategic_region] com o novo [concept_capital_state] serão cedidos ao #bold  Território Organizado #! #!." #deepl:1399382270
