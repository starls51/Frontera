l_braz_por:
 je_organized_territories_frontera: "Organizar território" #deepl:2984011793
 je_organized_territories_frontera_reason: "Com o objetivo de expandir a rede, poderá ser criada uma filial ([concept_organized_territory]) a partir de algumas de nossas filiais ([Concept('concept_unincorporated_state','$concept_unincorporated_states$')]). Estas passarão a ser filiais ([Concept('concept_incorporated_state','$concept_incorporated_states$')]) pertencentes à rede ([concept_organized_territory]). \n \n $frontera_settler_lore$" #deepl:334027685
 je_organize_territory_button: "Conquistar novos territórios" #deepl:3442212506
 je_organize_territory_button_desc: "Transforme um [Concept('concept_unincorporated_state','$concept_unincorporated_states$')] em um [concept_organized_territory]." #deepl:2770156865
 je_sunset_route_frontera: "A Rota do Pôr do Sol" #deepl:1011417108
 je_sunset_route_frontera_reason: "Uma conexão ferroviária para a Califórnia, em climas mais quentes, permitiria um fluxo sem precedentes de comércio e pessoas entre o Leste e o Oeste. No entanto, esse projeto exige uma coordenação significativa. Além de resolver as contínuas disputas sobre o tipo de sapata ferroviária #italic  #! entre os proprietários, também é imperativo padronizar bitolas, sinais e horários. Isso pode ser mais difícil se países estrangeiros controlarem trechos da linha ao longo do trajeto proposto, mas a tarefa não é, de forma alguma, impossível." #deepl:2977714634
 je_sunset_route_frontera_button: "Conecte a Rota do Pôr do Sol" #deepl:317884082
 je_sunset_route_frontera_button_desc: "Atuar como mediador entre as diversas partes interessadas na construção de uma nova rota ferroviária para a Califórnia" #deepl:1348194334
 je_gadsden_purchase_frontera_button: "Teste as Fronteiras" #deepl:2467056109
 je_gadsden_purchase_frontera_button_desc: "A expansão ferroviária para o oeste será mais viável com o controle físico do corredor de terras necessário. Embora seja politicamente arriscado, provocar disputas de fronteira com os vizinhos pode abrir caminho para outras opções diplomáticas ou militares de aquisição de terras para o projeto." #deepl:110269188
 je_organized_territory_internal_frontera: "Povoar a Fronteira" #deepl:2132308742
 je_organized_territory_internal_frontera_reason: "[ROOT.GetCountry.GetNameNoFlag] é um [concept_organized_territory] pertencente a [ROOT.GetCountry.GetTopOverlord.GetNameNoFlag]. Este [concept_subject_type] permite aumentar o [concept_migration] e a eventual criação de novos [Concept('concept_homeland','$concept_homelands$')] para o [concept_overlord] [concept_country]. A obtenção de [concept_autonomy] transformará o [ROOT.GetCountry.GetNameNoFlag] em um [concept_dominion] e permitirá alterações em seu [GetLawGroup('lawgroup_governance_principles').GetName]. \n \n $frontera_settler_lore$" #deepl:4286496753
 je_fort_ross_frontera: "Porta de entrada para o Pacífico" #deepl:2279191856
 je_fort_ross_frontera_reason: "[GetStateRegion('STATE_CALIFORNIA').GetName] continua sendo uma fronteira pouco povoada, cambaleando sob uma frágil reivindicação espanhola no papel e cercada por vizinhos ambiciosos. No entanto, seus portos, terras e recursos transbordam de abundância. \n \n O controle sobre esta [concept_state_region] poderia desempenhar um papel importante na definição do equilíbrio de poder na [GetStrategicRegion('region_pacific_coast').GetName]." #deepl:51288871
 frontera_treaty_of_limits: "Elaborar um projeto de tratado revisado sobre limites" #deepl:2091412374
 frontera_treaty_of_limits_desc: "As fronteiras legais na fronteira americana não estão sendo respeitadas pelos nossos vizinhos. Enviem uma missão diplomática e resolvam essa questão de uma vez por todas." #deepl:1253377358
 frontera_manifest_destiny: "Reforçar a Nueces Strip" #deepl:2389825869
 frontera_manifest_destiny_desc: "O México ainda não reconheceu nossa soberania sobre o Texas. Estabeleçam uma presença militar além do rio Nueces e não deixem dúvidas quanto às ambições dos Estados Unidos no Oeste." #deepl:784934809
