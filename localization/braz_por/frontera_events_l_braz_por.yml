 debug_req_pop_ct: "O ESTADO tem NÚMERO de HABITANTES" #deepl:2150280673
 debug_req_primary_perc: "O ESTADO possui uma CULTURA PRINCIPAL de PERCENTAGEM do OVERLORD" #deepl:695788310
 frontera_ot_homeland.1: "Condição de Estado" #deepl:290487462
 frontera_ot_homeland.1.t: "Lar, doce lar" #deepl:759433816
 frontera_ot_homeland.1.d: "A população de colonos em [SCOPE.sState('ascendent_state').GetNameNoFormatting] cresceu consideravelmente. Apesar de quaisquer conflitos não resolvidos com os nativos, parece que este lugar será um [Concept('concept_homeland','$concept_homeland$')] para muitas [SCOPE.sCountry('overlord_scope').GetAdjectiveNoFormatting] gerações futuras." #deepl:4242322575
 frontera_ot_homeland.1.f: "“Nasci nas pradarias, onde o vento soprava livremente e nada obstruía a luz do sol.” — Gerônimo" #deepl:2391563847
 frontera_ot_homeland.1.a: "[SCOPE.sState('ascendent_state').GetNameNoFormatting] pode em breve se tornar um estado." #deepl:3155158794
 frontera_ot_homeland.1.b: "Meu trabalho aqui está concluído." #deepl:1429745245
 frontera_ot_homeland.1.c: "[SCOPE.sState('ascendent_state').GetNameNoFormatting] continuará sendo uma participação territorial, por enquanto." #deepl:1129899227
 frontera_fort_ross.1: "Minimizar as perdas" #deepl:1680067657
 frontera_fort_ross.1.t: "Minimizar as perdas" #deepl:1680067657
 frontera_fort_ross.1.d: "Fort Ross foi fundado inicialmente para abastecer os colonos do Alasca. Esse posto avançado da Companhia de Comércio do Pacífico ([SCOPE.sCountry('seller_scope').GetAdjectiveNoFormatting]), ainda em fase inicial, perdeu desde então sua importância. Autoridades da Agência de Gestão de Terras ([SCOPE.sCountry('buyer_scope').GetAdjectiveNoFormatting]) tomaram conhecimento recentemente dessa reivindicação territorial questionável. A venda das instalações representaria uma oportunidade de se retirar com a honra intacta e amenizar quaisquer tensões na região." #deepl:3386575780
 frontera_fort_ross.1.f: "\n“Como você pode ver, este seria o local ideal para fundar minha #bold  Nova Helvétia #!. Sim, esta é uma terra maravilhosa... pela qual você seria remunerado! Ah #italic  É claro #! que você receberá uma generosa remuneração”, diz [SCOPE.sCharacter('john_sutter_scope').GetLastNameNoFormatting], ansioso para concretizar a compra. “No momento certo. Ah, sim, no momento certo...”" #deepl:1029766778
 frontera_fort_ross.1.a: "De jeito nenhum! [SCOPE.sState('california_scope').GetNameNoFormatting] é nosso por direito." #deepl:207577355
 frontera_fort_ross.1.b: "Esse é um bom plano." #deepl:3518633261
 frontera_fort_ross.1.c: "[SCOPE.sState('california_scope').GetNameNoFormatting] sempre foi [SCOPE.sCountry('seller_scope').GetAdjectiveNoFormatting]..." #deepl:1496946436
 frontera_fort_ross.2: "Minimizar as perdas" #deepl:1680067657
 frontera_fort_ross.2.t: "Minimizar as perdas" #deepl:3839667639
 frontera_fort_ross.2.d: "[SCOPE.sCountry('seller_scope').GetNameNoFormatting] pretende alienar sua participação na[SCOPE.sState('california_scope').GetNameNoFormatting]" #deepl:1434516165
 frontera_fort_ross.2.f: "As autoridades locais de [SCOPE.sCountry('buyer_scope').GetAdjectiveNoFormatting] ficariam muito satisfeitas se [SCOPE.sCountry('seller_scope').GetNameNoFormatting] abandonasse o assentamento. A venda das instalações proporcionaria uma oportunidade de se retirar com a honra intacta e amenizaria quaisquer tensões na região." #deepl:2936373317
 frontera_fort_ross.2.a: "Não, o site [SCOPE.sState('california_scope').GetNameNoFormatting] é um ponto de apoio valioso." #deepl:4183963343
 frontera_fort_ross.2.b: "Tudo bem, isso não é problema para o poderoso [SCOPE.sCountry('overlord_scope').GetNameNoFormatting]." #deepl:1288417892
 frontera_fort_ross.3: "Que ousadia!" #deepl:61601467
 frontera_fort_ross.3.t: "Que ousadia!" #deepl:61601467
 frontera_fort_ross.3.d: "[SCOPE.sCountry('seller_scope').GetNameNoFormatting] está se tornando mais assertivo em [SCOPE.sState('california_scope').GetNameNoFormatting]." #deepl:2360485480
 frontera_fort_ross.3.f: "Apesar da instabilidade jurídica de sua reivindicação, grupos de colonos de [SCOPE.sCountry('seller_scope').GetAdjectiveNoFormatting] têm alimentado as chamas de uma crescente disputa territorial entre [SCOPE.sCountry('buyer_scope').GetNameNoFormatting] e [SCOPE.sCountry('seller_scope').GetNameNoFormatting]." #deepl:2021577011
 frontera_fort_ross.3.a: "[SCOPE.sCountry('buyer_scope').GetAdjectiveNoFormatting] as pessoas devem se unir contra essa ameaça" #deepl:177952069
 frontera_fort_ross.4: "O Forte de[SCOPE.sCharacter('john_sutter_scope').GetLastNameNoFormatting]" #deepl:4241808508
 frontera_fort_ross.4.t: "O Forte de[SCOPE.sCharacter('john_sutter_scope').GetLastNameNoFormatting]" #deepl:4241808508
 frontera_fort_ross.4.d: "[SCOPE.sCharacter('john_sutter_scope').GetHomeCountry.GetAdjectiveNoFormatting] -[SCOPE.sCharacter('john_sutter_scope').GetFullNameNoFormatting], imigrante americano, pioneiro e poliglota, chegou a [SCOPE.sState('california_scope').GetNameNoFormatting]." #deepl:1729197350
 frontera_fort_ross.4.f: "[SCOPE.sCharacter('john_sutter_scope').GetFullNameNoFormatting] adquiriu as ruínas de um antigo forte em [SCOPE.sState('california_scope').GetNameNoFormatting]. Os materiais dos edifícios demolidos serão usados para construir [SCOPE.sCharacter('john_sutter_scope').GetHerHis] um novo assentamento de #bold  New Helvetia #!. Com nossa bênção, a colônia poderá servir como um amortecedor contra os nativos indisciplinados. [SCOPE.sCharacter('john_sutter_scope').GetLastNameNoFormatting] afirma que #bold  New Helvetia #! será um farol de civilização para a fronteira. No entanto, há relatos preocupantes de abuso contra nativos sob [SCOPE.sCharacter('john_sutter_scope').GetHerHis] emprego e nas aldeias vizinhas. \n \n #italic "O velho mundo está morrendo, e o novo mundo luta para nascer: agora é a hora dos monstros." — Antonio Gramsci #!" #deepl:4023662245
 frontera_fort_ross.4.a: "Mandem esse maluco de volta para onde quer que tenha vindo o "[SCOPE.sCharacter('john_sutter_scope').GetSheHe]"." #deepl:508690232
 frontera_fort_ross.4.b: "Tudo bem, o livro “[SCOPE.sCharacter('john_sutter_scope').GetSheHe]” vai nos ajudar a domar a natureza selvagem!" #deepl:3603057105
 frontera_sunset_route_event.1: "A Rota do Pôr do Sol" #deepl:1011417108
 frontera_sunset_route_event.1.t: "A Rota do Pôr do Sol" #deepl:1011417108
 frontera_sunset_route_event.1.d: "[SCOPE.sState('california_scope').GetNameNoFormatting] foi conectada com sucesso à parte oriental do continente por meio de uma linha ferroviária. Atravessando o deserto de Sonora, essa rota com clima ameno pode operar sem interrupções durante todo o ano." #deepl:1375503153
 frontera_sunset_route_event.2.d: "[SCOPE.sCountry('builder_scope').GetNameNoFormatting] tem liderado uma iniciativa para conectar a região de[SCOPE.sState('california_scope').GetNameNoFormatting], à parte oriental do continente por meio de uma linha ferroviária. Atravessando o deserto de Sonora, essa rota com clima ameno pode operar sem interrupções durante todo o ano." #deepl:3852099163
 frontera_sunset_route_event.1.f: "“Aí está a lei para vocês, rapazes, clara como o dia”, declarou o governador, com a voz firme como o gigante de ferro às suas costas. O vento soprava forte pelo deserto, e a mão de Virgil Earp pairava sobre o revólver. Talvez tivesse havido um tiroteio, se não fosse por todos os inocentes moradores da cidade que haviam vindo assistir. O suspiro relutante de Earp flutuou no calor escaldante do sol como um assobio de vapor. A locomotiva seguiu em frente, e a Rota do Pôr do Sol foi inaugurada." #deepl:295026560
 frontera_sunset_route_event.1.a: "Uma vitória para o progresso!" #deepl:2958605196
 frontera_sunset_route_event.2.a: "Que bom para eles..." #deepl:2754019974
 frontera_sunset_route_event.3: "Conflito no Vale de Mesilla" #deepl:510184323
 frontera_sunset_route_event.3.t: "Conflito no Vale de Mesilla" #deepl:510184323
 frontera_sunset_route_event.3.d: "As controvérsias sobre a propriedade do Vale de Mesilla evoluíram para uma disputa diplomática entre [SCOPE.sCountry('buyer_scope').GetNameNoFormatting] e [SCOPE.sCountry('angry_country_scope').GetNameNoFormatting]." #deepl:1879231144
 frontera_sunset_route_event.3.f: ""Os batedores da [SCOPE.sCountry('buyer_scope').GetAdjectiveNoFormatting] atravessam nossa fronteira como se ela já fosse deles", resmungou o ministro da [SCOPE.sCountry('angry_country_scope').GetAdjectiveNoFormatting]. [SCOPE.sCountry('angry_country_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('angry_country_scope').GetRuler.GetFullNameNoFormatting] tragou um charuto da [SCOPE.sCountry('angry_country_scope').GetRuler.GetHerHis] com uma tranquilidade pensativa; o brilho fraco delineou brevemente [SCOPE.sCountry('angry_country_scope').GetRuler.GetHerHis] traços marcados pelo tempo antes de desaparecer na escuridão. \n \n"Se eu me recusar a vender, eles vão tomá-la à força."\n \n"E se você concordar?"\n \n"Somos pagos... pelo que somos forçados a perder."" #deepl:3985735214
 frontera_sunset_route_event.3.a: "Envie mais expedições armadas" #deepl:3471564856
 frontera_sunset_route_event.3.b: "Tente uma abordagem mais pacífica" #deepl:990404971
 frontera_sunset_route_event.4: "Invasões no Vale de Mesilla" #deepl:3780924556
 frontera_sunset_route_event.4.t: "Invasões no Vale de Mesilla" #deepl:3780924556
 frontera_sunset_route_event.4.d: "Expedições militares estrangeiras têm repetidamente ultrapassado a fronteira estabelecida perto do Vale de Mesilla." #deepl:2990890124
 frontera_sunset_route_event.4.f: "$frontera_sunset_route_event.3.f$" #deepl:3255788596
 frontera_sunset_route_event.4.a: "Oferta de venda do terreno" #deepl:3847002548
 frontera_sunset_route_event.4.b: "Seria uma loucura invadirem" #deepl:346374326
 frontera_sunset_route_event.5: "Topógrafos no deserto" #deepl:1781160719
 frontera_sunset_route_event.5.t: "Topógrafos no deserto" #deepl:1781160719
 frontera_sunset_route_event.5.d: "[SCOPE.sCountry('buyer_scope').GetAdjectiveNoFormatting] Agentes incluíram diplomatas d[SCOPE.sCountry('seller_scope').GetAdjectiveNoFormatting]e em uma missão exploratória pela região do Vale de Mesilla. Ao que parece, eles esperam estabelecer redes ferroviárias internacionais entre os dois países." #deepl:3671600249
 frontera_sunset_route_event.5.f: "Quer concordemos ou não com o plano, essas pesquisas são uma excelente oportunidade para planejar melhorias na infraestrutura e trocar conhecimentos sobre métodos de transporte mais avançados." #deepl:3061632216
 frontera_sunset_route_event.5.a: "Um gesto de boa vizinhança." #deepl:3189443051
 frontera_treaty_of_limits.1:0 "Old Words, New Treaty
 frontera_treaty_of_limits.1.t:0 "Old Words, New Treaty
 frontera_treaty_of_limits.1.d: "Alegando serem os herdeiros legais do extinto Tratado de Adams-Onís #bold  #!, [SCOPE.sCountry('buyer_scope').GetAdjectiveNoFormatting], autoridades têm pressionado [SCOPE.sCountry('seller_scope').GetCapital.GetCityHubName] a reconhecer e fazer valer as antigas linhas de demarcação do tratado." #deepl:2830373953
 frontera_treaty_of_limits.1.f: "O Tratado de Limites de #italic  #! foi assinado entre os Estados Unidos e o México em 1821. Ele renovou os artigos do Tratado de Adams-Onís #italic , que havia sido assinado pela Espanha dois anos antes. Além de transferir o controle da Flórida para os Estados Unidos, o Tratado de Adams-Onís #italic  #! também estabeleceu uma fronteira legal com a Espanha no oeste." #deepl:4100799599
 frontera_treaty_of_limits.1.a: "Ratifique o tratado." #deepl:468172514
 frontera_treaty_of_limits.1.b: "Que ideia absurda..." #deepl:1417336212
 frontera_treaty_of_limits.2: "Palavras antigas, sem tratado: [SCOPE.sCountry('seller_scope').GetCapital.GetCityHubName]" #deepl:1106196979
 frontera_treaty_of_limits.2.t: "Palavras antigas, sem tratado: [SCOPE.sCountry('seller_scope').GetCapital.GetCityHubName]" #deepl:1106196979
 frontera_treaty_of_limits.2.d: "Os representantes da [SCOPE.sCountry('buyer_scope').GetAdjectiveNoFormatting] retornaram da missão diplomática em [SCOPE.sCountry('seller_scope').GetCapital.GetCityHubName]. Infelizmente, seus homólogos da [SCOPE.sCountry('seller_scope').GetAdjectiveNoFormatting] rejeitaram a ideia “absurda” de ressuscitar o #italic  Tratado de Limites #!." #deepl:4221233034
 frontera_treaty_of_limits.2.f: "Era um dos melhores lugares para impressionar um convidado ilustre e um dos melhores restaurantes de [SCOPE.sCountry('seller_scope').GetCapital.GetCityHubName]. “Mais valia pedirem-nos para hastear uma bandeira de [SCOPE.sCountry('buyer_scope').GetAdjectiveNoFormatting] na Lua!” Os socialites de [SCOPE.sCountry('seller_scope').GetAdjectiveNoFormatting] explodiram em gargalhadas. \n \n Numa mesa próxima, dois diplomatas de [SCOPE.sCountry('buyer_scope').GetAdjectiveNoFormatting] trocaram um olhar preocupado." #deepl:1334437244
 frontera_treaty_of_limits.2.a: "Apresentar uma denúncia formal." #deepl:3722538865
 frontera_treaty_of_limits.2.b: "Desista dessa ideia." #deepl:3521850535
 frontera_treaty_of_limits.3: "Palavras antigas, novo tratado: [SCOPE.sCountry('seller_scope').GetCapital.GetCityHubName]" #deepl:3693793379
 frontera_treaty_of_limits.3.t: "Palavras antigas, novo tratado: [SCOPE.sCountry('seller_scope').GetCapital.GetCityHubName]" #deepl:3693793379
 frontera_treaty_of_limits.3.d: "Os representantes da [SCOPE.sCountry('buyer_scope').GetAdjectiveNoFormatting] retornaram da missão diplomática em [SCOPE.sCountry('seller_scope').GetCapital.GetCityHubName], entusiasmados com as relações cordiais mantidas com seus homólogos da [SCOPE.sCountry('seller_scope').GetAdjectiveNoFormatting]. As negociações estão avançando a favor da [SCOPE.sCountry('buyer_scope').GetNameNoFormatting]." #deepl:1366457633
 frontera_treaty_of_limits.3.b: "Isso é um sinal de fraqueza." #deepl:2947401295
