 concept_organized_territory_desc: "[concept_subject] [concept_country], реализовавший [GetLawType('law_frontier_territorial_administration').GetName]. Любой из его [Concept('concept_incorporated_state','$concept_incorporated_states$')] в конечном итоге может стать [Concept('concept_homeland','$concept_homeland$')] для [Concept('concept_overlord','$concept_overlord_possessive$')] [Concept('concept_primary_cultures','$concept_primary_culture$')]. Каждый из его [Concept('concept_state','$concept_states$')] должен соответствовать определенным условиям, чтобы [concept_homeland] появился. \n \n Новый [concept_homeland] появится в [concept_state], если: \n $EFFECT_LIST_BULLET$ Имеет размер [Concept('concept_pop', '$concept_population$')] выше #bold  85 000 #! \n $EFFECT_LIST_BULLET$ Имеет [Concept('concept_cultural_community','$concept_cultural_community$')] [Concept('concept_overlord','$concept_overlord_possessive$')] [Concept('concept_primary_cultures','$concept_primary_culture$')] \n $EFFECT_LIST_BULLET$ Не менее #bold  60% #! от [Concept('concept_pop', '$concept_pops$')] являются [Concept('concept_discrimination','@acceptance_status_5! $full_acceptance$')] или [Concept('concept_discrimination','@acceptance_status_4! $second_rate_citizen$')] #indent_newline:3 \n #italic  Это требование #tooltippable;tooltip: [GetPlayer.GetTooltipTag],frontera_ot_pop_scaling_rule_tt уменьшается #! по мере увеличения населения штата #! #! \n \n #bold  Организованные территории #! получают выгоду от [GetLawType('law_homesteading').GetName], а также прямой [Concept('concept_overlord','$concept_overlord$')], увеличивающий [Concept('concept_investment_level', '$concept_investment_levels$')] в [GetInstitutionType('institution_colonial_affairs').GetName] [concept_institution]." #deepl:3004377925
 concept_organized_territory_desc_added: "[GetInstitutionType('institution_colonial_affairs').GetName]" #deepl:743845877
 frontera_ot_homeland_gained_homeland: "Поскольку [SCOPE.sState('ascendent_state').GetName] является [Concept('concept_homeland','$concept_homeland$')] для своего основного [SCOPE.sCountry('overlord_scope').GetAdjectiveNoFormatting] [Concept('concept_primary_cultures','$concept_primary_culture$')] #!, теперь он может быть присоединен к [SCOPE.sCountry('overlord_scope').GetName]. \n \n #italic  [concept_state] по-прежнему должен пройти [Concept('concept_unincorporated_state','$concept_incorporation$')] процесс, чтобы стать [concept_incorporated_state]. #!" #deepl:3409905544
 frontera_establish_ot_in_region_tt: "Будет создан файл [concept_organized_territory]. \n $EFFECT_LIST_BULLET$ Будут переданы следующие файлы [Concept('concept_unincorporated_state','$concept_unincorporated_states$')]:#indent_newline:2 #indent_newline:2 " #deepl:4160631454
 frontera_stateslist_tt: "[THIS.GetState.GetName]" #deepl:318863887
 frontera_ot_homeland_not_ready_for_statehood_tt: "Этот сайт [concept_state] не будет пытаться присоединиться к [concept_overlord] [concept_country] как минимум в течение следующих #bold  3 лет #!." #deepl:3349629079
 frontera_ot_pop_scaling_rule_tt: "$EFFECT_LIST_BULLET$ [concept_state] [Concept('concept_pop', '$concept_population$')] размер #bold  85 тыс. #!—#bold  200 тыс. #!: не менее #bold  60% #! должен составлять [Concept('concept_acceptance', '$concept_accepted$')] \n $EFFECT_LIST_BULLET$ [concept_state] [Concept('concept_pop', '$concept_population$')] размер #bold  200 тыс. #!—#bold  500 тыс. #!: не менее #bold  45% #! должен составлять [Concept('concept_acceptance', '$concept_accepted$')] \n $EFFECT_LIST_BULLET$ [concept_state] [Concept('concept_pop', '$concept_population$')] размер #bold  500 тыс. #!—#bold  1 млн #!: не менее #bold  30% #! должен составлять [Concept('concept_acceptance', '$concept_accepted$')] \n $EFFECT_LIST_BULLET$ [concept_state] [Concept('concept_pop', '$concept_population$')] размер #bold  1 млн #! и выше: не менее #bold  20% #! должен составлять [Concept('concept_acceptance', '$concept_accepted$')]" #deepl:2529047697
 frontera_ot_creation_reset_tt: "Таймер ожидания при создании нового «[concept_organized_territory]» сбрасывается \n \n #italic  Размещение «[GetDecreeType('decree_greener_grass_campaign').GetName]» [concept_decree] в «[concept_unincorporated_state]», расположенном рядом с «[concept_incorporated_state]», может определить, какой из «[concept_state]» будет выбран в качестве нового «[Concept('concept_organized_territory','$concept_organize_territory_possessive$')]» [Concept('concept_capital_state','$concept_capital_state_short$')] при следующем срабатывании этого события. #!" #deepl:668338308
 creating_OT_frontera_tt: "#indent_newline:2 Элементу `[concept_organized_territory]` будет присвоен атрибут `[concept_capital_state]` в соответствии со следующими правилами: \n $EFFECT_LIST_BULLET$ Является ли [Concept('concept_unincorporated_state','$concept_unincorporated_state$')] \n $EFFECT_LIST_BULLET$ Является ли #bold  не #! [ROOT.GetCountry.GetAdjectiveNoFormatting] [Concept('concept_homeland','$concept_homeland$')] \n $EFFECT_LIST_BULLET$ Является ли #bold  смежным #! с [ROOT.GetCountry.GetAdjectiveNoFormatting] [Concept('concept_incorporated_state','$concept_incorporated_state$')]. \n $EFFECT_LIST_BULLET$ Имеет ли [GetDecreeType('decree_greener_grass_campaign').GetName] или [concept_state] с наибольшим количеством незаполненных [concept_arable_land]" #deepl:1587096270
 creating_OT_frontera_2_tt: "#italic  Любые штаты, соблюдающие первые два правила и имеющие общий домен верхнего уровня [concept_strategic_region] с новым доменом [concept_capital_state], будут переданы в управление организации [concept_organized_territory] #!." #deepl:2838758393
