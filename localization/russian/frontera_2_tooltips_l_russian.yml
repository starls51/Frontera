 colonial_affairs_owner_is_discriminated_country_tt: "Любой домен [concept_state], соседствующий с доменами [GetPlayer.GetAdjective] и [concept_homeland], принадлежит домену [concept_country], все домены [concept_primary_cultures] которого находятся ниже домена [Concept('concept_discrimination','@acceptance_status_4! $second_rate_citizen$')] в доменной структуре [GetPlayer.GetName]." #deepl:3595122018
 mesilla_treaty_creation_tt: "Добавьте объявление на сайте [concept_treaty] о продаже любого земельного участка в Аризоне или Нью-Мексико компании «[SCOPE.sCountry('buyer_scope').GetName]» за еженедельную сумму в размере #bold £3500 #! на сайте [concept_state]" #deepl:2192895926
