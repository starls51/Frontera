 CAL_FLAVOR_TEXT: "В 1821 году Верхняя Калифорния объявила о своей верности новообразованному независимому Мексиканскому государству. Мексиканские власти пытались интегрировать эту обширную территорию, но напряженность в отношениях с колонистами и местными лидерами калифорнийцев достигла критической точки. Окруженная амбициозными колониальными державами, какое будущее ждет Калифорнию?" #deepl:578679357
