l_russian:
 CAL_FLAVOR_TEXT: "В 1821 году Верхняя Калифорния объявила о своей верности недавно обретшему независимость Мексике. Мексиканские власти предпринимали попытки интегрировать эту обширную территорию, но напряженность в отношениях с колонистами и местными лидерами-калифорнийцами достигает критической точки. Окруженная амбициозными колониальными державами, какое будущее ждет Калифорнию?" #deepl:578679357
 frontera_settler_lore: "#lore  Поселенцы, торговцы, миссионеры и солдаты устремляются вперед в поисках земель и новых возможностей, зачастую выходя за пределы зоны непосредственного влияния центрального правительства. Чтобы эти отдаленные территории смогли интегрироваться, за экспансией должно следовать управление. Там, где растут поселения, однажды могут появиться новые штаты, вошедшие в состав нашего государства. #!" #deepl:5769617
