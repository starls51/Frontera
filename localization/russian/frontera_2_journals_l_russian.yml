l_russian:
 je_organized_territories_frontera: "Организовать территорию" #deepl:2984011793
 je_organized_territories_frontera_reason: "В целях расширения сети по всей стране на базе некоторых из наших филиалов [Concept('concept_unincorporated_state','$concept_unincorporated_states$')] может быть создана сеть [concept_organized_territory]. Эти филиалы станут филиалами [Concept('concept_incorporated_state','$concept_incorporated_states$')], принадлежащими [concept_organized_territory]. \n \n $frontera_settler_lore$" #deepl:334027685
 je_organize_territory_button: "Завоевать новые территории" #deepl:3442212506
 je_organize_territory_button_desc: "Превратите несколько «[Concept('concept_unincorporated_state','$concept_unincorporated_states$')]» в «[concept_organized_territory]»." #deepl:2770156865
 je_sunset_route_frontera: "Маршрут «Закат»" #deepl:1011417108
 je_sunset_route_frontera_reason: "Железнодорожное сообщение с Калифорнией в теплый период года обеспечит беспрецедентный поток товаров и людей между Востоком и Западом. Однако этот проект требует тщательной координации. Помимо урегулирования продолжающихся споров о размере колеи #italic  между землевладельцами (см. #!), необходимо также стандартизировать ширину колеи, систему сигнализации и расписание движения поездов. Это может оказаться более сложной задачей, если участки путей вдоль предполагаемого маршрута находятся под контролем других стран, но эта задача отнюдь не является невыполнимой." #deepl:2977714634
 je_sunset_route_frontera_button: "Подключите маршрут «Закат»" #deepl:317884082
 je_sunset_route_frontera_button_desc: "Выступать посредником между различными заинтересованными сторонами при строительстве нового железнодорожного маршрута в Калифорнию" #deepl:1348194334
 je_gadsden_purchase_frontera_button: "Проверьте границы" #deepl:2467056109
 je_gadsden_purchase_frontera_button_desc: "Расширение железнодорожной сети на запад будет проще осуществить при наличии фактического контроля над необходимым земельным коридором. Несмотря на политические риски, провоцирование пограничных споров с соседями может открыть дополнительные дипломатические или военные возможности для приобретения земель, необходимых для реализации проекта." #deepl:110269188
 je_organized_territory_internal_frontera: "Заселить пограничные территории" #deepl:2132308742
 je_organized_territory_internal_frontera_reason: "[ROOT.GetCountry.GetNameNoFlag] — это домен второго уровня ([concept_organized_territory]), принадлежащий [ROOT.GetCountry.GetTopOverlord.GetNameNoFlag]. Этот домен второго уровня ([concept_subject_type]) позволяет расширить домен третьего уровня ([concept_migration]) и в конечном итоге создать новый домен четвертого уровня ([Concept('concept_homeland','$concept_homelands$')]) для домена пятого уровня ([concept_overlord]) [concept_country]. Приобретение домена четвертого уровня ([concept_autonomy]) превратит домен второго уровня ([ROOT.GetCountry.GetNameNoFlag]) в домен третьего уровня ([concept_dominion]) и позволит вносить изменения в его домен второго уровня ([GetLawGroup('lawgroup_governance_principles').GetName]). \n \n $frontera_settler_lore$" #deepl:4286496753
 je_fort_ross_frontera: "Ворота в Тихий океан" #deepl:2279191856
 je_fort_ross_frontera_reason: "[GetStateRegion('STATE_CALIFORNIA').GetName] остаётся малонаселённой пограничной территорией, балансирующей на грани под хрупким испанским бумажным правом и окружённой амбициозными соседями. Тем не менее, её гавани, земли и ресурсы изобилуют богатствами. \n \n Контроль над этой [concept_state_region] может сыграть важную роль в определении баланса сил на [GetStrategicRegion('region_pacific_coast').GetName]." #deepl:51288871
 frontera_treaty_of_limits: "Подготовить проект пересмотренного договора о границах" #deepl:2091412374
 frontera_treaty_of_limits_desc: "Наши соседи не соблюдают законные границы на американской границе. Направьте туда дипломатическую миссию и раз и навсегда решите эту проблему." #deepl:1253377358
 frontera_manifest_destiny: "Укрепить полосу Нуэсес" #deepl:2389825869
 frontera_manifest_destiny_desc: "Мексика до сих пор не признала наш суверенитет над Техасом. Необходимо развернуть военное присутствие за рекой Нуэсес и не оставлять никаких сомнений относительно амбиций Америки на Западе." #deepl:784934809
