 ideology_frontera_mexican_centralist_desc: "Централисты стремятся к созданию сильного, унитарного национального правительства, как правило, в ущерб региональной автономии. Они стремятся навести порядок в хаотичной молодой республике, копируя централизованную структуру колониальной эпохи." #deepl:2906061988
