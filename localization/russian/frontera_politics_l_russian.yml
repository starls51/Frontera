 ideology_frontera_mexican_federalist_desc: "Федералисты выступают за децентрализацию власти, предоставляя отдельным штатам значительную автономию. Вдохновленные моделью Соединенных Штатов, федералисты стремятся защитить местные свободы и не допустить прихода к власти единоличного диктатора в столице." #deepl:3704296238
