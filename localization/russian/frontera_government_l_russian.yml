 law_frontier_territorial_administration_desc: "С юридической точки зрения штат является административной единицей иностранного государства и не обладает собственным суверенитетом. Ему предоставлены ограниченные полномочия по управлению разрозненными территориальными владениями. По замыслу, территориальное правительство призвано способствовать миграции, росту населения или установлению географического контроля; его деятельность может привести к постепенной интеграции с вышестоящей властью." #deepl:2928952332
