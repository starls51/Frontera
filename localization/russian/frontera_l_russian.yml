 je_sunset_route_frontera: "Маршрут «Закат»" #deepl:1011417108
 je_sunset_route_frontera_reason: "Железнодорожное сообщение с Калифорнией в теплое время года позволило бы обеспечить беспрецедентный поток товаров и людей между Востоком и Западом. Однако этот проект требует значительной координации. Помимо урегулирования продолжающихся споров между владельцами недвижимости по поводу пересечения железнодорожных путей (#italic ) #!, необходимо также стандартизировать ширину колеи, сигналы и расписание. Это может быть более сложной задачей, если иностранные государства контролируют участки путей вдоль предлагаемого маршрута, но эта задача ни в коем случае не является невозможной." #deepl:1621464726
 je_sunset_route_frontera_button: "Подключите маршрут «Закат»" #deepl:317884082
 je_sunset_route_frontera_button_desc: "Выступать посредником между различными заинтересованными сторонами с целью создания нового железнодорожного маршрута в Калифорнию." #deepl:952386937
 je_gadsden_purchase_frontera_button: "Проверьте границы" #deepl:2467056109
 je_gadsden_purchase_frontera_button_desc: "Расширение железнодорожной сети на запад будет более управляемым, если мы будем физически контролировать необходимый земельный коридор. Хотя это и сопряжено с политическим риском, провоцирование пограничных споров с нашими соседями может открыть дополнительные дипломатические или военные возможности для приобретения земель для нашего проекта." #deepl:1391362877
