 je_organized_territories_frontera: "Установить организованную территорию" #deepl:1625332565
 je_organized_territories_frontera_reason: "В целях расширения нашей страны, на территории некоторых из наших [Concept('concept_unincorporated_state','$concept_unincorporated_states$')] может быть создана организованная территория #bold  #!. Они станут [Concept('concept_incorporated_state','$concept_incorporated_states$')], принадлежащими организованной территории #bold  #!. \n \n В то время как на территории #bold  #! принят закон [GetLawType('law_homesteading').GetName], два [Concept('concept_incorporated_state','$concept_states$')] с самым высоким [Concept('concept_gdp','$concept_gdp_short$')] будут получать ежегодный бонус к [Concept('concept_migration','$concept_migration$')]. Любой [Concept('concept_incorporated_state','$concept_incorporated_state$')], принадлежащий организованной территории #bold  #!, может в конечном итоге стать [Concept('concept_homeland','$concept_homeland$')] для [Concept('concept_overlord','$concept_overlord_possessive$')] [Concept('concept_primary_cultures','$concept_primary_culture$')]. \n #indent_newline:2 \n [concept_state] станет [Concept('concept_homeland','$concept_homeland$')], если: \n $EFFECT_LIST_BULLET$ Имеет [Concept('concept_cultural_community','$concept_cultural_community$')] [Concept('concept_overlord','$concept_overlord_possessive$')] [Concept('concept_primary_cultures','$concept_primary_culture$')] \n $EFFECT_LIST_BULLET$ 60% [Concept('concept_pop', '$concept_population$')] имеет [concept_acceptance] 65 или более \n $EFFECT_LIST_BULLET$ [concept_state] [Concept('concept_pop', '$concept_population$')] превышает 85 000 \n \n #lore  Поселенцы, торговцы, миссионеры и солдаты продвигаются вперед в поисках земли и возможностей, часто выходя за пределы досягаемости центрального правительства. Чтобы эти отдаленные территории могли интегрироваться, за расширением должна следовать администрация. Там, где растут поселения, новые штаты могут однажды быть приняты в нашу юрисдикцию. #!" #deepl:544344828
