 da_organize_territory_from_subject_desc: "[Concept('concept_law', '$concept_laws$')] и [Concept('concept_institution', '$concept_institutions$')] этого [concept_subject] будут изменены, чтобы стать #bold  Organized Territory #!. Поселенцы будут более склонны [Concept('concept_migration','$concept_migrate$')] здесь, но местные [Concept('concept_pop', '$Population$')] станут более [Concept('concept_radical','$concept_radicalized$')]." #deepl:2949097403
