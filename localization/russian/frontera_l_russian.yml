 creating_OT_frontera_tt: "#indent_newline:2 Организованная территория #bold  #! будет присвоена [concept_capital_state] в соответствии со следующими правилами: \n $EFFECT_LIST_BULLET$ Является ли [Concept('concept_unincorporated_state','$concept_unincorporated_state$')] \n $EFFECT_LIST_BULLET$ Является ли #bold  не #! [ROOT.GetCountry.GetAdjectiveNoFormatting] [Concept('concept_homeland','$concept_homeland$')] \n $EFFECT_LIST_BULLET$ Является ли #bold  смежным #! с [ROOT.GetCountry.GetAdjectiveNoFormatting] [Concept('concept_incorporated_state','$concept_incorporated_state$')]. \n $EFFECT_LIST_BULLET$ Имеет ли [GetDecreeType('decree_greener_grass_campaign').GetName] , или [concept_state] с наивысшим [Concept('concept_gdp','$concept_gdp_short$')]" #deepl:2335454090
 creating_OT_frontera_2_tt: "#italic  Любые штаты, следующие первым двум правилам и имеющие общий граничный бассейн ([concept_strategic_region]) с новым штатом ([concept_capital_state]), будут переданы в состав организованной территории (Organized Territory) штата Виргиния (#bold ) #! #!." #deepl:1399382270
