 law_frontier_territorial_administration: "Conseil territorial" #deepl:2715586447
 law_frontier_territorial_administration_desc: "D'un point de vue juridique, l'État est une subdivision d'une puissance étrangère et ne dispose d'aucune souveraineté propre. Il s'est vu accorder une autorité limitée pour administrer un ensemble disparate de possessions territoriales. De par sa conception, le gouvernement territorial a pour objectif de favoriser la migration, la croissance démographique ou le contrôle géographique ; sa fonction peut conduire à une intégration progressive avec sa puissance tutélaire." #deepl:2928952332
 da_organize_territory_from_subject: "Mettre en place un gouvernement des Territoires de l'Ouest" #deepl:1624084733
 da_organize_territory_from_subject_desc: "Les adresses [Concept('concept_law', '$concept_laws$')] et [Concept('concept_institution', '$concept_institutions$')] de ce site [concept_subject] seront modifiées pour devenir [concept_organized_territory]. Les nouveaux arrivants auront davantage tendance à [Concept('concept_migration','$concept_migrate$')] ici, mais la communauté locale [Concept('concept_pop', '$Population$')] deviendra plus [Concept('concept_radical','$concept_radicalized$')]." #deepl:3012390034
