 gov_frontier_territory_frontera_desc: "Il s'agit d'un État de facto [concept_government_type] dirigé par une assemblée législative élue, agissant au nom de son suzerain territorial. \n \n $TRANSFER_OF_POWER_NAME_DESC$" #deepl:2530168596
