 gov_frontier_territory_frontera_desc: "Il s'agit d'un État de facto [concept_government_type] dirigé par une assemblée législative élue, au nom de son suzerain territorial. \n \n $TRANSFER_OF_POWER_NAME_DESC$" #deepl:2530168596
 gov_occupied_territory_frontera_desc: "Il s'agit d'un État de facto [concept_government_type] dirigé par une administration nommée, au nom de leur suzerain territorial. \n \n $TRANSFER_OF_POWER_NAME_DESC$" #deepl:4281170394
 law_frontier_territorial_administration: "Conseil territorial" #deepl:2715586447
 law_frontier_territorial_administration_desc: "L'État est légalement une subdivision d'une puissance étrangère, ne possédant aucune souveraineté propre. Il s'est vu accorder une autorité limitée pour administrer un ensemble disparate de possessions territoriales. De par sa conception, le gouvernement territorial a pour objectif de favoriser la migration, la croissance démographique ou le contrôle géographique ; sa fonction peut conduire à une intégration progressive avec son suzerain." #deepl:2928952332
