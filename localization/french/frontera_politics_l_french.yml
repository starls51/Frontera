 ideology_frontera_mexican_federalist_desc: "Les fédéralistes prônent un gouvernement décentralisé, accordant une grande autonomie aux différents États. S'inspirant du modèle américain, les fédéralistes visent à protéger les libertés locales et à empêcher l'émergence d'un dictateur unique au sein du pouvoir central." #deepl:3704296238
