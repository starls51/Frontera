 ideology_frontera_mexican_centralist: "Centraliste mexicain" #deepl:1986234739
 ideology_frontera_mexican_centralist_desc: "Les centralistes souhaitent un gouvernement national fort et unitaire, généralement au détriment de l'autonomie régionale. Ils cherchent à imposer l'ordre dans une république naissante chaotique en imitant la structure centralisée de l'époque coloniale." #deepl:2906061988
