 ideology_frontera_mexican_federalist: "Fédéraliste mexicain" #deepl:2228111078
 ideology_frontera_mexican_federalist_desc: "Les fédéralistes prônent un gouvernement décentralisé, accordant une autonomie importante aux différents États. Inspirés par le modèle américain, les fédéralistes visent à protéger les libertés locales et à empêcher l'émergence d'un dictateur unique dans la capitale." #deepl:3704296238
