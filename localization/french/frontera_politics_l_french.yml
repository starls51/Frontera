 ideology_frontera_mexican_centralist_desc: "Les centralistes aspirent à un gouvernement national fort et unitaire, généralement au détriment de l'autonomie régionale. Ils cherchent à mettre de l'ordre dans une république naissante en proie au chaos en s'inspirant de la structure centralisée de l'époque coloniale." #deepl:2906061988
