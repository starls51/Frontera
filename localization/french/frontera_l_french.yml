 creating_OT_frontera_tt: "#indent_newline:2 Un territoire organisé par l'#bold  #! recevra un [concept_capital_state] suivant ces règles : \n $EFFECT_LIST_BULLET$ Est-ce que [Concept('concept_unincorporated_state','$concept_unincorporated_state$')] \n $EFFECT_LIST_BULLET$ Est-ce que #bold  n'est pas #! [ROOT.GetCountry.GetAdjectiveNoFormatting] [Concept('concept_homeland','$concept_homeland$')] \n $EFFECT_LIST_BULLET$ Est-ce que #bold  adjacent #! à [ROOT.GetCountry.GetAdjectiveNoFormatting] [Concept('concept_incorporated_state','$concept_incorporated_state$')]. \n $EFFECT_LIST_BULLET$ A-t-il [GetDecreeType('decree_greener_grass_campaign').GetName] , ou [concept_state] avec le plus haut [Concept('concept_gdp','$concept_gdp_short$')]" #deepl:2335454090
 creating_OT_frontera_2_tt: "#italic  Tous les États qui respectent les deux premières règles et qui partagent une [concept_strategic_region] avec la nouvelle [concept_capital_state] seront cédés au territoire organisé de l'#bold  #! #!." #deepl:1399382270
