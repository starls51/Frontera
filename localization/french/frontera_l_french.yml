 je_organized_territories_frontera: "Établir un territoire organisé" #deepl:1625332565
 je_organized_territories_frontera_reason: "Dans le but d'étendre notre nation, un territoire organisé #bold  #! peut être créé à partir de certains de nos [Concept('concept_unincorporated_state','$concept_unincorporated_states$')]. Ceux-ci deviendront des [Concept('concept_incorporated_state','$concept_incorporated_states$')] appartenant au territoire organisé #bold  #!. \n \n Lorsqu'un territoire organisé #bold  #! a [GetLawType('law_homesteading').GetName] promulgué, ses deux [Concept('concept_incorporated_state','$concept_states$')] ayant le plus haut [Concept('concept_gdp','$concept_gdp_short$')] recevront une prime annuelle à [Concept('concept_migration','$concept_migration$')]. Tout [Concept('concept_incorporated_state','$concept_incorporated_state$')] appartenant à un territoire organisé #bold  #! peut éventuellement devenir un [Concept('concept_homeland','$concept_homeland$')] d'un [Concept('concept_overlord','$concept_overlord_possessive$')] [Concept('concept_primary_cultures','$concept_primary_culture$')]. \n #indent_newline:2 \n Un [concept_state] deviendra un [Concept('concept_homeland','$concept_homeland$')] si : \n $EFFECT_LIST_BULLET$ Il a un [Concept('concept_cultural_community','$concept_cultural_community$')] de [Concept('concept_overlord','$concept_overlord_possessive$')] [Concept('concept_primary_cultures','$concept_primary_culture$')] \n $EFFECT_LIST_BULLET$ 60 % de l'[Concept('concept_pop', '$concept_population$')] a un [concept_acceptance] de 65 ou plus \n $EFFECT_LIST_BULLET$ L'[concept_state] [Concept('concept_pop', '$concept_population$')] est supérieur à 85 000 \n \n #lore  Les colons, les commerçants, les missionnaires et les soldats s'aventurent à la recherche de terres et d'opportunités, souvent hors de portée du gouvernement central. Pour que ces territoires éloignés s'intègrent, l'administration doit suivre l'expansion. Là où les colonies se développent, de nouveaux États pourraient un jour être admis dans notre domaine. #!" #deepl:544344828
 je_organize_territory_button: "Établir un territoire" #deepl:4044636356
 je_organize_territory_button_desc: "Organisez certaines de nos [Concept('concept_unincorporated_state','$concept_unincorporated_states$')] dans un territoire organisé #bold . #!." #deepl:1558054720
 da_organize_territory_from_subject: "Établir un gouvernement frontalier" #deepl:1624084733
 da_organize_territory_from_subject_desc: "Les [Concept('concept_law', '$concept_laws$')] et [Concept('concept_institution', '$concept_institutions$')] de ce [concept_subject] seront modifiés pour devenir un territoire organisé de l'#bold  #!. Les colons seront plus enclins à [Concept('concept_migration','$concept_migrate$')] ici, mais l'[Concept('concept_pop', '$Population$')] locale deviendra plus [Concept('concept_radical','$concept_radicalized$')]." #deepl:2949097403
 da_organize_territory_from_subject_effect: "L'Association des propriétaires de maisons individuelles de l'État de Washington ([concept_subject]) deviendra un territoire organisé de l'#bold  ( Organized Territory) #!." #deepl:1446860370
