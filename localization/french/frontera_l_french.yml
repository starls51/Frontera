 je_sunset_route_frontera: "La route du coucher du soleil" #deepl:1011417108
 je_sunset_route_frontera_reason: "Une liaison ferroviaire vers la Californie par temps chaud permettrait un flux commercial et humain sans précédent entre l'Est et l'Ouest. Cependant, ce projet nécessite une coordination importante. Outre le règlement des conflits fonciers en cours #! entre les propriétaires fonciers, il est également impératif de normaliser les écartements, les signaux et les horaires. Cela peut s'avérer plus difficile si des pays étrangers contrôlent des tronçons de voie le long du tracé proposé, mais la tâche n'est en aucun cas impossible." #deepl:1621464726
 je_sunset_route_frontera_button: "Connectez la route du coucher du soleil" #deepl:317884082
 je_sunset_route_frontera_button_desc: "Servir de médiateur entre les différentes parties prenantes afin de créer une nouvelle ligne ferroviaire vers la Californie." #deepl:952386937
 je_gadsden_purchase_frontera_button: "Tester les limites" #deepl:2467056109
 je_gadsden_purchase_frontera_button_desc: "L'expansion ferroviaire vers l'ouest sera plus facile à gérer si nous contrôlons physiquement le corridor terrestre nécessaire. Bien que cela soit politiquement risqué, provoquer des conflits frontaliers avec nos voisins pourrait nous ouvrir de nouvelles options diplomatiques ou militaires pour acquérir les terrains nécessaires à notre projet." #deepl:1391362877
