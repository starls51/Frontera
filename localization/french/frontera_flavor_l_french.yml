 CAL_FLAVOR_TEXT: "La Haute-Californie a déclaré son allégeance au Mexique nouvellement indépendant en 1821. Les autorités mexicaines ont tenté d'intégrer ce vaste territoire, mais les tensions avec les colons et les dirigeants locaux californiens atteignent leur paroxysme. Entourée de puissances coloniales ambitieuses, quel avenir attend la Californie ?" #deepl:578679357
