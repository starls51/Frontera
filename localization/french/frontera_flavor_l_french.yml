 CAL_FLAVOR_TEXT: "En 1821, la Haute-Californie a déclaré son allégeance au Mexique, qui venait d'accéder à l'indépendance. Les autorités mexicaines ont tenté d'intégrer ce vaste territoire, mais les tensions avec les colons et les chefs californiens locaux atteignent leur paroxysme. Entourée de puissances coloniales ambitieuses, quel avenir attend la Californie ?" #deepl:578679357
 frontera_settler_lore: "#lore  Colons, commerçants, missionnaires et soldats partent à la conquête de nouvelles terres et de nouvelles opportunités, souvent loin de l’emprise directe du gouvernement central. Pour que ces territoires éloignés s’intègrent, l’administration doit suivre le rythme de l’expansion. Là où les colonies se développent, de nouveaux États pourraient un jour être admis dans notre domaine. #!" #deepl:5769617
