 concept_organized_territory_desc: "Un « [concept_subject] » [concept_country] qui a mis en œuvre « [GetLawType('law_frontier_territorial_administration').GetName] ». N'importe lequel de ses « [Concept('concept_incorporated_state','$concept_incorporated_states$')] » peut éventuellement devenir un « [Concept('concept_homeland','$concept_homeland$')] » pour un « [Concept('concept_overlord','$concept_overlord_possessive$')] » [Concept('concept_primary_cultures','$concept_primary_culture$')]. Chacun de ses « [Concept('concept_state','$concept_states$')] » doit remplir certaines conditions pour que le « [concept_homeland] » apparaisse. \n \n Un nouvel [concept_homeland] apparaîtra dans un [concept_state] si : \n $EFFECT_LIST_BULLET$ Sa taille [Concept('concept_pop', '$concept_population$')] est supérieure à #bold  85 000 #! \n $EFFECT_LIST_BULLET$ Son [Concept('concept_cultural_community','$concept_cultural_community$')] est de [Concept('concept_overlord','$concept_overlord_possessive$')] [Concept('concept_primary_cultures','$concept_primary_culture$')] \n $EFFECT_LIST_BULLET$ Au moins #bold  60 % #! de [Concept('concept_pop', '$concept_pops$')] sont [Concept('concept_discrimination','@acceptance_status_5! $full_acceptance$')] ou [Concept('concept_discrimination','@acceptance_status_4! $second_rate_citizen$')] #indent_newline:3 \n #italic  Cette exigence #tooltippable;tooltip: [GetPlayer.GetTooltipTag],frontera_ot_pop_scaling_rule_tt diminue #! à mesure que la population de l'État augmente #! #! \n \n #bold  Les territoires organisés #! bénéficient de [GetLawType('law_homesteading').GetName], et d'une augmentation directe [Concept('concept_overlord','$concept_overlord$')] des [Concept('concept_investment_level', '$concept_investment_levels$')] dans l'[GetInstitutionType('institution_colonial_affairs').GetName] [concept_institution]." #deepl:3004377925
 concept_organized_territory_desc_added: "[GetInstitutionType('institution_colonial_affairs').GetName]" #deepl:743845877
 frontera_ot_homeland_gained_homeland: "Étant donné que [SCOPE.sState('ascendent_state').GetName] est une [Concept('concept_homeland','$concept_homeland$')] de son [SCOPE.sCountry('overlord_scope').GetAdjectiveNoFormatting] [Concept('concept_primary_cultures','$concept_primary_culture$')] #! majoritaire, il peut désormais être annexé par [SCOPE.sCountry('overlord_scope').GetName]. \n \n #italic  La [concept_state] doit encore passer par le processus [Concept('concept_unincorporated_state','$concept_incorporation$')] pour devenir une [concept_incorporated_state]. #!" #deepl:3409905544
 frontera_establish_ot_in_region_tt: "Une [concept_organized_territory] sera créée. \n $EFFECT_LIST_BULLET$ Les [Concept('concept_unincorporated_state','$concept_unincorporated_states$')] suivantes seront cédées :#indent_newline:2 #indent_newline:2 " #deepl:4160631454
 frontera_stateslist_tt: "[THIS.GetState.GetName]" #deepl:318863887
 frontera_ot_homeland_not_ready_for_statehood_tt: "Ce site [concept_state] ne tentera pas de rejoindre le site [concept_overlord] [concept_country] avant au moins #bold  3 ans #!." #deepl:3349629079
 frontera_ot_pop_scaling_rule_tt: "$EFFECT_LIST_BULLET$ [concept_state] [Concept('concept_pop', '$concept_population$')] taille #bold  85k #!—#bold  200k #! : au moins #bold  60 % #! doit être [Concept('concept_acceptance', '$concept_accepted$')] \n $EFFECT_LIST_BULLET$ [concept_state] [Concept('concept_pop', '$concept_population$')] taille #bold  200k #!—#bold  500k #! : au moins #bold  45 % #! doit être [Concept('concept_acceptance', '$concept_accepted$')] \n $EFFECT_LIST_BULLET$ [concept_state] [Concept('concept_pop', '$concept_population$')] taille #bold  500k #!—#bold  1m #! : au moins #bold  30 % #! doit être [Concept('concept_acceptance', '$concept_accepted$')] \n $EFFECT_LIST_BULLET$ [concept_state] [Concept('concept_pop', '$concept_population$')] taille #bold  1m #! et plus : au moins #bold  20 % #! doit être [Concept('concept_acceptance', '$concept_accepted$')]" #deepl:2529047697
 frontera_ot_creation_reset_tt: "Le délai de recharge pour la création d'un nouvel [concept_organized_territory] sera réinitialisé \n \n #italic  Placer un [GetDecreeType('decree_greener_grass_campaign').GetName] [concept_decree] dans un [concept_unincorporated_state] adjacent à un [concept_incorporated_state] permet de déterminer quel [concept_state] sera sélectionné pour devenir le nouveau [Concept('concept_organized_territory','$concept_organize_territory_possessive$')] [Concept('concept_capital_state','$concept_capital_state_short$')] lors du prochain déclenchement de cet événement. #!" #deepl:668338308
 creating_OT_frontera_tt: "#indent_newline:2 Une entité «[concept_organized_territory]» se verra attribuer une entité «[concept_capital_state]» selon les règles suivantes : \n $EFFECT_LIST_BULLET$ Est-ce que [Concept('concept_unincorporated_state','$concept_unincorporated_state$')] \n $EFFECT_LIST_BULLET$ Est-ce que #bold  n'est pas #! [ROOT.GetCountry.GetAdjectiveNoFormatting] [Concept('concept_homeland','$concept_homeland$')] \n $EFFECT_LIST_BULLET$ Est-ce que #bold  est adjacent #! à [ROOT.GetCountry.GetAdjectiveNoFormatting] [Concept('concept_incorporated_state','$concept_incorporated_state$')]. \n $EFFECT_LIST_BULLET$ Possède-t-il [GetDecreeType('decree_greener_grass_campaign').GetName], ou [concept_state] avec le plus grand nombre de [concept_arable_land] non revendiqués" #deepl:1587096270
 creating_OT_frontera_2_tt: "#italic  Tout État respectant les deux premières règles et partageant une adresse [concept_strategic_region] avec le nouveau site [concept_capital_state] sera transféré vers le site [concept_organized_territory] #!." #deepl:2838758393
