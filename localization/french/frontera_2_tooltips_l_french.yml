 colonial_affairs_owner_is_discriminated_country_tt: "Tout domaine de type [concept_state] adjacent à [GetPlayer.GetAdjective] [concept_homeland] appartient à un domaine de type [concept_country] dont les sous-domaines de type [concept_primary_cultures] se trouvent tous sous [Concept('concept_discrimination','@acceptance_status_4! $second_rate_citizen$')] au sein de [GetPlayer.GetName]." #deepl:3595122018
 mesilla_treaty_creation_tt: "Ajoutez une offre sur [concept_treaty] pour vendre tout terrain dont vous êtes propriétaire en Arizona ou au Nouveau-Mexique à l'[SCOPE.sCountry('buyer_scope').GetName], moyennant une somme hebdomadaire de #bold 3 500 £ #! via [concept_state]" #deepl:2192895926
