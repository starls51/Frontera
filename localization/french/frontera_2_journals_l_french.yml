l_french:
 je_organized_territories_frontera: "Organiser le territoire" #deepl:2984011793
 je_organized_territories_frontera_reason: "Dans le but d'étendre notre présence à l'échelle nationale, une filiale ([concept_organized_territory]) pourrait être créée à partir de certaines de nos succursales ([Concept('concept_unincorporated_state','$concept_unincorporated_states$')]). Ces succursales deviendront des filiales ([Concept('concept_incorporated_state','$concept_incorporated_states$')]) détenues par la société mère ([concept_organized_territory]). \n \n $frontera_settler_lore$" #deepl:334027685
 je_organize_territory_button: "Conquérir de nouveaux territoires" #deepl:3442212506
 je_organize_territory_button_desc: "Transformez quelques « [Concept('concept_unincorporated_state','$concept_unincorporated_states$')] » en une « [concept_organized_territory] »." #deepl:2770156865
 je_sunset_route_frontera: "La Route du Coucher de Soleil" #deepl:1011417108
 je_sunset_route_frontera_reason: "Une liaison ferroviaire vers la Californie, même par temps chaud, permettrait un flux sans précédent de marchandises et de personnes entre l'Est et l'Ouest. Cependant, ce projet nécessite une coordination importante. Outre le règlement des conflits en cours concernant les « guerres des crapauds » #italic  entre propriétaires fonciers, il est également impératif d'harmoniser les gabarits, la signalisation et les horaires. Cela pourrait s'avérer plus difficile si des pays étrangers contrôlent certaines portions de voie le long du tracé proposé, mais la tâche n'est en aucun cas impossible." #deepl:2977714634
 je_sunset_route_frontera_button: "Rejoignez la Route du Coucher de soleil" #deepl:317884082
 je_sunset_route_frontera_button_desc: "Assurer la médiation entre les différentes parties prenantes dans le cadre de la construction d'une nouvelle ligne ferroviaire vers la Californie" #deepl:1348194334
 je_gadsden_purchase_frontera_button: "Tester les frontières" #deepl:2467056109
 je_gadsden_purchase_frontera_button_desc: "L'extension du réseau ferroviaire vers l'ouest sera plus facile à gérer si l'on dispose d'un contrôle physique sur le corridor foncier nécessaire. Bien que cela comporte des risques politiques, le fait de provoquer des différends frontaliers avec les pays voisins pourrait ouvrir la voie à d'autres options diplomatiques ou militaires pour acquérir les terrains nécessaires au projet." #deepl:110269188
 je_organized_territory_internal_frontera: "Peupler la frontière" #deepl:2132308742
 je_organized_territory_internal_frontera_reason: "[ROOT.GetCountry.GetNameNoFlag] Il s'agit d'un [concept_organized_territory] appartenant à [ROOT.GetCountry.GetTopOverlord.GetNameNoFlag]. Ce [concept_subject_type] permet d'augmenter l'[concept_migration] et, à terme, de créer de nouveaux [Concept('concept_homeland','$concept_homelands$')] pour le [concept_overlord] [concept_country]. L'obtention de l'[concept_autonomy] fera de [ROOT.GetCountry.GetNameNoFlag] un [concept_dominion] et permettra de modifier son [GetLawGroup('lawgroup_governance_principles').GetName]. \n \n $frontera_settler_lore$" #deepl:4286496753
 je_fort_ross_frontera: "Porte d'entrée sur le Pacifique" #deepl:2279191856
 je_fort_ross_frontera_reason: "[GetStateRegion('STATE_CALIFORNIA').GetName] reste une région frontalière peu peuplée, chancelant sous le poids d’une fragile revendication espagnole sur le papier, et entourée de voisins ambitieux. Pourtant, ses ports, ses terres et ses ressources regorgent de richesses. \n \n La maîtrise de cette [concept_state_region] pourrait jouer un rôle important dans la définition de l’équilibre des pouvoirs sur l’[GetStrategicRegion('region_pacific_coast').GetName]." #deepl:51288871
 frontera_treaty_of_limits: "Rédiger un projet de traité révisé sur les limites" #deepl:2091412374
 frontera_treaty_of_limits_desc: "Nos voisins ne respectent pas les frontières légales de la frontière américaine. Envoyez une mission diplomatique et réglez ce problème une bonne fois pour toutes." #deepl:1253377358
 frontera_manifest_destiny: "Renforcer le Nueces Strip" #deepl:2389825869
 frontera_manifest_destiny_desc: "Le Mexique n'a toujours pas reconnu notre souveraineté sur le Texas. Il faut établir une présence militaire au-delà du fleuve Nueces et ne laisser planer aucun doute quant aux ambitions des États-Unis dans l'Ouest." #deepl:784934809
