 frontera_sunset_route_event.1.d: "[SCOPE.sState('california_scope').GetName] demiryolu ile kıtanın doğu bölgelerine başarıyla bağlanmıştır. Sonora Çölü'nü kesen bu sıcak hava rotası, yıl boyunca kesintisiz olarak çalışabilir." #deepl:3309601727
 frontera_sunset_route_event.2.d: "[SCOPE.sCountry('builder_scope').GetNameNoFlag] [SCOPE.sState('california_scope').GetName]'ı kıtanın doğu kesimlerine demiryolu ile bağlamak için bir girişim başlattı. Sonora Çölü'nü kesen bu sıcak hava rotası, yıl boyunca kesintisiz olarak çalışabilir." #deepl:2730146222
 frontera_sunset_route_event.1.f: ""İşte size kanun, gün gibi açık," dedi Vali, sesi arkasındaki demir dev kadar sağlamdı. Rüzgar çölü süpürüyordu ve Virgil Earp'in eli tabancasının üzerinde duruyordu. İzlemeye gelen masum kasaba halkı olmasaydı, belki de bir çatışma çıkacaktı. Earp'in isteksiz iç çekişi, güneşin kavurduğu sıcaklıkta buhar gibi süzüldü. Lokomotif yoluna devam etti ve Sunset Route açıldı." #deepl:295026560
 frontera_sunset_route_event.1.a: "İlerleme için bir zafer!" #deepl:2958605196
 frontera_sunset_route_event.2.a: "Onlar için ne güzel..." #deepl:2754019974
