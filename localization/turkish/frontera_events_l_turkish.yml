 frontera_ot_homeland.1.b: "Buradaki işim bitti." #deepl:1429745245
 frontera_ot_homeland_gained_homeland: "Olanlar: \n #indent_newline:3 [SCOPE.sState('ascendent_state').GetName] çoğunluğu için bir [Concept('concept_homeland','$concept_homeland$')] haline geldi [SCOPE.sCountry('overlord_scope').GetAdjectiveNoFormatting] [Concept('concept_primary_cultures','$concept_primary_culture$')] #!" #deepl:1846806708
 frontera_fort_ross.1: "Zararlarımızı Azaltmak" #deepl:1680067657
 frontera_fort_ross.1.t: "Zararlarımızı Azaltmak" #deepl:1680067657
 frontera_fort_ross.1.d: "Fort Ross, ilk olarak Alaska'daki kolonistlere yiyecek sağlamak amacıyla kuruldu. Bu yeni kurulan [SCOPE.sCountry('seller_scope').GetAdjectiveNoFlag] karakolu, o zamandan beri önemini yitirmiştir. [SCOPE.sCountry('buyer_scope').GetAdjectiveNoFlag] yetkilileri, son zamanlarda bu araziye ilişkin şüpheli iddiamızı fark etmişlerdir. Yapıları satmak, onurumuzu zedelemeden buradan ayrılmamızı ve bölgedeki gerginliği azaltmamızı sağlayacaktır." #deepl:233128330
 frontera_fort_ross.1.f: "\n"Gördüğünüz gibi, burası benim #bold  New Helvatia #!'ımı kurmak için ideal bir yer. Evet, burası güzel bir arazi... ve bunun için size ödeme yapılacaktır! Ah #italic  Elbette #! size cömert bir ödeme yapılacaktır," diyor satın almaya hevesli Bay [SCOPE.sCharacter('john_sutter_scope').GetLastName]. "Zamanı geldiğinde. Evet, zamanı geldiğinde..."" #deepl:2218651227
 frontera_fort_ross.1.a: "Asla! [SCOPE.sState('california_scope').GetName] bizimdir." #deepl:1821605251
 frontera_fort_ross.1.b: "Bu iyi bir plan." #deepl:3518633261
 frontera_fort_ross.1.c: "[SCOPE.sState('california_scope').GetName] [SCOPE.sCountry('seller_scope').GetAdjectiveNoFlag] olmuştur..." #deepl:971068779
 frontera_fort_ross.2: "Zararlarımızı Azaltmak" #deepl:1680067657
 frontera_fort_ross.2.t: "Zararlarımızı Azaltmak" #deepl:3839667639
 frontera_fort_ross.2.d: "[SCOPE.sCountry('seller_scope').GetNameNoFlag] [concept_subject], [SCOPE.sState('california_scope').GetName]'deki hisselerini devretmeyi planlıyor." #deepl:221351375
 frontera_fort_ross.2.f: "[SCOPE.sCountry('buyer_scope').GetAdjectiveNoFlag]'ın yerel yetkilileri, yerleşim yerini terk etmemizden büyük memnuniyet duyacaktır. Yapıları satmak, onurumuzu zedelemeden buradan ayrılmamız için bir fırsat sunacak ve bölgedeki gerginliği azaltacaktır." #deepl:4219192694
 frontera_fort_ross.2.a: "Hayır, [SCOPE.sState('california_scope').GetName] değerli bir dayanak noktasıdır." #deepl:1425941161
 frontera_fort_ross.2.b: "Peki, bu güçlü [SCOPE.sCountry('overlord_scope').GetNameNoFlag]'yi ilgilendirmez." #deepl:2472227683
 frontera_fort_ross.3: "Ne cüret!" #deepl:61601467
 frontera_fort_ross.3.t: "Ne cüret!" #deepl:61601467
 frontera_fort_ross.3.d: "[SCOPE.sCountry('seller_scope').GetNameNoFlag] [SCOPE.sState('california_scope').GetName]'da giderek daha iddialı hale geliyor." #deepl:984030691
 frontera_fort_ross.3.f: "[concept_claim]'un yasal statüsü istikrarsız olmasına rağmen, [SCOPE.sCountry('seller_scope').GetAdjectiveNoFlag] kolonist grupları, [SCOPE.sCountry('buyer_scope').GetNameNoFlag] ve [SCOPE.sCountry('seller_scope').GetNameNoFlag] arasında giderek büyüyen toprak anlaşmazlığının alevlerini körüklemiştir." #deepl:725587561
 frontera_fort_ross.3.a: "[SCOPE.sCountry('buyer_scope').GetAdjectiveNoFlag] insanlar bu tehdide karşı birleşmelidir" #deepl:620721478
 frontera_fort_ross.4: "[SCOPE.sCharacter('john_sutter_scope').GetLastName]i Kalesi" #deepl:3078921980
 frontera_fort_ross.4.t: "[SCOPE.sCharacter('john_sutter_scope').GetLastName]i Kalesi" #deepl:3078921980
 frontera_fort_ross.4.d: "İsviçre-Amerikalı göçmen, öncü ve çok dilli[SCOPE.sCharacter('john_sutter_scope').GetFullName],[SCOPE.sState('california_scope').GetName]'a geldi." #deepl:308682427
 frontera_fort_ross.4.f: "[SCOPE.sCharacter('john_sutter_scope').GetFullName] [SCOPE.sCountry('seller_scope').GetNameNoFlag]'ın [SCOPE.sState('california_scope').GetName]'daki tüm varlıklarını, #bold  New Helvetia #! adlı büyük yerleşim yeri için satın aldı. Bizim onayımızla, koloni asi yerlilere karşı bir tampon görevi görebilir. [SCOPE.sCharacter('john_sutter_scope').GetLastName], #bold  New Helvetia #!'nin sınır bölgesi için bir medeniyet feneri olacağını iddia ediyor. Ancak, onun istihdam ettiği yerlilere ve çevre köylerdeki yerlilere yönelik şiddetli istismarlarına dair endişe verici raporlar var. \n \n #italic "Eski dünya ölmekte, yeni dünya doğmak için mücadele ediyor: şimdi canavarların zamanıdır." — Antonio Gramsci #!" #deepl:508408470
 frontera_fort_ross.4.a: "Bu deliyi geldiği yere geri gönderin." #deepl:82128806
 frontera_fort_ross.4.b: "O, vahşi doğayı evcilleştirmemize yardım edecek!" #deepl:3671498773
 frontera_sunset_route_event.1: "Gün Batımı Rotası" #deepl:1011417108
