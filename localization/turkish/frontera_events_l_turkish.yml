 frontera_sunset_route_event.3.d: "Mesilla Vadisi'nin mülkiyeti konusundaki tartışmalar, [SCOPE.sCountry('buyer_scope').GetName] ve [SCOPE.sCountry('angry_country_scope').GetName] arasında diplomatik bir anlaşmazlığa dönüştü." #deepl:1502838723
 frontera_sunset_route_event.3.f: ""[SCOPE.sCountry('buyer_scope').GetAdjectiveNoFlag]'ın keşifçileri, sanki zaten kendilerine aitmiş gibi sınırımızı geçiyorlar," diye öfkelendi [SCOPE.sCountry('angry_country_scope').GetAdjectiveNoFlag] bakanı. [SCOPE.sCountry('angry_country_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('angry_country_scope').GetRuler.GetFullName], düşünceli bir sükunet içinde purosu içti, soluk ışık, yıpranmış yüz hatlarını kısa bir süreliğine belirginleştirdikten sonra karanlıkta kayboldu. \n \n"Satmayı reddedersem, onu alıp kaderlerini iddia edecekler."\n \n"Peki ya kabul edersen?"\n \n"Kaybetmek zorunda kaldığımız şeylerin bedeli olarak ödeme alıyoruz."" #deepl:87387247
 frontera_sunset_route_event.3.a: "Daha fazla silahlı sefer gönderin" #deepl:3471564856
