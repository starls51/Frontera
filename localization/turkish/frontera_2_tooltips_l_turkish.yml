 colonial_affairs_owner_is_discriminated_country_tt: "[GetPlayer.GetAdjective] ve [concept_homeland] adreslerine komşu olan herhangi bir [concept_state] adresi, [concept_country] adresine aittir; bu adresin [concept_primary_cultures] adreslerinin tümü, [GetPlayer.GetName] adresindeki [Concept('concept_discrimination','@acceptance_status_4! $second_rate_citizen$')] adresinin altındadır." #deepl:3595122018
 mesilla_treaty_creation_tt: "Arizona veya New Mexico’da sahip olduğunuz herhangi bir araziyi, haftalık #bold £3500 #! tutarında bir ücret karşılığında [SCOPE.sCountry('buyer_scope').GetName] adresine satmak üzere “[concept_treaty]” teklifini ekleyin. [concept_state]" #deepl:2192895926
