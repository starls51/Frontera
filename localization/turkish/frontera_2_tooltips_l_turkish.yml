 frontera_ot_homeland_not_ready_for_statehood_tt: "Bu [concept_state] adresi, en az 3 yıl daha #bold  [concept_country] adresine katılmaya çalışmayacaktır #!." #deepl:3349629079
 frontera_ot_pop_scaling_rule_tt: "$EFFECT_LIST_BULLET$ [concept_state] [Concept('concept_pop', '$concept_population$')] büyüklük #bold  85k #!—#bold  200k #!: en az #bold  %60 #! şu şekilde olmalıdır [Concept('concept_acceptance', '$concept_accepted$')] \n $EFFECT_LIST_BULLET$ [concept_state] [Concept('concept_pop', '$concept_population$')] büyüklük #bold  200k #!—#bold  500k #!: en az #bold  %45 #! şu şekilde olmalıdır [Concept('concept_acceptance', '$concept_accepted$')] \n $EFFECT_LIST_BULLET$ [concept_state] [Concept('concept_pop', '$concept_population$')] büyüklük #bold  500k #!—#bold  1m #!: en az #bold  %30 #! şu şekilde olmalıdır [Concept('concept_acceptance', '$concept_accepted$')] \n $EFFECT_LIST_BULLET$ [concept_state] [Concept('concept_pop', '$concept_population$')] büyüklük #bold  1m #! ve üzeri: en az #bold  %20 #! şu şekilde olmalıdır [Concept('concept_acceptance', '$concept_accepted$')]" #deepl:2529047697
 frontera_ot_creation_reset_tt: "Yeni bir [concept_organized_territory] oluşturmak için bekleme süresi sıfırlanacaktır \n \n #italic  Bir [GetDecreeType('decree_greener_grass_campaign').GetName] [concept_decree] öğesini, bir [concept_incorporated_state] öğesinin yanındaki bir [concept_unincorporated_state] alanına yerleştirmek, bu olay bir sonraki sefer tetiklendiğinde hangi [concept_state] öğesinin yeni [Concept('concept_organized_territory','$concept_organize_territory_possessive$')] [Concept('concept_capital_state','$concept_capital_state_short$')] olarak seçileceğini belirleyebilir. #!" #deepl:668338308
 creating_OT_frontera_tt: "#indent_newline:2 Bir [concept_organized_territory] öğesine, şu kurallara göre bir [concept_capital_state] atanacaktır: \n $EFFECT_LIST_BULLET$ [Concept('concept_unincorporated_state','$concept_unincorporated_state$')] \n $EFFECT_LIST_BULLET$ #bold  #! [ROOT.GetCountry.GetAdjectiveNoFormatting] [Concept('concept_homeland','$concept_homeland$')] \n $EFFECT_LIST_BULLET$ #bold  #! [ROOT.GetCountry.GetAdjectiveNoFormatting] [Concept('concept_incorporated_state','$concept_incorporated_state$')] ile bitişik midir? \n $EFFECT_LIST_BULLET$ [GetDecreeType('decree_greener_grass_campaign').GetName] veya [concept_state] öğelerinden en fazla talep edilmemiş olanı [concept_arable_land]" #deepl:1587096270
 creating_OT_frontera_2_tt: "#italic  İlk iki kuralı uygulayan ve yeni [concept_capital_state] adresiyle [concept_strategic_region] adresini paylaşan tüm eyaletler, [concept_organized_territory] #! adresine devredilecektir." #deepl:2838758393
