 concept_organized_territory_desc: "[GetLawType('law_frontier_territorial_administration').GetName]'i yürürlüğe koymuş bir [concept_subject] [concept_country]. Bu 'in herhangi bir [Concept('concept_incorporated_state','$concept_incorporated_states$')]'i, sonunda bir [Concept('concept_overlord','$concept_overlord_possessive$')] [Concept('concept_primary_cultures','$concept_primary_culture$')] için bir [Concept('concept_homeland','$concept_homeland$')] haline gelebilir. [concept_homeland]'in ortaya çıkabilmesi için, [Concept('concept_state','$concept_states$')]'lerinin her birinin belirli koşulları karşılaması gerekir. \n \n Aşağıdaki durumlarda [concept_state] içinde yeni bir [concept_homeland] görünecektir: \n $EFFECT_LIST_BULLET$ [Concept('concept_pop', '$concept_population$')] boyutu #bold  85.000'den #! \n $EFFECT_LIST_BULLET$ [Concept('concept_cultural_community','$concept_cultural_community$')] değeri [Concept('concept_overlord','$concept_overlord_possessive$')] [Concept('concept_primary_cultures','$concept_primary_culture$')] \n $EFFECT_LIST_BULLET$ #bold  60% #! [Concept('concept_pop', '$concept_pops$')]'in en az [Concept('concept_discrimination','@acceptance_status_5! $full_acceptance$')] veya [Concept('concept_discrimination','@acceptance_status_4! $second_rate_citizen$')] #indent_newline:3 \n #italic  Bu gereklilik #tooltippable;tooltip: [GetPlayer.GetTooltipTag],frontera_ot_pop_scaling_rule_tt eyalet nüfusu arttıkça #! azalır #! #! \n \n #bold  Organize Bölgeler #! [GetLawType('law_homesteading').GetName]'dan yararlanır ve [GetInstitutionType('institution_colonial_affairs').GetName] [concept_institution]'da [Concept('concept_investment_level', '$concept_investment_levels$')]'i artıran doğrudan bir [Concept('concept_overlord','$concept_overlord$')] vardır." #deepl:3004377925
 concept_organized_territory_desc_added: "[GetInstitutionType('institution_colonial_affairs').GetName]" #deepl:743845877
 frontera_ot_homeland_gained_homeland: "[SCOPE.sState('ascendent_state').GetName], çoğunluk hissedarı [SCOPE.sCountry('overlord_scope').GetAdjectiveNoFormatting] [Concept('concept_primary_cultures','$concept_primary_culture$')] #!'a bağlı bir [Concept('concept_homeland','$concept_homeland$')] olduğu için, artık [SCOPE.sCountry('overlord_scope').GetName] tarafından ilhak edilebilir. \n \n #italic  [concept_state]'ın bir [concept_incorporated_state] olabilmesi için yine de [Concept('concept_unincorporated_state','$concept_incorporation$')] sürecinden geçmesi gerekmektedir. #!" #deepl:3409905544
 frontera_establish_ot_in_region_tt: "[concept_organized_territory] adresi oluşturulacaktır. \n $EFFECT_LIST_BULLET$ Aşağıdaki [Concept('concept_unincorporated_state','$concept_unincorporated_states$')] adresi devredilecektir:#indent_newline:2 #indent_newline:2 " #deepl:4160631454
