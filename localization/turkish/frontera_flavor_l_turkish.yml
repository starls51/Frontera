 CAL_FLAVOR_TEXT: "Alta California, 1821 yılında yeni bağımsızlığını ilan eden Meksika'ya bağlılığını açıkladı. Meksika yetkilileri bu geniş toprakları birleştirmeye çalıştı, ancak kolonistler ve yerel Kaliforniya liderleri arasındaki gerginlikler doruk noktasına ulaştı. Hırslı sömürge güçleri tarafından kuşatılmış olan Kaliforniya'nın geleceği nasıl olacak?" #deepl:578679357
