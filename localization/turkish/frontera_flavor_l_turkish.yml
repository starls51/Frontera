 CAL_FLAVOR_TEXT: "Alta California, 1821 yılında yeni bağımsızlığını kazanmış Meksika'ya bağlılığını ilan etti. Meksikalı yetkililer bu geniş toprakları bünyesine katmaya çalışsa da, kolonistler ve yerel Kaliforniyalı liderlerle arasındaki gerginlikler doruk noktasına ulaşıyor. Hırslı sömürgeci güçlerle çevrili olan Kaliforniya'nın geleceği nasıl olacak?" #deepl:578679357
 frontera_settler_lore: "#lore  Yerleşimciler, tüccarlar, misyonerler ve askerler, toprak ve fırsat arayışıyla, çoğu zaman merkezi hükümetin kolayca ulaşamayacağı bölgelere doğru ilerliyorlar. Bu uzak bölgelerin entegre olabilmesi için, idari yapı da genişlemenin peşinden gitmelidir. Yerleşimlerin büyüdüğü yerlerde, bir gün yeni devletler egemenlik alanımıza katılabilir. #!" #deepl:5769617
