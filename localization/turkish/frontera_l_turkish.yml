 je_sunset_route_frontera: "Gün Batımı Rotası" #deepl:1011417108
 je_sunset_route_frontera_reason: "Kaliforniya'ya sıcak hava demiryolu bağlantısı, Doğu ve Batı arasında benzeri görülmemiş bir ticaret ve insan akışı sağlayacaktır. Ancak, bu proje önemli bir koordinasyon gerektirmektedir. Mülk sahipleri arasında devam eden #italic  frog wars #! anlaşmazlıklarını çözmenin yanı sıra, ölçüleri, sinyalleri ve zamanlamayı standartlaştırmak da zorunludur. Yabancı ülkeler önerilen güzergah boyunca rayların bulunduğu alanları kontrol ediyorsa bu daha zor olabilir, ancak bu görev hiçbir şekilde imkansız değildir." #deepl:1621464726
 je_sunset_route_frontera_button: "Gün Batımı Rotasını Bağlayın" #deepl:317884082
 je_sunset_route_frontera_button_desc: "Kaliforniya'ya yeni bir demiryolu güzergahı oluşturmak için çeşitli paydaşlar arasında arabuluculuk yapmak." #deepl:952386937
 je_gadsden_purchase_frontera_button: "Sınırları Test Et" #deepl:2467056109
 je_gadsden_purchase_frontera_button_desc: "Gerekli kara koridorunu fiziksel olarak kontrol altına alırsak, batıya doğru demiryolu genişlemesi daha kolay yönetilebilir hale gelecektir. Siyasi açıdan riskli olsa da, komşularımızla sınır anlaşmazlıkları çıkarmak, projemiz için arazi edinmek üzere daha fazla diplomatik veya askeri seçenek sunabilir." #deepl:1391362877
