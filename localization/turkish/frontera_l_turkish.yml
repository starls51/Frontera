 je_organized_territories_frontera: "Organize Bölge Oluşturmak" #deepl:1625332565
 je_organized_territories_frontera_reason: "Ülkemizi genişletmek amacıyla, bazı [Concept('concept_unincorporated_state','$concept_unincorporated_states$')] bölgelerimizden bir #bold  Organized Territory #! kurulabilir. Bunlar, #bold  Organized Territory #!'ye ait [Concept('concept_incorporated_state','$concept_incorporated_states$')] olacaklardır. \n \n Bir #bold  Organized Territory #!'de [GetLawType('law_homesteading').GetName] yürürlüğe girerken, en yüksek [Concept('concept_gdp','$concept_gdp_short$')]'ye sahip iki [Concept('concept_incorporated_state','$concept_states$')], [Concept('concept_migration','$concept_migration$')]'ye yıllık bonus alacaklardır. Bir #bold  Organized Territory #!'ye ait herhangi bir [Concept('concept_incorporated_state','$concept_incorporated_state$')], sonunda bir [Concept('concept_homeland','$concept_homeland$')]'ye ait [Concept('concept_overlord','$concept_overlord_possessive$')] [Concept('concept_primary_cultures','$concept_primary_culture$')] olabilir. \n #indent_newline:2 \n Bir [concept_state], aşağıdaki durumlarda bir [Concept('concept_homeland','$concept_homeland$')] haline gelir: \n $EFFECT_LIST_BULLET$ [Concept('concept_primary_cultures','$concept_primary_culture$')] \n $EFFECT_LIST_BULLET$ [Concept('concept_pop', '$concept_population$')]'ın %60'ı 65 veya daha fazla [concept_acceptance]'e sahiptir \n $EFFECT_LIST_BULLET$ [concept_state] [Concept('concept_pop', '$concept_population$')] 85.000'in üzerindedir \n \n #lore  Yerleşimciler, tüccarlar, misyonerler ve askerler, genellikle merkezi hükümetin kolayca ulaşamayacağı yerlerde, toprak ve fırsat arayışıyla dışa doğru ilerler. Bu uzak bölgelerin entegre olması için, genişlemenin ardından idare de gelmelidir. Yerleşimlerin büyüdüğü yerlerde, bir gün yeni eyaletler bizim egemenliğimize girebilir. #!" #deepl:544344828
