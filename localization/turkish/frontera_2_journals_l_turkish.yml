l_turkish:
 je_organized_territories_frontera: "Bölgeyi Düzenle" #deepl:2984011793
 je_organized_territories_frontera_reason: "Ülkeyi genişletme hedefiyle, mevcut [Concept('concept_unincorporated_state','$concept_unincorporated_states$')] adreslerinden bazıları kullanılarak bir [concept_organized_territory] adresi oluşturulabilir. Bu adresler, [concept_organized_territory]'a ait [Concept('concept_incorporated_state','$concept_incorporated_states$')] adresleri haline gelecektir. \n \n $frontera_settler_lore$" #deepl:334027685
 je_organize_territory_button: "Yeni Bir Alan Oluştur" #deepl:3442212506
 je_organize_territory_button_desc: "[Concept('concept_unincorporated_state','$concept_unincorporated_states$')]'i bir [concept_organized_territory]'a dönüştürün." #deepl:2770156865
 je_sunset_route_frontera: "Gün Batımı Rotası" #deepl:1011417108
 je_sunset_route_frontera_reason: "Kaliforniya’ya uzanan bir sıcak hava demiryolu bağlantısı, Doğu ile Batı arasında benzeri görülmemiş bir ticaret ve insan akışına olanak sağlayacaktır. Ancak bu proje, ciddi bir koordinasyon gerektirmektedir. Mülk sahipleri arasında devam eden #italic  kurbağa savaşları #! meselesini çözmenin yanı sıra, ray aralığı, sinyalizasyon ve sefer planlamasının standartlaştırılması da zorunludur. Önerilen güzergâh üzerindeki demiryolu kesimlerinin yabancı ülkeler tarafından kontrol edilmesi durumunda bu daha zor olabilir, ancak bu görev hiçbir şekilde imkânsız değildir." #deepl:2977714634
 je_sunset_route_frontera_button: "Sunset Rotasını Bağlayın" #deepl:317884082
 je_sunset_route_frontera_button_desc: "Çeşitli paydaşlar arasında arabuluculuk yaparak Kaliforniya'ya yeni bir demiryolu güzergâhı inşa etmek" #deepl:1348194334
 je_gadsden_purchase_frontera_button: "Sınırları Test Et" #deepl:2467056109
 je_gadsden_purchase_frontera_button_desc: "Gerekli arazi koridoru üzerinde fiziksel kontrol sağlanmasıyla, batıya doğru demiryolu genişletme çalışmaları daha kolay yönetilebilir hale gelecektir. Her ne kadar siyasi açıdan riskli olsa da, komşularla sınır anlaşmazlıkları çıkarmak, proje için arazi edinmek amacıyla daha fazla diplomatik veya askeri seçeneğin önünü açabilir." #deepl:110269188
 je_organized_territory_internal_frontera: "Sınır Bölgesini Nüfuslandırmak" #deepl:2132308742
 je_organized_territory_internal_frontera_reason: "[ROOT.GetCountry.GetNameNoFlag] [ROOT.GetCountry.GetTopOverlord.GetNameNoFlag]'a ait bir [concept_organized_territory]'dir. Bu [concept_subject_type], [concept_migration]'ın artırılmasını ve sonunda [concept_overlord] [concept_country] için yeni [Concept('concept_homeland','$concept_homelands$')]'ların oluşturulmasını sağlar. [concept_autonomy] elde edildiğinde, [ROOT.GetCountry.GetNameNoFlag] bir [concept_dominion]'a dönüşür ve [GetLawGroup('lawgroup_governance_principles').GetName]'ında değişiklik yapılmasına olanak tanır. \n \n $frontera_settler_lore$" #deepl:4286496753
 je_fort_ross_frontera: "Pasifik'e Açılan Kapı" #deepl:2279191856
 je_fort_ross_frontera_reason: "[GetStateRegion('STATE_CALIFORNIA').GetName] Hâlâ seyrek nüfuslu bir sınır bölgesi olarak kalmakta, İspanya’nın dayanıksız kağıt üzerindeki hak iddiası altında sallanmakta ve hırslı komşularla çevrilidir. Yine de limanları, toprakları ve kaynakları bereketle doludur. \n \n Bu bölgenin kontrolü [concept_state_region], [GetStrategicRegion('region_pacific_coast').GetName] üzerindeki güç dengesini belirlemede önemli bir rol oynayabilir." #deepl:51288871
 frontera_treaty_of_limits: "Sınır Anlaşmasının Gözden Geçirilmiş Taslağını Hazırlamak" #deepl:2091412374
 frontera_treaty_of_limits_desc: "Amerika'nın sınır bölgelerindeki yasal sınırlar komşularımız tarafından hiçe sayılıyor. Bir diplomatik heyet gönderin ve bu sorunu kökünden çözün." #deepl:1253377358
 frontera_manifest_destiny: "Nueces Şeridi'ni güçlendirin" #deepl:2389825869
 frontera_manifest_destiny_desc: "Meksika, Teksas üzerindeki egemenliğimizi henüz tanımamıştır. Nueces Nehri'nin ötesinde askeri bir varlık oluşturun ve Amerika'nın Batı'daki emelleri konusunda hiçbir şüpheye yer bırakmayın." #deepl:784934809
