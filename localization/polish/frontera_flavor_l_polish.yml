 CAL_FLAVOR_TEXT: "W 1821 roku Alta California ogłosiła lojalność wobec nowo niepodległego Meksyku. Władze meksykańskie próbowały zintegrować to rozległe terytorium, jednak napięcia między kolonistami a lokalnymi przywódcami kalifornijskimi osiągają punkt kulminacyjny. Otoczona przez ambitne mocarstwa kolonialne – jaka przyszłość czeka Kalifornię?" #deepl:578679357
 frontera_settler_lore: "#lore  Osadnicy, handlarze, misjonarze i żołnierze wyruszają w głąb lądu w poszukiwaniu ziemi i nowych możliwości, często poza zasięgiem centralnej władzy. Jeśli te odległe terytoria mają się zintegrować, ekspansja musi iść w parze z rozwojem administracji. Tam, gdzie powstają osady, nowe państwa mogą pewnego dnia zostać włączone do naszego obszaru. #!" #deepl:5769617
