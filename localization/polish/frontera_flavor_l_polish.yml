 CAL_FLAVOR_TEXT: "W 1821 roku Alta California ogłosiła lojalność wobec nowo niepodległego Meksyku. Władze meksykańskie próbowały zintegrować rozległe terytorium, ale napięcia między kolonistami a lokalnymi przywódcami kalifornijskimi osiągnęły punkt kulminacyjny. Otoczona przez ambitne mocarstwa kolonialne, jaka przyszłość czeka Kalifornię?" #deepl:578679357
