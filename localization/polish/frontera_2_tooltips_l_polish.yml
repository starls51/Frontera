 colonial_affairs_owner_is_discriminated_country_tt: "Każda strona [concept_state], znajdująca się obok [GetPlayer.GetAdjective] oraz [concept_homeland], należy do serwisu [concept_country], którego wszystkie strony [concept_primary_cultures] znajdują się poniżej [Concept('concept_discrimination','@acceptance_status_4! $second_rate_citizen$')] w serwisie [GetPlayer.GetName]." #deepl:3595122018
 mesilla_treaty_creation_tt: "Dodaj ofertę na stronie [concept_treaty], aby sprzedać posiadany grunt w Arizonie lub Nowym Meksyku na stronie [SCOPE.sCountry('buyer_scope').GetName] za tygodniową kwotę #bold £3500 #! zgodnie z informacją na stronie [concept_state]" #deepl:2192895926
