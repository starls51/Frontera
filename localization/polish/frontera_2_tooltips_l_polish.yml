 concept_organized_territory_desc: "[concept_subject] [concept_country], który wdrożył [GetLawType('law_frontier_territorial_administration').GetName]. Każdy z jego [Concept('concept_incorporated_state','$concept_incorporated_states$')] może ostatecznie stać się [Concept('concept_homeland','$concept_homeland$')] dla [Concept('concept_overlord','$concept_overlord_possessive$')] [Concept('concept_primary_cultures','$concept_primary_culture$')]. Każdy z jego [Concept('concept_state','$concept_states$')] musi spełniać określone warunki, aby [concept_homeland] mógł się pojawić. \n \n Nowa [concept_homeland] pojawi się w [concept_state], jeśli: \n $EFFECT_LIST_BULLET$ Ma [Concept('concept_pop', '$concept_population$')] o wielkości powyżej #bold  85 000 #! \n $EFFECT_LIST_BULLET$ Ma [Concept('concept_cultural_community','$concept_cultural_community$')] wynoszący [Concept('concept_overlord','$concept_overlord_possessive$')] [Concept('concept_primary_cultures','$concept_primary_culture$')] \n $EFFECT_LIST_BULLET$ Co najmniej #bold  60% #! z [Concept('concept_pop', '$concept_pops$')] to [Concept('concept_discrimination','@acceptance_status_5! $full_acceptance$')] lub [Concept('concept_discrimination','@acceptance_status_4! $second_rate_citizen$')] #indent_newline:3 \n #italic  Wymóg ten #tooltippable;tooltip: [GetPlayer.GetTooltipTag],frontera_ot_pop_scaling_rule_tt zmniejsza się #! wraz ze wzrostem liczby ludności stanu #! #! \n \n #bold  Terytoria zorganizowane #! korzystają z [GetLawType('law_homesteading').GetName] oraz bezpośredniego [Concept('concept_overlord','$concept_overlord$')] zwiększającego [Concept('concept_investment_level', '$concept_investment_levels$')] w [GetInstitutionType('institution_colonial_affairs').GetName] [concept_institution]." #deepl:3004377925
 concept_organized_territory_desc_added: "[GetInstitutionType('institution_colonial_affairs').GetName]" #deepl:743845877
 frontera_ot_homeland_gained_homeland: "Ponieważ [SCOPE.sState('ascendent_state').GetName] jest [Concept('concept_homeland','$concept_homeland$')] w stosunku do swojej większościowej [SCOPE.sCountry('overlord_scope').GetAdjectiveNoFormatting] [Concept('concept_primary_cultures','$concept_primary_culture$')] #!, może teraz zostać włączony do [SCOPE.sCountry('overlord_scope').GetName]. \n \n #italic  [concept_state] musi jednak przejść proces [Concept('concept_unincorporated_state','$concept_incorporation$')], aby stać się [concept_incorporated_state]. #!" #deepl:3409905544
 frontera_establish_ot_in_region_tt: "Zostanie utworzona strona [concept_organized_territory]. \n $EFFECT_LIST_BULLET$ Następujące adresy [Concept('concept_unincorporated_state','$concept_unincorporated_states$')] zostaną przeniesione:#indent_newline:2 #indent_newline:2 " #deepl:4160631454
 frontera_stateslist_tt: "[THIS.GetState.GetName]" #deepl:318863887
 frontera_ot_homeland_not_ready_for_statehood_tt: "Ta strona [concept_state] nie będzie próbowała połączyć się z adresem [concept_overlord] [concept_country] przez co najmniej kolejne #bold  3 lata #!." #deepl:3349629079
 frontera_ot_pop_scaling_rule_tt: "$EFFECT_LIST_BULLET$ [concept_state] [Concept('concept_pop', '$concept_population$')] rozmiar #bold  85 tys. #!—#bold  200 tys. #!: co najmniej #bold  60% #! musi wynosić [Concept('concept_acceptance', '$concept_accepted$')] \n $EFFECT_LIST_BULLET$ [concept_state] [Concept('concept_pop', '$concept_population$')] rozmiar #bold  200 tys. #!—#bold  500 tys. #!: co najmniej #bold  45% #! musi wynosić [Concept('concept_acceptance', '$concept_accepted$')] \n $EFFECT_LIST_BULLET$ [concept_state] [Concept('concept_pop', '$concept_population$')] rozmiar #bold  500 tys. #!—#bold  1 mln #!: co najmniej #bold  30% #! musi wynosić [Concept('concept_acceptance', '$concept_accepted$')] \n $EFFECT_LIST_BULLET$ [concept_state] [Concept('concept_pop', '$concept_population$')] rozmiar #bold  1 mln #! i więcej: co najmniej #bold  20% #! musi wynosić [Concept('concept_acceptance', '$concept_accepted$')]" #deepl:2529047697
 frontera_ot_creation_reset_tt: "Licznik czasu odnowienia tworzenia nowego [concept_organized_territory] zostanie zresetowany \n \n #italic  Umieszczenie [GetDecreeType('decree_greener_grass_campaign').GetName] [concept_decree] w [concept_unincorporated_state] przylegającym do [concept_incorporated_state] może decydować o tym, który [concept_state] zostanie wybrany jako nowy [Concept('concept_organized_territory','$concept_organize_territory_possessive$')] [Concept('concept_capital_state','$concept_capital_state_short$')], gdy zdarzenie to zostanie uruchomione następnym razem. #!" #deepl:668338308
 creating_OT_frontera_tt: "#indent_newline:2 Element typu `[concept_organized_territory]` otrzyma element typu `[concept_capital_state]` zgodnie z poniższymi zasadami: \n $EFFECT_LIST_BULLET$ Czy [Concept('concept_unincorporated_state','$concept_unincorporated_state$')] \n $EFFECT_LIST_BULLET$ Czy #bold  nie jest #! [ROOT.GetCountry.GetAdjectiveNoFormatting] [Concept('concept_homeland','$concept_homeland$')] \n $EFFECT_LIST_BULLET$ Czy #bold  sąsiaduje #! z [ROOT.GetCountry.GetAdjectiveNoFormatting] [Concept('concept_incorporated_state','$concept_incorporated_state$')]. \n $EFFECT_LIST_BULLET$ Czy posiada [GetDecreeType('decree_greener_grass_campaign').GetName] lub [concept_state] z największą liczbą niezajętych [concept_arable_land]" #deepl:1587096270
 creating_OT_frontera_2_tt: "#italic  Wszelkie stany, które przestrzegają dwóch pierwszych zasad i mają wspólną stronę [concept_strategic_region] z nową witryną [concept_capital_state], zostaną przypisane do [concept_organized_territory] #!." #deepl:2838758393
