 je_organized_territories_frontera: "Ustanowienie zorganizowanego terytorium" #deepl:1625332565
 je_organized_territories_frontera_reason: "W ramach dążenia do rozszerzenia naszego kraju, na niektórych naszych [Concept('concept_unincorporated_state','$concept_unincorporated_states$')] może zostać utworzone terytorium zorganizowane #bold  #!. Terytoria te staną się [Concept('concept_incorporated_state','$concept_incorporated_states$')] należącymi do terytorium zorganizowanego #bold  #!. \n \n Podczas gdy na terytorium zorganizowanym #bold  #! obowiązuje [GetLawType('law_homesteading').GetName], jego dwa [Concept('concept_incorporated_state','$concept_states$')] o najwyższym [Concept('concept_gdp','$concept_gdp_short$')] otrzymają roczną premię do [Concept('concept_migration','$concept_migration$')]. Każdy [Concept('concept_incorporated_state','$concept_incorporated_state$')] należący do terytorium zorganizowanego #bold  #! może ostatecznie stać się [Concept('concept_homeland','$concept_homeland$')] do [Concept('concept_overlord','$concept_overlord_possessive$')] [Concept('concept_primary_cultures','$concept_primary_culture$')]. \n #indent_newline:2 \n [concept_state] stanie się [Concept('concept_homeland','$concept_homeland$')], jeśli: \n $EFFECT_LIST_BULLET$ ma [Concept('concept_cultural_community','$concept_cultural_community$')] wynoszący [Concept('concept_overlord','$concept_overlord_possessive$')] [Concept('concept_primary_cultures','$concept_primary_culture$')] \n $EFFECT_LIST_BULLET$ 60% [Concept('concept_pop', '$concept_population$')] ma [concept_acceptance] wynoszący 65 lub więcej \n $EFFECT_LIST_BULLET$ [concept_state] [Concept('concept_pop', '$concept_population$')] wynosi ponad 85 000 \n \n #lore  Osadnicy, handlarze, misjonarze i żołnierze poszukują nowych terenów i możliwości, często poza zasięgiem centralnego rządu. Jeśli te odległe terytoria mają zostać zintegrowane, administracja musi podążać za ekspansją. Tam, gdzie rozwijają się osady, nowe stany mogą pewnego dnia zostać przyjęte do naszej domeny. #!" #deepl:544344828
