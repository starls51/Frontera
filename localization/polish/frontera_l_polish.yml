 je_organize_territory_button_desc: "Zorganizujcie część naszych „[Concept('concept_unincorporated_state','$concept_unincorporated_states$')]” w „#bold ” („Zorganizujcie się, aby stworzyć lepsze jutro”) „Organized Territory” („Zorganizowane terytorium”) „#!” („Zorganizujcie się, aby stworzyć lepsze jutro”)." #deepl:1558054720
