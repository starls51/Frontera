 je_sunset_route_frontera: "Trasa zachodu słońca" #deepl:1011417108
 je_sunset_route_frontera_reason: "Połączenie kolejowe z Kalifornią w sezonie letnim umożliwiłoby bezprecedensowy przepływ towarów i osób między wschodem a zachodem kraju. Projekt ten wymaga jednak znacznej koordynacji. Oprócz rozstrzygnięcia trwających sporów między właścicielami nieruchomości dotyczących skrzyżowań kolejowych (#italic ) #!, konieczne jest również ujednolicenie rozstawów torów, sygnalizacji i rozkładów jazdy. Może to być trudniejsze, jeśli zagraniczne kraje kontrolują obszary torów wzdłuż proponowanej trasy, ale zadanie to nie jest bynajmniej niemożliwe." #deepl:1621464726
 je_sunset_route_frontera_button: "Połącz trasę Sunset Route" #deepl:317884082
 je_sunset_route_frontera_button_desc: "Pośredniczyć między różnymi zainteresowanymi stronami w celu utworzenia nowej trasy kolejowej do Kalifornii." #deepl:952386937
 je_gadsden_purchase_frontera_button: "Sprawdź granice" #deepl:2467056109
 je_gadsden_purchase_frontera_button_desc: "Rozbudowa linii kolejowej na zachód będzie łatwiejsza do zrealizowania, jeśli będziemy fizycznie kontrolować niezbędny korytarz lądowy. Chociaż jest to ryzykowne z politycznego punktu widzenia, wywołanie sporów granicznych z naszymi sąsiadami może otworzyć dalsze możliwości dyplomatyczne lub militarne w celu pozyskania gruntów pod nasz projekt." #deepl:1391362877
