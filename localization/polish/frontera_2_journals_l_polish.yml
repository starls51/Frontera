l_polish:
 je_organized_territories_frontera: "Podziel terytorium" #deepl:2984011793
 je_organized_territories_frontera_reason: "W ramach dążenia do rozszerzenia zasięgu działalności w kraju, na bazie niektórych naszych oddziałów [Concept('concept_unincorporated_state','$concept_unincorporated_states$')] może powstać oddział [concept_organized_territory]. Będą to oddziały [Concept('concept_incorporated_state','$concept_incorporated_states$')] należące do [concept_organized_territory]. \n \n $frontera_settler_lore$" #deepl:334027685
 je_organize_territory_button: "Podbój nowych terenów" #deepl:3442212506
 je_organize_territory_button_desc: "Zmień adres [Concept('concept_unincorporated_state','$concept_unincorporated_states$')] na [concept_organized_territory]." #deepl:2770156865
 je_sunset_route_frontera: "Trasa o zachodzie słońca" #deepl:1011417108
 je_sunset_route_frontera_reason: "Kolejowe połączenie z Kalifornią, funkcjonujące w sezonie letnim, umożliwiłoby bezprecedensowy przepływ towarów i osób między wschodem a zachodem. Projekt ten wymaga jednak znacznej koordynacji. Oprócz rozwiązania trwających sporów dotyczących rozstawu torów #italic  #! między właścicielami nieruchomości, konieczne jest również ujednolicenie rozstawu torów, sygnalizacji i rozkładów jazdy. Może to okazać się trudniejsze, jeśli niektóre odcinki torów wzdłuż proponowanej trasy znajdują się pod kontrolą innych państw, ale zadanie to nie jest bynajmniej niemożliwe do wykonania." #deepl:2977714634
 je_sunset_route_frontera_button: "Połącz trasę Sunset" #deepl:317884082
 je_sunset_route_frontera_button_desc: "Pełnienie roli pośrednika między różnymi zainteresowanymi stronami przy budowie nowej linii kolejowej do Kalifornii" #deepl:1348194334
 je_gadsden_purchase_frontera_button: "Sprawdź granice" #deepl:2467056109
 je_gadsden_purchase_frontera_button_desc: "Rozbudowa sieci kolejowej na zachód będzie łatwiejsza do zrealizowania, jeśli uda się uzyskać fizyczną kontrolę nad niezbędnym korytarzem gruntowym. Choć wiąże się to z ryzykiem politycznym, wywołanie sporów granicznych z sąsiadami może otworzyć dodatkowe możliwości dyplomatyczne lub militarne w zakresie pozyskania gruntów na potrzeby projektu." #deepl:110269188
 je_organized_territory_internal_frontera: "Zasiedlajcie Pogranicze" #deepl:2132308742
 je_organized_territory_internal_frontera_reason: "[ROOT.GetCountry.GetNameNoFlag] jest domeną [concept_organized_territory] należącą do [ROOT.GetCountry.GetTopOverlord.GetNameNoFlag]. Ta strona [concept_subject_type] umożliwia zwiększenie [concept_migration] oraz ewentualne utworzenie nowych [Concept('concept_homeland','$concept_homelands$')] dla [concept_overlord] [concept_country]. Zdobycie [concept_autonomy] sprawi, że [ROOT.GetCountry.GetNameNoFlag] stanie się [concept_dominion] i umożliwi wprowadzanie zmian w jej [GetLawGroup('lawgroup_governance_principles').GetName]. \n \n $frontera_settler_lore$" #deepl:4286496753
 je_fort_ross_frontera: "Brama do Pacyfiku" #deepl:2279191856
 je_fort_ross_frontera_reason: "[GetStateRegion('STATE_CALIFORNIA').GetName] pozostaje słabo zaludnionym terenem przygranicznym, opierającym się na kruchych hiszpańskich roszczeniach na papierze i otoczonym przez ambitnych sąsiadów. A jednak jej porty, ziemie i zasoby obfitują w bogactwa. \n \n Kontrola nad tym [concept_state_region] może odegrać ważną rolę w kształtowaniu równowagi sił na [GetStrategicRegion('region_pacific_coast').GetName]." #deepl:51288871
 frontera_treaty_of_limits: "Opracować projekt zmienionego traktatu o granicach" #deepl:2091412374
 frontera_treaty_of_limits_desc: "Nasi sąsiedzi nie przestrzegają granic prawnych na amerykańskim pograniczu. Wyślijcie misję dyplomatyczną i rozwiążcie tę sprawę raz na zawsze." #deepl:1253377358
 frontera_manifest_destiny: "Wzmocnienie pasa Nueces" #deepl:2389825869
 frontera_manifest_destiny_desc: "Meksyk nie uznał jeszcze naszej suwerenności nad Teksasem. Należy zapewnić obecność wojskową za rzeką Nueces i nie pozostawiać żadnych wątpliwości co do ambicji Ameryki na Zachodzie." #deepl:784934809
