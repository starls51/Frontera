 law_frontier_territorial_administration: "Rada Terytorialna" #deepl:2715586447
 law_frontier_territorial_administration_desc: "Z prawnego punktu widzenia państwo jest jednostką podległą obcej potędze i nie posiada własnej suwerenności. Przyznano mu ograniczone uprawnienia do zarządzania mozaiką posiadłości terytorialnych. Zgodnie z zamierzeniami rząd terytorialny ma na celu wspieranie migracji, wzrostu liczby ludności lub sprawowania kontroli geograficznej; jego działalność może prowadzić do stopniowej integracji z nadrzędną władzą." #deepl:2928952332
 da_organize_territory_from_subject: "Powołać rząd pogranicza" #deepl:1624084733
 da_organize_territory_from_subject_desc: "Adresy [Concept('concept_law', '$concept_laws$')] i [Concept('concept_institution', '$concept_institutions$')] tej witryny [concept_subject] zostaną zmienione na [concept_organized_territory]. Odwiedzający będą częściej trafiać tutaj na stronę [Concept('concept_migration','$concept_migrate$')], ale lokalna witryna [Concept('concept_pop', '$Population$')] stanie się bardziej dostępna pod adresem [Concept('concept_radical','$concept_radicalized$')]." #deepl:3012390034
